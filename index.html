  <style>
/* Jules Berne's Pie Chart — single visual system, v0.1.102.
   The home screen is one eight-series chart with an integrated right legend.
   No historical overrides or per-version CSS patches. */
:root {
  color-scheme:light;
  --paper:#fffdfa;
  --ink:#132449;
  --muted:#5e708b;
  --rule:#d6dbe0;
  --blue:#3179e8;
  --purple:#9771d9;
  --aqua:#25c4d5;
  --orange:#eb9920;
  --lilac:#9c75bd;
  --green:#64b632;
  --pink:#ed5983;
  --sky:#269cf1;
}
* {box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar {display:none;width:0;height:0}
html,body {width:100%;height:100%;margin:0;overflow:hidden}
body {font-family:'Trebuchet MS',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select {font:inherit}
button {cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible {outline:2px solid #5697e9;outline-offset:2px}
.screen {
  width:100%;height:100dvh;display:grid;grid-template-rows:49px minmax(0,1fr);gap:0;
  padding:env(safe-area-inset-top) max(3px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(3px,env(safe-area-inset-left));
  background:var(--paper);
}
.topbar {height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;gap:7px;min-width:0}
.brand {display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.brand-mark {width:40px;height:40px;display:grid;place-items:center;flex:none}
.brand-mark img {display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 1px #1d387012)}
.brand-name {font-size:clamp(18px,6vw,31px);font-weight:900;line-height:1.04;letter-spacing:-.05em;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.top-actions {display:flex;align-items:center;margin-left:auto}
.settings-button {display:grid;place-items:center;width:40px;height:40px;padding:5px;border:0;background:none;color:#526582;flex:none}
.settings-button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.screen.history-view{--paper:#f0f0fa;--rule:#cbd0e3;background:var(--paper)}
.history-view .topbar{background:#e7e8f6;border-bottom:1px solid #d5d7ea}
.history-view .date-button,.date-button.is-picking{color:#6d49b2;background:#dbd4f2;border-radius:10px}
.chart-date-hint{position:absolute;left:50%;top:5px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;justify-content:center;gap:9px;max-width:calc(100% - 14px);padding:5px 9px;background:#f6f2ffed;border:1px solid #cab9e6;border-radius:12px;box-shadow:0 2px 8px #18244324;color:#4b3479;font-size:12px;font-weight:850;white-space:nowrap;pointer-events:auto}
.chart-date-hint[hidden],.chart-date-popup[hidden],.step-activity-badge[hidden]{display:none!important}
.chart-date-hint button{border:1px solid #b3a4d3;background:#fff;border-radius:8px;padding:3px 8px;min-height:27px;color:#59428a;font-size:12px;font-weight:900}
.chart-date-hint .chart-date-close{padding:3px 7px}
.chart-date-popup{position:absolute;top:5px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:3px;max-width:calc(100% - 12px);border:1px solid #7953ae;background:#f7f2ff;color:#553685;box-shadow:0 2px 8px #26304f38;padding:3px 4px;border-radius:11px;white-space:nowrap;font-size:12px;font-weight:900;pointer-events:auto}
.chart-date-popup.is-preview{top:39px}
.chart-date-popup-label{min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;white-space:nowrap;padding:0 3px}
.chart-date-arrow{flex:0 0 33px;width:33px;height:33px;display:grid;place-items:center;padding:0;background:#fff;border:1px solid #d1c3e7;border-radius:8px;color:#64429e}
.chart-date-arrow svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart-date-arrow:disabled{opacity:.3;cursor:default}
.chart-date-arrow[hidden]{display:none!important}
@media(max-width:420px){.chart-date-popup{font-size:11px;gap:2px}.chart-date-arrow{flex-basis:32px;width:32px;height:32px}}
.step-activity-badge{display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:#c45124;font-size:11px;font-weight:950;white-space:nowrap}
.view-date-label{font-size:10px;font-weight:900;color:#664ca3;white-space:nowrap}
.view-date-label[hidden]{display:none}
@media(max-width:620px){.view-date-label{display:none}}
.past-entry-note{display:block;font-size:12px;font-weight:850;color:#7155a0;text-align:center;margin:-3px 0 -10px}
.food-measure-explanation{font-size:12px!important;color:#536a83!important;line-height:1.35!important;margin:0!important}
.food-measure-amount{position:relative;min-width:0}
.food-measure-amount input{padding-right:32px!important}
.food-measure-unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#6d7990;pointer-events:none}
.food-diary-row{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:12px 3px;background:transparent;border:0;border-bottom:1px solid #d7dfec;color:var(--ink)}
.food-diary-row span:first-child{font-size:14px;font-weight:850;min-width:0;overflow-wrap:anywhere}
.food-diary-row small{display:block;font-size:11px;color:#667b94;font-weight:600;margin-top:3px}
.food-diary-qty{font-size:13px;font-weight:850;color:#4e6381;white-space:nowrap}
.food-diary-line{display:flex;align-items:center;gap:3px;border-bottom:1px solid #d7dfec}
.food-diary-line .food-diary-row{border-bottom:0;flex:1;min-width:0}
.food-diary-delete{flex:none;width:30px;height:32px;padding:3px;border:0;border-radius:9px;background:transparent;color:#8190a4;font-size:17px}
.food-diary-delete:focus-visible,.food-diary-delete:hover{background:#f9ecee;color:#9f3c48}
.activity-browse{display:grid;gap:10px}

.activity-library-results{display:grid;gap:5px}
.activity-library-result{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:47px;text-align:left;padding:10px 3px;border:0;border-bottom:1px solid #e2e7ee;background:transparent;color:var(--ink)}
.activity-library-create{background:#f5f1ff;color:#684a9b;font-weight:850;border-radius:8px}
.activity-form [hidden]{display:none!important}
.activity-step-dialog .activity-step-choices{display:grid;gap:9px;margin:12px 0}
.activity-step-dialog .activity-step-choices label{display:flex;align-items:center;gap:10px;min-height:44px;
  padding:10px 11px;border:1px solid #c6d4e5;border-radius:11px;background:#f5f7fc;color:#304c72;
  font-size:14px;font-weight:800}
.activity-step-dialog input[type="radio"]{width:19px;height:19px;flex:none;accent-color:#8262cf}
.food-diary-empty{padding:13px 2px;color:#667b94;font-size:13px}
.food-diary-section{font-size:13px;font-weight:850;color:#425a78;margin:13px 0 4px;padding:0 3px 6px;border-bottom:1px solid #c6d4e5}
.food-diary-section.favourites{margin-top:17px;padding-top:20px;font-size:14px;color:#685489}
.diary-favourites-box{margin:16px 0 6px;padding:9px 11px 7px;border:1px solid #c9bde6;
  border-radius:13px;background:#faf8ff;min-width:0}
.diary-favourites-box[hidden]{display:none}
.diary-favourites-box .food-diary-section.favourites{margin:0 0 4px;padding:2px 3px 8px;
  border-bottom:1px solid #d9d0eb}
.diary-favourites-box .food-result:last-child,
.diary-favourites-box .activity-library-result:last-child{border-bottom:0}
.diary-favourites-box .activity-library-results{margin-top:2px}

.food-diary-section[hidden]{display:none}

.main-area {
  --legend-width:clamp(112px,calc(25.4vw + 12px),232px);
  display:grid;grid-template-columns:minmax(0,1fr) var(--legend-width);
  min-height:0;min-width:0;gap:0;
}
.chart-shell {position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#chart {display:block;width:100%;height:100%;font-family:inherit;overflow:hidden}
.metric-row {position:relative;min-height:0;min-width:0;background:var(--paper);isolation:isolate}
.metric-divider {position:absolute;left:0;right:0;height:1px;background:var(--rule);pointer-events:none;z-index:2}
.metric {
  --line:#3179e8;
  position:absolute;left:0;right:0;width:100%;margin:0;padding:0 28px 0 6px;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;
  background:transparent;color:var(--ink);border:0;border-radius:0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.metric[hidden] {display:none}
/* The right-hand colour strip is a true progress bar: 30% colour wash,
   with a full-colour segment rising from its foot. No target = no fill. */
.metric-ratio {
  position:absolute;right:0;top:5%;height:90%;width:12px;
  background:color-mix(in srgb,var(--line) 30%,white 70%);
  overflow:hidden;pointer-events:none;
}
.metric-ratio-fill {
  display:block;position:absolute;bottom:0;left:0;right:0;
  height:calc(var(--ratio,0) * 100%);background:var(--line);
}
/* Carry the timeline baseline through the legend to the edge of the frame. */
.axis-legend-line {position:absolute;left:0;right:0;top:var(--axis-y,calc(100% - 25px));height:1px;background:#aab1be;pointer-events:none;}
.main-area {position:relative}
.axis-yesterday {position:absolute;z-index:4;transform:translateX(-50%);pointer-events:none;color:#283d5b;
  font-size:clamp(10px,1.15vw,13px);font-weight:900;line-height:1.1;white-space:nowrap}
.metric.drag-ready {outline:1px dashed #8292aa;outline-offset:-2px}
.metric.dragging {z-index:15;background:var(--paper);opacity:.9}
.metric-topline {display:flex;align-items:baseline;gap:4px;max-width:100%;white-space:nowrap;min-width:0}
.metric-head {display:inline-flex;align-items:baseline;gap:3px;color:var(--ink);font-size:var(--name-size,15px);font-weight:900;line-height:1.08;letter-spacing:-.045em;white-space:nowrap}
.metric-icon {font-size:var(--icon-size,16px);line-height:1;align-self:center;min-width:0}
.metric-percent {display:block;max-width:100%;color:var(--line);font-weight:900;font-size:var(--pct-size,37px);line-height:.91;letter-spacing:-.055em;white-space:nowrap;font-variant-numeric:tabular-nums}
.metric-reading {color:var(--ink);font-size:var(--value-size,13px);font-weight:900;line-height:1.06;white-space:nowrap;letter-spacing:-.035em}
.metric-target {color:#526582;font-size:var(--target-size,10px);font-weight:700;line-height:1.06;white-space:nowrap;letter-spacing:-.022em}
.metric-target:empty {display:none}
.metric-calories .metric-target {font-size:calc(var(--target-size,10px) * .87)}
.metric-weight {--line:var(--blue)}
.metric-steps {--line:var(--purple)}
.metric-water {--line:var(--aqua)}
/* A deliberately unhurried, layout-stable confirmation after Water is queued
   locally. The soft bloom swells behind the whole row; the text never jumps. */
.metric-water {isolation:isolate}
.metric-water::before {
  content:"";position:absolute;inset:2px 19px 2px 1px;z-index:-1;
  border-radius:12px;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 34% 50%,rgba(41,197,209,.30) 0%,rgba(41,197,209,.14) 40%,transparent 78%);
}
.metric-water.water-saved-flash::before {
  animation:water-saved-halo 2600ms ease-in-out both;
}
.metric-water.water-saved-flash .metric-head,
.metric-water.water-saved-flash .metric-percent,
.metric-water.water-saved-flash .metric-reading {
  animation:water-saved-ink 2600ms ease-in-out both;
}
@keyframes water-saved-halo {
  0% {opacity:0;transform:scaleX(.82)}
  24% {opacity:1;transform:scaleX(1)}
  55% {opacity:.9;transform:scaleX(1.04)}
  100% {opacity:0;transform:scaleX(1.09)}
}
@keyframes water-saved-ink {
  0% {filter:none;text-shadow:none}
  24% {filter:brightness(1.09);text-shadow:0 0 7px #25c4d58f,0 0 16px #25c4d555}
  55% {filter:brightness(1.12);text-shadow:0 0 10px #25c4d5aa,0 0 22px #25c4d560}
  100% {filter:none;text-shadow:none}
}
/* A rejected server write is not another success event: show a separate warning. */
.water-sync-warning {
  position:fixed;z-index:120;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  transform:translateX(-50%);width:min(calc(100vw - 28px),430px);
  display:flex;gap:10px;align-items:flex-start;padding:13px 14px;
  color:#6d252e;background:#fff5f5;border:1px solid #d59ca2;border-radius:12px;
  box-shadow:0 3px 18px #14283c30;font-size:13px;font-weight:750;
}
.water-sync-warning button {border:0;background:transparent;color:inherit;font-size:22px;line-height:1;padding:0 0 0 8px;cursor:pointer}
.water-sync-warning[hidden] {display:none!important}
@media (prefers-reduced-motion:reduce) {
  .metric-water.water-saved-flash::before {animation:none;opacity:.68}
  .metric-water.water-saved-flash .metric-head,
  .metric-water.water-saved-flash .metric-percent,
  .metric-water.water-saved-flash .metric-reading {animation:none;filter:brightness(1.10);text-shadow:0 0 7px #25c4d57f}
}

.metric-calories {--line:var(--orange)}
.metric-fibre {--line:var(--lilac)}
.metric-protein {--line:var(--green)}
.metric-fats {--line:var(--pink)}
.metric-carbs {--line:var(--sky)}
.visibility-btn {
  position:absolute;right:15px;top:50%;transform:translateY(-50%);z-index:2;
  border:0;border-radius:50%;background:#ffffffb5;color:#8a97a8;
  width:15px;height:15px;display:grid;place-items:center;font-size:10px;opacity:.34;padding:0;
}
.visibility-btn[aria-pressed='false'] {opacity:.6}
.hidden-metrics-toggle {
  position:absolute;right:4px;bottom:3px;z-index:20;padding:4px 7px;border:1px dashed #b9c3d4;
  background:#ffffffed;border-radius:8px;color:#64748c;font-size:10px;font-weight:900;
}
.hidden-metrics-toggle[hidden],.hidden-metrics-popup[hidden] {display:none}
.hidden-metrics-popup {position:absolute;right:0;bottom:29px;z-index:21;min-width:135px;background:#fff;
  border:1px solid #ccd6e4;border-radius:10px;box-shadow:0 7px 20px #192b4b33;padding:7px;display:grid;gap:5px}
.hidden-metrics-popup button {background:#f4f8fd;color:#243a5c;border:1px solid #d4e0ee;border-radius:7px;text-align:left;padding:7px 8px;font-size:12px}
/* Recording screens — cohesive touch controls in PieChart's soft paper palette. */
.entry-backdrop[hidden] {display:none}
.entry-backdrop {position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  background:rgba(19,36,73,.44);backdrop-filter:blur(3px);overflow:hidden}
/* The dialog follows the *visible* mobile viewport, not the area hidden by a keyboard.
   All form screens scroll in one pane; the title and close button remain reachable. */
.entry-sheet {width:min(570px,96vw);max-height:calc(var(--entry-visible-height,100dvh) - 20px);
  min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);
  border:1px solid #d6dfeb;border-radius:20px;box-shadow:0 16px 48px #14223f45;padding:18px}
/* Daily records use one consistent 90%-height dialog, independent of list length.
   The on-screen keyboard still reduces the available visible height. */
.food-diary-entry .entry-sheet,.daily-entry-view .entry-sheet {height:calc(var(--entry-visible-height,100dvh) * .9)}
/* The large number uses the same bold, tight treatment as the home metrics. */
.daily-remaining {display:flex;align-items:baseline;justify-content:center;gap:5px;flex-wrap:wrap;
  width:100%;padding:8px 5px 14px;text-align:center;color:var(--ink);line-height:1.2}
.daily-remaining strong {font-size:clamp(29px,7vw,39px);font-weight:900;letter-spacing:-.055em;line-height:1}
.daily-remaining span {font-size:14px;font-weight:850;line-height:1.2}
.daily-remaining.calories strong {color:var(--orange)}
.daily-remaining.water strong {color:var(--aqua)}
.daily-remaining.steps strong {color:var(--purple)}
.daily-remaining.unavailable {color:#667b94}
.daily-remaining.unavailable span {font-size:14px}
.daily-entry-view .entry-titlebar {margin-bottom:10px}
.water-entry-list {display:grid}
/* Regular weight entry shares the daily forms' numeric control and spacing. */
.weight-form {display:grid;gap:13px;align-content:start}
.weight-form label {font-size:14px;font-weight:850}
.weight-form input {min-height:51px;font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;text-align:center}
.weight-form .entry-actions {margin-top:6px}

#entry-content {min-height:0;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:auto;
  overflow-x:hidden;scroll-padding-block:12px 28px;-webkit-overflow-scrolling:touch}
#entry-content input,#entry-content textarea,#entry-content select {scroll-margin-block:12px 28px}
.entry-titlebar {display:flex;flex:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.entry-titlebar h2 {margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:clamp(18px,2.4vw,24px);font-weight:900;letter-spacing:-.035em;color:var(--ink)}
.entry-title-actions,.entry-day-nav {display:flex;align-items:center;gap:5px;flex:none}
.entry-day-nav[hidden]{display:none!important}
.entry-day-arrow {flex-basis:35px;width:35px;height:35px}
/* Daily dialogs use the same lavender history context as the graph and binoculars. */
.history-view .entry-sheet{background:#f0f0fa;border-color:#c6b9e0}
.history-view .entry-titlebar{background:#e7e8f6;border:1px solid #d5d7ea;border-radius:11px;padding:5px 7px}
.history-view .entry-day-arrow{color:#64429e;border-color:#c6b6df}
@media(max-width:420px){.entry-titlebar{gap:5px}.entry-title-actions,.entry-day-nav{gap:3px}.entry-day-arrow{flex-basis:32px;width:32px;height:32px}}
.close-entry {width:35px;height:35px;border:1px solid #d4deeb;border-radius:50%;background:#fff;color:var(--ink);font-size:22px;line-height:1}
.entry-sheet p {font-size:12px;line-height:1.35;color:var(--muted);margin:5px 0 11px}
.entry-form {display:grid;gap:12px;min-height:0;padding:2px}
.entry-form label {font-weight:900;font-size:13px;color:#435875}
.entry-form input,.entry-form select {width:100%;border:1px solid #bfcede;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}
.entry-affirm,.entry-cancel {min-height:47px;border-radius:13px;padding:11px 19px;font-weight:900;font-size:15px;touch-action:manipulation}
.entry-affirm {background:#8262cf;color:#fff;border:1px solid #8262cf;box-shadow:0 2px 5px #7861b525}
.entry-affirm:disabled {opacity:.4;cursor:default}
.entry-cancel {background:#eef3fa;color:#314d72;border:1px solid #d6e0ec}
.entry-actions {display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.entry-actions.single-action {grid-template-columns:minmax(0,1fr)}
.entry-note {font-size:11px!important;color:#75849a!important}
.water-recents {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:58px;gap:10px;align-items:stretch}
.water-recents button {width:100%;height:100%;min-height:0;margin:0;padding:4px;border-radius:13px;border:1px solid #a9e0e8;
  background:#e2f8fc;color:#156a84;font-weight:900;font-size:clamp(13px,2.5vw,17px);box-shadow:0 2px 4px #2e92a313;touch-action:manipulation}
.water-recents button:active {transform:scale(.98);background:#c8f2f7}

  .entry-sheet {padding:12px}

  .water-recents {grid-auto-rows:51px;gap:8px}

  .screen {grid-template-rows:34px minmax(0,1fr)}
  .topbar {height:34px}
  .brand-mark {width:29px;height:29px}
  .brand-name {font-size:clamp(16px,2.7vw,23px)}
  .settings-button {width:31px;height:31px}
  .main-area {--legend-width:clamp(120px,17vw,185px)}
}

.settings-links {gap:10px}
.settings-links button {width:100%;text-align:left}
.account-page {gap:10px}
.account-page .entry-note {margin:0;overflow-wrap:anywhere}
.account-actions {display:flex;flex-wrap:wrap;gap:8px}
/* Owner-private activity log. Simple controls; scrollable content, no visible scrollbar. */
.activity-form {display:grid;gap:10px}
.activity-form input,.activity-form select {width:100%;min-width:0;font-size:16px}
/* Activity favourites reuse the shared form-toggle control. */
.activity-estimate {font-size:12px;line-height:1.45}
.activity-history {display:grid;gap:6px;margin-top:12px}
.activity-history h3 {margin:5px 0 1px;font-size:14px;color:var(--ink)}
.activity-log-empty,.food-diary-empty{color:#667b94;font-size:13px}
/* Owner-private target editing within Settings. No invented defaults. */
.targets-form {display:grid;gap:10px}
.targets-form .target-field {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,140px);gap:10px;align-items:center;border-bottom:1px solid #e4e9f0;padding:4px 0 10px}
.targets-form .target-field label {display:flex;flex-direction:column;gap:2px}
.targets-form .target-field label small {font-size:11px;color:#7b8ba2;font-weight:550}
.targets-form .target-field input,.targets-form .target-field select {width:100%;min-width:0;text-align:right;font-variant-numeric:tabular-nums}
.targets-form .details-section {font-size:13px;font-weight:750;color:var(--ink);margin:8px 0 0;padding-bottom:3px}
.targets-form .details-section:first-child {margin-top:0}
.targets-form .target-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:3px}
.targets-form p {margin:2px 0!important}
/* A Food Item can be favourited just like a Dish or Meal. */
/* All library editors use one consistent, accessible checkbox style. */
.form-toggle {display:flex;align-items:center;gap:9px;min-width:0;min-height:36px;margin:0;
  color:#435875;font-size:13px;font-weight:800;line-height:1.3;cursor:pointer}
.form-toggle input[type="checkbox"] {flex:0 0 19px;width:19px;height:19px;margin:0;accent-color:#8262cf;cursor:pointer}
.form-toggle:focus-within {color:var(--ink)}
/* Number fields scroll normally unless an intentional press-and-hold activates
   scrubbing. During a touch hold they stay read-only to avoid opening the keyboard. */
.entry-sheet input[type="number"] {touch-action:pan-y}
.entry-sheet input[type="number"].number-scrub-active {box-shadow:0 0 0 2px #719cc988;-webkit-touch-callout:none}
/* Food lookup: one uncluttered source-labelled result list, no grouped headings or cards. */
.food-library-panel {display:block}
.food-browse {display:flex;flex-direction:column;min-height:0}
.food-lookup-controls {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;margin:0 0 7px}
/* Shared Recorded -> Search arrangement in Today's Food and Activities.
   Both diaries use one layout helper, so spacing and ordering stay aligned. */
.daily-recorded-search{display:flex;flex-direction:column;gap:26px;min-width:0}
.daily-recorded-search .daily-recorded-content[hidden]{display:none}
.daily-recorded-search .daily-search-content{min-width:0}
.food-diary-entry .food-lookup-controls {margin-top:0}
.food-search {min-width:0;width:100%;padding:12px 13px;border:1px solid #b6c9dd;border-radius:11px;background:#fff;font-size:16px;color:var(--ink)}
/* 16px prevents mobile browser zoom; use a quiet, inset focus indication instead of an outer outline. */
.food-search:focus,.food-search:focus-visible {outline:none;outline-offset:0;border-color:#719cc9;box-shadow:inset 0 0 0 1px #719cc9}
.food-lookup-controls button {min-height:45px;padding:9px 16px;border:1px solid #bfd0e5;background:#eef3fa;color:#314d72;border-radius:11px;font-size:14px;font-weight:900}
.food-search-status {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.food-result-groups {min-height:0;min-width:0;max-width:100%;overflow-x:hidden;padding-right:0;background:transparent}
.food-library-entry #entry-content {scrollbar-width:none;scrollbar-gutter:auto;-ms-overflow-style:none}
.food-library-entry #entry-content::-webkit-scrollbar {display:none}
.food-result {display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:100%;min-width:0;min-height:47px;padding:10px 3px;border:0;border-bottom:1px solid #e2e7ee;border-radius:0;background:transparent;text-align:left;color:var(--ink)}
.food-result:active {background:#f0f5fc}
.food-result>span:first-child {flex:1 1 auto;min-width:0;max-width:100%;overflow-wrap:anywhere}
.food-result .food-result-title {display:block;font-size:14px;font-weight:800;line-height:1.28;overflow-wrap:anywhere}
.food-result .food-result-secondary {display:block;color:#73849a;font-size:11px;line-height:1.3;margin-top:1px}
/* A source result is not yet in the shared food library. Make its whole description distinctly lighter. */
.food-result.external .food-result-title {color:#8897aa;font-weight:600}
.food-result.external .food-result-secondary {color:#9eacbc}
.food-source-tag {flex:0 1 auto;min-width:0;max-width:79px;font-size:11px;font-weight:700;line-height:1.3;text-align:right;white-space:normal;overflow-wrap:anywhere;color:#7b8899}
/* Approved record types use the existing chart colours; sources stay plain text. */
.food-source-tag.local {color:var(--green)}
.food-source-tag.type-dish {color:var(--orange)}
.food-source-tag.type-meal {color:var(--purple)}
.food-source-tag.type-food-item {color:var(--green)}
.food-source-tag.nz {color:#3576ac}
.food-source-tag.au {color:#6d65a6}
.food-source-tag.usda {color:#916c41}
.food-source-tag.barcode {color:#9a733b}
.food-create-row {color:#5d4a94;font-weight:800;border-top:1px solid #e2e7ee}
.food-create-row .food-result-title {font-weight:800}
.food-list-message {border-bottom:1px solid #e2e7ee;padding:13px 3px;font-size:12px;color:#71839a;line-height:1.4}
.food-camera-message{font-size:12px;color:#37526e;background:#e6f4ff;padding:9px;border-radius:8px;margin:0 0 10px;min-width:0;max-width:100%}
.food-camera-message video{display:block;width:100%;max-width:100%}
.food-copy-action {width:100%;text-align:center;border-style:solid;background:#f3f7fb;font-size:13px}
.food-copy-status {font-size:12px;color:#385f7a;min-height:16px;margin:0!important}
.food-licences {color:#667d97;font-size:11px}
.food-licences summary {cursor:pointer;font-weight:700}
.food-licences p{font-size:11px!important;line-height:1.4!important}
.food-licences a{color:#386b98}
@media(max-height:540px) and (orientation:landscape) {
  .food-lookup-controls {margin-bottom:3px}
  .food-search,.food-lookup-controls button {min-height:39px;padding:7px 11px}
}
.food-review[hidden],.food-browse[hidden] {display:none}
.food-review {display:grid;gap:12px}
.food-field-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food-field-grid .wide {grid-column:1/-1}
.food-field {display:flex;flex-direction:column;gap:4px;min-width:0}
.food-field label {font-size:13px;color:#435875;font-weight:900}
.food-field input,.food-field select {width:100%;padding:11px 12px;border:1px solid #bfcede;border-radius:11px;background:#fff;color:var(--ink);font-size:16px}
/* One cohesive nutrient panel for Food Items, Dishes, and Meals. Five equal
   cards always stay on one row. Editors and calculated recipe totals reuse the
   same structure and colours; only the value controls differ. */
.food-preferences-row {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:8px 12px}
.food-preferences-row .form-toggle {align-items:center}
.food-preferences-row .food-water-allocation {border:0;padding:0;gap:4px;min-width:0}
.food-preferences-row #food-water-controls {margin-top:5px}
.food-nutrition {--food-value-ink:#3d5876;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,1.1vw,9px);width:100%;min-width:0}
.food-nutrient-row {--card-accent:var(--green);position:relative;display:grid;grid-template-rows:15px minmax(0,1fr);
  align-items:stretch;min-width:0;min-height:80px;padding:6px 3px 6px;
  border:1px solid #dde5ef;border-top:6px solid var(--card-accent);border-radius:11px;
  background:color-mix(in srgb,var(--card-accent) 4%,white);text-align:center;
  box-shadow:0 1px 2px #182f510b}
.food-nutrient-row[data-nutrient="calories"]{--card-accent:var(--orange)}
.food-nutrient-row[data-nutrient="protein"]{--card-accent:var(--green)}
.food-nutrient-row[data-nutrient="fats"]{--card-accent:var(--pink)}
.food-nutrient-row[data-nutrient="carbs"]{--card-accent:var(--sky)}
.food-nutrient-row[data-nutrient="fibre"]{--card-accent:var(--lilac)}
.food-card-label {display:block;min-width:0;font-size:clamp(10px,2.5vw,12px);font-weight:850;
  line-height:1.1;color:var(--ink);white-space:nowrap}
.food-card-values {display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  padding-top:4px;gap:2px;min-width:0}
.food-unit-input {display:flex;align-items:baseline;justify-content:center;position:relative;min-width:0;width:100%;
  padding:0;border:1px solid transparent;border-radius:5px;background:transparent}
.food-unit-input:focus-within {border-color:#739dc7;background:#f4f8ff;box-shadow:0 0 0 1px #739dc7}
.food-unit-input input {display:block;flex:0 1 auto;width:auto;min-width:0;max-width:calc(100% - 12px);field-sizing:content;height:21px;min-height:21px;
  padding:0!important;border:0!important;border-radius:0;background:transparent!important;
  color:var(--food-value-ink);text-align:center;font-size:clamp(12px,3.6vw,18px);font-weight:850;
  font-variant-numeric:tabular-nums;letter-spacing:-.045em;appearance:textfield;-moz-appearance:textfield;
  box-shadow:none!important;outline:none}
.food-unit-input input::-webkit-outer-spin-button,.food-unit-input input::-webkit-inner-spin-button {-webkit-appearance:none;margin:0}
.food-unit-input .unit {flex:none;color:#576b82;font-size:clamp(9px,2.35vw,12px);
  font-weight:650;letter-spacing:-.02em;pointer-events:none}
.food-energy-fields {display:flex;flex-direction:column;gap:1px;justify-content:center;min-width:0}
.food-nutrient-energy .food-unit-input input {font-size:clamp(11px,3.25vw,17px)}
.food-nutrient-energy .food-unit-input:last-child input {font-size:clamp(11px,3.15vw,16px);font-weight:750}
.food-nutrient-row.is-estimated .food-unit-input {background:#fff5e5}
/* Centre the Fibre value and its Estimate action as a single group in the
   available card space. Do not reserve a third row in the other four cards. */
.food-card-values.has-estimate {justify-content:center;padding-top:0;gap:4px}
.food-card-footer {display:flex;min-width:0;width:100%;justify-content:center}
.food-fibre-estimate-button {display:block;width:100%;min-width:0;margin:0;border:1px solid #d3c7e5;
  background:#f2ebfa;color:#684c8a;border-radius:5px;padding:2px 0;font-size:clamp(9px,2.15vw,11px);
  font-weight:750;line-height:1.1;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.food-fibre-estimate-button:disabled {opacity:.55;cursor:wait}
.food-card-readonly {display:flex;align-items:baseline;justify-content:center;min-width:0;white-space:nowrap;color:var(--food-value-ink);
  font-size:clamp(12px,3.6vw,18px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.food-card-readonly .unit {font-size:clamp(9px,2.35vw,12px);font-weight:650;letter-spacing:-.02em;color:#576b82}
.food-card-readonly.secondary {font-size:clamp(11px,3.15vw,16px);font-weight:750}
.food-nutrition.is-readonly .food-nutrient-row {min-height:80px}
/* Round the *display* of Cal values only. The editable field retains its
   original precise number, revealed on typing or scrubbing. */
/* The underlying precise calorie input remains interactive across the
   entire value row. The rounded display is a natural flex child, so its
   number and unit centre together exactly like readonly recipe values. */
.food-unit-input.food-whole-energy input {position:absolute;inset:0;width:100%;max-width:none;height:100%;opacity:0;cursor:text}
.food-whole-energy-readout {display:inline-block;pointer-events:none;color:var(--food-value-ink);
  font-size:clamp(11px,3.15vw,16px);font-weight:750;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.food-whole-energy:focus-within input,.food-whole-energy:has(input.number-scrub-active) input {position:static;width:auto;max-width:calc(100% - 22px);height:21px;opacity:1;color:var(--food-value-ink)!important;-webkit-text-fill-color:var(--food-value-ink)}
.food-whole-energy:focus-within .food-whole-energy-readout,.food-whole-energy:has(input.number-scrub-active) .food-whole-energy-readout {display:none}
@media (max-width:365px) {
  .food-nutrition {gap:3px}
  .food-nutrient-row {padding:6px 1px 6px;border-radius:9px}
  .food-preferences-row {gap:6px 8px}
}
@media (min-width:660px) {
  .food-nutrient-row,.food-nutrition.is-readonly .food-nutrient-row {min-height:80px;padding:7px 7px 7px;grid-template-rows:17px minmax(0,1fr)}
  .food-unit-input {gap:2px}
}
.food-fibre-reference {color:#536e86;font-size:12px;line-height:1.35;overflow-wrap:anywhere;padding:0 2px}
.food-fibre-reference:empty {display:none}
.food-fibre-reference a {color:#285e9d;text-decoration:underline;text-underline-offset:2px}

/* Source-supported fibre suggestions, separate from accepted Food Item values. */
.fibre-estimate-summary {font-weight:850;font-size:12px;color:#344d6b;margin-bottom:3px}
.fibre-estimate-controls {margin-top:8px}
.fibre-estimate-controls label,.fibre-estimate-control {display:flex;flex-direction:column;gap:4px;font-weight:750;margin:6px 0}
.fibre-estimate-controls select,.fibre-estimate-control select {width:100%;max-width:100%;min-height:38px;padding:7px;border:1px solid #c5d4e5;border-radius:7px;background:#fff;color:var(--ink);font-size:13px}
.fibre-estimate-link-button {display:block;margin:5px 0;padding:3px 0;border:0;background:transparent;color:#285e9d;font-size:11px;text-decoration:underline;text-align:left;cursor:pointer}
.fibre-estimate-details {margin:7px 0;border-top:1px solid #dbe5f0;padding-top:4px}
.fibre-estimate-details summary {cursor:pointer;font-weight:750}
.fibre-estimate-details div {margin:6px 0 0}
.fibre-estimate-details a {display:inline-block;margin-bottom:5px}
.fibre-estimate-accept {margin:8px 0 3px;border:1px solid #a4bcd8;background:#e9f2fc;color:#234b72;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
.food-unit-input input::placeholder {color:#9b9eaa;font-size:12px}
.food-measures {display:grid;gap:7px}
.food-measure-row {display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:7px}
.food-measure-row input {min-width:0;width:100%;border:1px solid #c5d4e5;border-radius:8px;padding:8px 10px;background:#fff}
.food-measure-row button {border:1px solid #d2dce8;background:#f4f7fc;border-radius:8px;color:var(--ink);font-weight:900}
.food-secondary-action {background:transparent;border:1px dashed #bccbdd;border-radius:10px;color:#405d80;padding:9px 12px;font-size:12px;font-weight:900}
.food-review-actions {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food-alert {font-size:12px;font-weight:800;color:#a14926;min-height:16px;margin:0!important}
@media(max-height:540px) and (orientation:landscape) {
  .food-review {gap:8px}
}


/* Nutrition-panel scan: one action and a transient status line, no extra permanent form clutter. */
.food-np-scan {width:100%;min-height:43px;border:1px solid #afc8e0;border-radius:10px;background:#edf4fc;color:#324f73;font-size:13px;font-weight:850;cursor:pointer}
.food-np-scan:disabled {opacity:.64;cursor:progress}
.food-np-status {min-height:0!important;margin:0!important;color:#426381!important;font-size:12px!important;line-height:1.4!important}
.food-np-status:empty {display:none}
.food-np-status.is-error {color:#9d3f2e!important}
.food-np-changed .food-unit-input {border-color:#5a91bd;background:#f5faff}
/* Unconfirmed scanner readings are visible and editable, but never masquerade as verified. */
.food-np-provisional {background:#fff9ec;border-color:#bd8a3e}
.food-np-provisional .food-card-label::after {content:" · check";font-size:10px;font-weight:700;color:#9a642a}
.food-barcode-error-link {display:inline-block;margin-top:6px;color:#275f9a;text-decoration:underline;font-weight:750}

.food-np-choice[hidden]{display:none!important}
.food-np-choice{padding:10px 0 0;max-width:100%}
.food-np-choice p{font-size:12px;font-weight:650;color:#344d6b;margin:0 0 7px}
.food-np-choice img{display:block;max-width:100%;width:auto;height:auto;max-height:350px;border:1px solid #bdd0e3;border-radius:8px;cursor:crosshair;touch-action:manipulation}
.food-np-cancel{border:1px solid #c2d0dd;background:#f1f5f9;color:#3a5878;border-radius:9px;padding:9px 18px;margin-top:9px;font-weight:750}



/* Food Item hydration allocation follows its inline checkbox. */
.food-water-allocation {display:grid;gap:5px;border:0;padding:0}
.food-water-toggle {align-items:center}
.food-water-allocation #food-water-controls {display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:7px 10px}
.food-water-allocation #food-water-controls[hidden] {display:none}
.food-water-allocation #food-water-controls>label {font-size:12px;font-weight:700;line-height:1.35;color:#536d86}
.food-water-number {display:flex;align-items:center;gap:5px}
.food-water-number input {min-width:0;width:100%;padding:8px 7px;border:1px solid #bfd0e5;border-radius:8px;text-align:right;background:#fff;color:var(--ink)}
.food-water-number span {font-size:13px;font-weight:800}
.food-water-allocation output {grid-column:1/-1;font-size:12px;line-height:1.4;color:#4b657e}

/* Dish / Meal composition: quiet controls, the same one-list search language. */
.food-compose[hidden]{display:none}
.food-compose{display:grid;gap:11px;min-width:0}
.food-compose .food-field>input{width:100%}
.food-create-recipe .food-result-title{color:var(--orange)}
.food-create-recipe.type-meal .food-result-title{color:var(--purple)}
.recipe-pick-list[hidden]{display:none}
.recipe-pick-list{max-height:min(38dvh,290px);overflow:auto;border-bottom:1px solid #e2e7ee}
.recipe-lines{display:grid;gap:6px}
.recipe-line{display:grid;grid-template-columns:24px minmax(0,1fr) 66px 92px 27px;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #e2e7ee;min-width:0}
.recipe-line.is-dragging{background:#edf2fa;border-radius:8px;box-shadow:inset 0 0 0 1px #a7bcd6}
.recipe-line.is-drop-target{border-top:2px solid #8664c9}
.recipe-grip{border:0;background:transparent;color:#69809c;font-size:20px;line-height:1;padding:8px 1px;touch-action:none;user-select:none;cursor:grab}
.recipe-grip:active{cursor:grabbing}
/* Save decisions are a genuine modal, not an extension of the FDM form. */
.fdm-save-dialog:not([open]){display:none}
.fdm-save-dialog{width:min(430px,calc(100vw - 30px));max-height:calc(100dvh - 30px);overflow-y:auto;box-sizing:border-box;
  padding:19px;background:var(--paper);color:var(--ink);border:1px solid #c6d5e8;border-radius:17px;
  box-shadow:0 15px 50px #14223f50}
.fdm-save-dialog::backdrop{background:rgba(19,36,73,.55);backdrop-filter:blur(3px)}
.fdm-save-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.fdm-save-heading h3{font-size:18px;font-weight:900;letter-spacing:-.03em;margin:0}
.fdm-save-close{flex:none;width:34px;height:34px;border:1px solid #c5d3e5;border-radius:50%;background:#fff;
  color:var(--ink);font-size:23px;line-height:1;cursor:pointer}
.fdm-save-action-list{display:grid;gap:9px}
.fdm-save-action-list button,.fdm-new-submit{min-height:47px;padding:10px 12px;border:1px solid #b9cbe2;border-radius:11px;
  background:#f5f7fc;color:#304c72;font-size:14px;font-weight:850;text-align:left;cursor:pointer}
.fdm-save-action-list button:first-child{background:#8262cf;border-color:#8262cf;color:#fff}
.fdm-new-panel[hidden],.fdm-save-action-list[hidden]{display:none}
.fdm-new-panel{display:grid;gap:10px}
.fdm-new-panel label{font-size:13px;font-weight:850;color:#344d6b}
.fdm-new-panel input{min-height:44px;width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #b9cbe2;
  border-radius:9px;background:#fff;color:var(--ink);font-size:16px}
.fdm-new-panel .food-alert{margin:0}
.fdm-new-submit{background:#8262cf;border-color:#8262cf;color:#fff;text-align:center}
.food-record-action{display:block;width:100%;min-height:48px;padding:11px 12px;border-radius:12px;
  background:#8262cf;color:#fff;border:1px solid #8262cf;box-shadow:0 2px 5px #7861b525;
  font-size:14px;font-weight:900;line-height:1.3;text-align:center;overflow-wrap:anywhere;cursor:pointer}
.recipe-line-title{font-size:13px;font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.recipe-line input,.recipe-line select{min-width:0;width:100%;font-size:13px;padding:9px 6px;border:1px solid #c5d4e5;border-radius:8px;background:#fff;color:var(--ink)}
.recipe-line .recipe-remove{border:0;background:transparent;color:#7a8b9e;font-size:20px;padding:3px}
.recipe-totals{display:grid;gap:7px;min-width:0;font-size:12px;color:#3d5876;font-weight:650;
  line-height:1.45;padding:10px 0;border-top:1px solid #dfe7ef;border-bottom:1px solid #dfe7ef}
.recipe-totals .recipe-total-heading{font-size:12px;font-weight:850;color:#415a77}
.recipe-totals .recipe-total-meta{font-size:11px;color:#61748b;font-weight:650}
.recipe-totals.is-error{color:#a14926}
/* Dish and Meal toggles use .form-toggle, as do Food and Activity. */
@media(max-width:375px){.recipe-line{grid-template-columns:22px minmax(0,1fr) 57px 80px 25px;gap:4px}}

/* Keep form actions visible above the mobile keyboard. Apply sticky paper
   styling to the action ROW only: applying it to a purple button hides its
   white text and makes the button itself float over other controls. */
#entry-content :is(.entry-actions,.food-review-actions,.target-actions) {
  position:sticky;bottom:0;z-index:7;
  padding:8px 3px max(8px,env(safe-area-inset-bottom));margin-top:8px;
  background:var(--paper);box-shadow:0 -9px 13px -12px #1b325d35;
}
#entry-content :is(.entry-actions,.food-review-actions,.target-actions) > button {min-height:46px}
#entry-content {padding-bottom:max(10px,env(safe-area-inset-bottom));scroll-padding-bottom:90px}
/* The Food Item Save/Back bar is flush to the bottom when it is the last action. */
.food-library-entry #entry-content:has(#food-review:not([hidden])) {padding-bottom:0}
#food-review .food-review-actions {margin-bottom:0;padding-bottom:max(0px,env(safe-area-inset-bottom))}
.fdm-save-dialog {max-height:calc(var(--dialog-visible-height,100dvh) - 24px)}
.fdm-save-dialog .fdm-new-submit {position:sticky;bottom:0}

</style>

<script>/* PieChart v0.1.102 — activity library persistence and editor consistency. */
(() => {
  'use strict';
  // All chart data comes from private member records; blank days remain blank.
  let DATA = [];
  const svg=document.getElementById('chart');
  const host=document.querySelector('.chart-shell');
  
    const NS='http://www.w3.org/2000/svg';
  const defaultKeys=['weight','steps','water','calories','fibre','protein','fats','carbs'];
  const loadOrder=()=>{
    try {const k=JSON.parse(localStorage.getItem('pieChartMetricOrderV020'));return Array.isArray(k)&&k.length===8&&defaultKeys.every(x=>k.includes(x))?k:defaultKeys.slice();}
    catch{return defaultKeys.slice();}
  };
  let keys=loadOrder();
  const coreKeys=['steps','weight','calories','water'];
  const optionalKeys=new Set(['protein','carbs','fats','fibre']);
  const hiddenInPortrait=new Set(['protein','carbs','fats','fibre']);
  const colors={weight:'#3179e8',calories:'#eb9920',protein:'#64b632',carbs:'#269cf1',fats:'#ed5983',fibre:'#9c75bd',steps:'#9771d9',water:'#25c4d5'};
  const labels={weight:'Weight',calories:'Calories',protein:'Protein',carbs:'Carbs',fats:'Fats',fibre:'Fibre',steps:'Steps',water:'Water'};
  const units={weight:'kg',calories:'kcal',protein:'g',carbs:'g',fats:'g',fibre:'g',steps:'steps',water:'L'};
  const goals={steps:'stepsGoal',water:'waterGoal',protein:'proteinGoal',fibre:'fibreGoal'};
  const active=Object.fromEntries(keys.map(k=>[k,true]));
  const shown=k=>active[k];
  let current=[], scales={},geometry=null, focusedAxis='calories';
  let daysVisible=100;
  const MIN_DAYS=7;
  const portraitView=window.matchMedia('(orientation:portrait)');
  let chartRoot=svg;


  const fmt=v=>Math.round(v).toLocaleString('en-NZ');
  const nutrientText=v=>Number(v.toFixed(2)).toLocaleString('en-NZ',{maximumFractionDigits:2});
  const one=v=>Number(v).toFixed(1);
  const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
  const niceDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'});
  let livePersonalMode=false,liveDbState=null,liveChartDay='';
  const localDay=()=>window.PieChartShared.localDay();
  function emptyHistory(){
    const end=Date.parse(localDay()+'T00:00:00Z');
    return Array.from({length:101},(_,i)=>({
      date:new Date(end-(100-i)*86400000).toISOString().slice(0,10),partial:i===100
    }));
  }
  DATA=emptyHistory();
  // The last fully-loaded home metrics remain on screen while Firebase restores
  // its separate private collections. Retain only readout text, never actual
  // private records, and never carry readings between accounts or calendar days.
  const HOME_METRIC_CACHE_KEY='piechartHomeReadoutsV1';
  const HOME_METRIC_KEYS=['weight','steps','water','calories','protein','fibre','carbs','fats'];
  function readHomeMetricCache(){
    try{
      const item=JSON.parse(localStorage.getItem(HOME_METRIC_CACHE_KEY)||'null');
      return item?.uid&&item.date===localDay()&&Number.isFinite(item.savedAt)&&
        Date.now()>=item.savedAt&&Date.now()-item.savedAt<36*3600000&&
        item.metrics&&typeof item.metrics==='object'?item:null;
    }catch{return null;}
  }
  let lastHomeMetrics=readHomeMetricCache();
  let displayedUid='';
  function privateRecordsReady(state=liveDbState){
    return !!state?.uid&&['weightsLoaded','watersLoaded','foodEntriesLoaded',
      'activityDaysLoaded','stepDaysLoaded','targetsLoaded'].every(k=>state[k]===true);
  }
  function paintLastHomeMetrics(snapshot=lastHomeMetrics){
    if(!snapshot||snapshot.date!==localDay()||selectedDay)return false;
    for(const key of HOME_METRIC_KEYS){
      const metric=snapshot.metrics[key];
      if(!metric)continue;
      const node=document.querySelector('.metric[data-key="'+key+'"]');
      if(!node)continue;
      for(const suffix of ['percent','reading','target']){
        const target=document.getElementById(key+'-'+suffix);
        if(target&&typeof metric[suffix]==='string')target.textContent=metric[suffix];
      }
      if(Number.isFinite(metric.ratio))node.style.setProperty('--ratio',String(metric.ratio));
    }
    return true;
  }
  function saveHomeMetrics(){
    if(!livePersonalMode||selectedDay||liveDbState?.mode!=='connected'||!privateRecordsReady())return;
    const metrics={};
    for(const key of HOME_METRIC_KEYS){
      const node=document.querySelector('.metric[data-key="'+key+'"]');
      if(!node)continue;
      metrics[key]={
        percent:document.getElementById(key+'-percent')?.textContent||'',
        reading:document.getElementById(key+'-reading')?.textContent||'',
        target:document.getElementById(key+'-target')?.textContent||'',
        ratio:Number(node.style.getPropertyValue('--ratio'))||0
      };
    }
    lastHomeMetrics={uid:liveDbState.uid,date:localDay(),savedAt:Date.now(),metrics};
    try{localStorage.setItem(HOME_METRIC_CACHE_KEY,JSON.stringify(lastHomeMetrics))}catch{}
  }
  function eraseHomeMetrics(){
    lastHomeMetrics=null;
    try{localStorage.removeItem(HOME_METRIC_CACHE_KEY)}catch{}
  }
  // The graph always ends yesterday. A viewed historic day changes the
  // readouts and entry date, but never removes the selected day from the graph.
  let selectedDay=null,datePickMode=false,datePreviewDay=null;
  const activeDate=()=>selectedDay&&selectedDay<=localDay()?selectedDay:localDay();
  // The horizontal axis is calendar time; missing days do not change alignment.
  const availableGraphDays=()=>{
    const first=DATA.find(d=>d.date<localDay()&&!d.partial)?.date;
    return first?Math.max(MIN_DAYS,Math.round((dayUTC(localDay())-MS_DAY-dayUTC(first))/MS_DAY)+1):MIN_DAYS;
  };
  function updateDateControls(){
    const historic=!!selectedDay;
    document.querySelector('.screen').classList.toggle('history-view',historic);
    const button=document.querySelector('.date-button');
    button.classList.toggle('is-picking',datePickMode);
    button.setAttribute('aria-pressed',String(historic||datePickMode));
    button.setAttribute('aria-label',historic?'Return to today':datePickMode?'Cancel date selection':'Browse past dates');
    button.title=historic?'Return to today':datePickMode?'Cancel date selection':'Choose a past date on the graph';
    const label=document.getElementById('view-date-label');
    label.hidden=!historic;label.textContent=historic?niceDate(selectedDay):'';
    const hint=document.getElementById('chart-date-hint');
    // The instruction strip is only shown while picking on the graph.
    // Once selected, the single date popup handles one-day navigation.
    hint.hidden=!datePickMode;
    document.getElementById('chart-date-hint-text').textContent='Drag to choose a day';
  }
  function setViewingDate(date){
    // A day with no saved entry is still a real day and can be selected so
    // the user can add a historical record without shifting neighbouring bars.
    if(!window.PieChartShared.validDay(date,localDay())||
       (date!==localDay()&&DATA.length&&date<DATA[0].date))
      throw new Error('Choose a date covered by the available history.');
    selectedDay=date===localDay()?null:date;
    datePickMode=false;datePreviewDay=null;
    // Ensure the selected date stays visible even when returning to the graph
    // from a prior zoom level. Today's incomplete points remain excluded.
    if(selectedDay){
      const span=Math.round((Date.parse(localDay()+'T00:00:00Z')-Date.parse(selectedDay+'T00:00:00Z'))/86400000);
      daysVisible=Math.max(daysVisible,Math.min(availableGraphDays(),span));
    }
    updateDateControls();
    draw();
  }
  const dayUTC=d=>Date.parse(d+'T00:00:00Z');
  // Firestore already stores private history in persistent IndexedDB. Keep one
  // in-memory derived timeline and recompute only dates affected by document
  // changes. Unrelated library, favourite, and metadata events do no graph work.
  let lastGraphRevision=-1;
  let lastNoomRange='';
  let historySourceCache=null;
  const pendingGraphChanges={dates:new Set(),kinds:new Set(),all:false};
  let graphRefreshFrame=0;
  const requestGraphRefresh=()=>{
    if(graphRefreshFrame)return;
    graphRefreshFrame=requestAnimationFrame(()=>{
      graphRefreshFrame=0;
      if(!privateRecordsReady()||!livePersonalMode||!liveDbState?.uid)return;
      const all=pendingGraphChanges.all||lastGraphRevision<0;
      const dates=new Set(pendingGraphChanges.dates);
      const kinds=new Set(pendingGraphChanges.kinds);
      pendingGraphChanges.dates.clear();pendingGraphChanges.kinds.clear();pendingGraphChanges.all=false;
      rebuildLiveData({all,dates,kinds});
    });
  };
  function rebuildLiveData({all=true,dates=new Set(),kinds=new Set()}={}){
    if(!livePersonalMode)return;
    const state=liveDbState||{};
    const today=localDay();
    if(liveChartDay!==today)all=true;
    liveChartDay=today;
    const validDate=date=>window.PieChartShared.validDay(date,today);
    const validMeasurement=(value,max=100000)=>Number.isFinite(value)&&value>=0&&value<=max;
    // Reuse source indexes for unaffected collections. Firestore has already
    // supplied per-document changes; a food write must not rescan thousands
    // of Noom days, weigh-ins, or activities.
    const cache=historySourceCache;
    const changed=kind=>all||!cache||kinds.has(kind);
    const noomByDate=changed('dailyTotals')?new Map((state.noomDays||[]).filter(d=>validDate(d.date)&&
      d.noom&&typeof d.noom==='object'&&!Array.isArray(d.noom)).map(d=>[d.date,d.noom])):cache.noomByDate;
    // A historical import is a dated archive, not a classification for every
    // record entered before today. Missing Noom days inside its archive are
    // intentionally budgetless; other members retain PieChart calculations.
    const archiveDates=changed('dailyTotals')?[...noomByDate.keys()].sort():cache.archiveDates;
    const noomFirst=archiveDates[0]||null,noomLast=archiveDates.at(-1)||null;
    const inNoomPeriod=date=>noomFirst!==null&&date>=noomFirst&&date<=noomLast;
    const noomRange=(noomFirst||'')+'|'+(noomLast||'');
    if(lastNoomRange!==noomRange){all=true;lastNoomRange=noomRange;}

    const weightEvents=changed('weightEntries')?(state.weights||[]).filter(e=>validDate(e.date)&&Number.isFinite(e.kg)&&e.kg>=20&&e.kg<=400)
      .sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.id).localeCompare(String(b.id))):cache.weightEvents;
    const foodEvents=changed('foodEntries')?(state.foodEntries||[]).filter(e=>validDate(e.date)&&e.nutrition&&typeof e.nutrition==='object'):cache.foodEvents;
    const weightsByDate=changed('weightEntries')?new Map(weightEvents.map(e=>[e.date,e.kg])):cache.weightsByDate;
    const waterChanged=changed('waterEntries')||changed('foodEntries');
    const waterByDate=waterChanged?new Map():cache.waterByDate;
    if(waterChanged){
      for(const e of (state.waters||[]).filter(e=>validDate(e.date)&&Number.isFinite(e.ml)&&e.ml>0))
        waterByDate.set(e.date,(waterByDate.get(e.date)||0)+e.ml);
      for(const e of foodEvents)if(Number.isFinite(e.waterMl)&&e.waterMl>0)
        waterByDate.set(e.date,(waterByDate.get(e.date)||0)+e.waterMl);
    }
    const foodByDate=changed('foodEntries')?new Map():cache.foodByDate;
    if(changed('foodEntries'))for(const e of foodEvents){
      if(!foodByDate.has(e.date))foodByDate.set(e.date,{});
      const totals=foodByDate.get(e.date);
      for(const key of nutrientKeys)if(validMeasurement(e.nutrition?.[key],1000000))
        totals[key]=(totals[key]||0)+e.nutrition[key];
    }
    // Health Connect takes precedence over imported Noom steps for the same
    // date. Source records are not merged or rewritten in Firestore.
    const stepsChanged=changed('dailyTotals');
    const mergedStepsByDate=stepsChanged?new Map([...noomByDate].filter(([,n])=>Number.isInteger(n.steps)&&
      n.steps>=0&&n.steps<=100000).map(([date,n])=>[date,{date,steps:n.steps,complete:date<today,source:'noom'}])):cache.mergedStepsByDate;
    if(stepsChanged)for(const s of Array.isArray(state.stepDays)?state.stepDays:[])
      if(validDate(s.date)&&Number.isInteger(s.steps)&&s.steps>=0&&s.steps<=100000)mergedStepsByDate.set(s.date,s);
    const additionalStepsByDate=changed('exerciseEntries')?new Map():cache.additionalStepsByDate;
    // An activity is a recorded event even when its duration, steps, distance,
    // and energy expenditure are unknown. Those optional measurements must
    // never determine whether its date gets an activity marker or count badge.
    const activities=changed('exerciseEntries')?(Array.isArray(state.activityDays)?state.activityDays:[]).filter(a=>
      a&&validDate(a.date)):cache.activities;
    const activityEventsByDate=changed('exerciseEntries')?new Map():cache.activityEventsByDate;
    const activityByDate=changed('exerciseEntries')?new Map():cache.activityByDate;
    if(changed('exerciseEntries'))for(const a of activities){
      if(!activityEventsByDate.has(a.date))activityEventsByDate.set(a.date,[]);
      activityEventsByDate.get(a.date).push(a);
      const daily=activityByDate.get(a.date)||{load:0,minutes:0,knownDurations:0,count:0};
      daily.count++;
      if(Number.isFinite(a.minutes)&&a.minutes>0){daily.minutes+=a.minutes;daily.knownDurations++;}
      // Unmeasured energy is not estimated merely to display a marker.
      if(Number.isFinite(a.netKcalPerKg))daily.load+=a.netKcalPerKg*60;
      else if(Number.isFinite(a.mets)&&Number.isFinite(a.minutes)&&a.minutes>0)
        daily.load+=Math.max(0,a.mets-1)*a.minutes;
      activityByDate.set(a.date,daily);
      if(a.stepOrigin!=='estimated'&&a.stepRelation==='additional'&&Number.isInteger(a.stepsIncluded)&&a.stepsIncluded>0){
        const steps=additionalStepsByDate.get(a.date)||{measured:0,estimated:0};
        steps[a.stepOrigin==='estimated'?'estimated':'measured']+=a.stepsIncluded;
        additionalStepsByDate.set(a.date,steps);
      }
    }
    const augmentedStepDays=stepsChanged||changed('exerciseEntries')
      ?window.PieChartActivityMath.augmentStepDays([...mergedStepsByDate.values()],activities)
      :cache.augmentedStepDays;
    historySourceCache={noomByDate,archiveDates,weightEvents,foodEvents,weightsByDate,waterByDate,foodByDate,
      mergedStepsByDate,additionalStepsByDate,activities,activityEventsByDate,activityByDate,augmentedStepDays};
    // Historical totals, imported weights, and actual diary records all extend
    // the calendar; no public sample or invented measurements are involved.
    const recordedDates=[...noomByDate.keys(),...weightsByDate.keys(),...waterByDate.keys(),
      ...foodByDate.keys(),...mergedStepsByDate.keys(),...additionalStepsByDate.keys(),
      ...activityByDate.keys()].sort();
    const todayMs=dayUTC(today);
    const firstRecorded=recordedDates[0]||null;
    const earliest=Math.min(todayMs-100*86400000,firstRecorded?dayUTC(firstRecorded):todayMs);
    const first=Math.max(earliest,todayMs-3650*86400000);
    const numberOfDays=Math.round((todayMs-first)/86400000)+1;
    const goals=state.targets||{};
    const details=state.details||{};
    // Reuse the cached daily rows. Only a new account, a changed archive
    // boundary or a longer calendar range allocates a new timeline.
    if(DATA.length!==numberOfDays||DATA[0]?.date!==new Date(first).toISOString().slice(0,10))all=true;
    const weightChangeDates=kinds.has('weightEntries')?[...dates].sort():[];
    const weightsChangedFrom=weightChangeDates[0]||null;
    const updateTodayForStepHistory=(kinds.has('dailyTotals')||kinds.has('exerciseEntries'))&&[...dates].some(date=>
      dayUTC(today)-dayUTC(date)<=21*86400000&&date<=today);
    if(updateTodayForStepHistory)dates.add(today);
    const previousVisibleStart=current[0]?.date;
    const previousVisibleEnd=current.at(-1)?.date;
    const redrawNeeded=all||weightsChangedFrom!==null||
      [...dates].some(date=>previousVisibleStart&&date>=previousVisibleStart&&date<=previousVisibleEnd);
    if(all)DATA=Array.from({length:numberOfDays},(_,i)=>({
      date:new Date(first+i*86400000).toISOString().slice(0,10)
    }));
    const changedIndices=all?DATA.map((_,i)=>i):[...new Set([
      ...dates,
      ...(weightsChangedFrom?DATA.filter(row=>row.date>=weightsChangedFrom).map(row=>row.date):[])
    ])].filter(date=>date>=DATA[0]?.date&&date<=today).map(date=>
      Math.round((dayUTC(date)-first)/86400000)).filter(i=>i>=0&&i<DATA.length).sort((a,b)=>a-b);
    const dayProgress=(new Date().getHours()*60+new Date().getMinutes())/1440;
    for(const i of changedIndices){
      const date=DATA[i].date;
      // Look backwards only for the applicable weight and bounded model
      // windows. No unrelated daily row is recalculated or replaced.
      let mostRecentPrivateWeight=null;
      for(let j=weightEvents.length-1;j>=0;j--){
        if(weightEvents[j].date<=date){mostRecentPrivateWeight=weightEvents[j].kg;break;}
      }
      const weightCutoff=new Date(dayUTC(date)-14*86400000).toISOString().slice(0,10);
      const stepCutoff=new Date(dayUTC(date)-21*86400000).toISOString().slice(0,10);
      const privateWeightWindow=weightEvents.filter(e=>e.date>=weightCutoff&&e.date<=date)
        .map(e=>({date:e.date,weightKg:e.kg}));
      const stepWindow=augmentedStepDays.filter(e=>e.date>=stepCutoff&&e.date<=date);
      const noom=noomByDate.get(date)||null;
      const totals=foodByDate.get(date)||{};
      // An imported Noom summary with some nutritional measurements but a
      // missing nutrient cannot yield a complete total for that nutrient.
      // New food entries add to known Noom values, but do not make unknown
      // portions of the imported day's nutrition magically become zero.
      const hasNoomNutrition=!!noom&&nutrientKeys.some(k=>
        validMeasurement(noom[k],k==='calories'?100000:10000));
      const incompleteNutrients=[];
      const nutritionTotal=(key,max)=>{
        const imported=validMeasurement(noom?.[key],max)?noom[key]:null;
        const added=Number.isFinite(totals[key])?totals[key]:null;
        if(imported!==null)return imported+(added??0);
        if(added!==null){
          if(hasNoomNutrition)incompleteNutrients.push(key);
          return added; // Known PieChart contribution, not a fabricated Noom zero.
        }
        return null;
      };
      const noomBudget=validMeasurement(noom?.calorieBudgetKcal,100000)?noom.calorieBudgetKcal:null;
      const importedLow=validMeasurement(noom?.calorieBudgetLowKcal,100000)?noom.calorieBudgetLowKcal:noomBudget;
      const importedHigh=validMeasurement(noom?.calorieBudgetHighKcal,100000)?noom.calorieBudgetHighKcal:noomBudget;
      // Noom's own historic calorie budgets are authoritative. Missing values
      // remain unknown on Noom days; estimates are only for ordinary app days.
      const isArchiveDay=inNoomPeriod(date);
      const estimate=!isArchiveDay&&state.targetsLoaded&&window.PieChartCalorieBudget?.calculate({
        date,dateOfBirth:details.dateOfBirth,heightCm:details.heightCm,sex:details.sex,
        weightKg:mostRecentPrivateWeight,goalWeightKg:goals.weight,
        goalIntensity:goals.goalIntensity||'moderate',weightHistory:privateWeightWindow,
        stepDays:stepWindow,activities:activityEventsByDate.get(date)||[],
        allowStepProjection:date===today,
        dayProgress:date===today?dayProgress:1
      });
      const activity=activityByDate.get(date);
      const additional=additionalStepsByDate.get(date);
      const observedSteps=mergedStepsByDate.get(date)?.steps;
      const stepsPresent=Number.isInteger(observedSteps)||!!additional;
      const budgetLow=isArchiveDay?importedLow:(Number.isFinite(estimate?.low)?estimate.low:null);
      const budgetHigh=isArchiveDay?importedHigh:(Number.isFinite(estimate?.high)?estimate.high:null);
      DATA[i]={date,
        weight:weightsByDate.get(date)??null,
        water:validMeasurement(noom?.waterMl,15000)||waterByDate.has(date)
          ?(validMeasurement(noom?.waterMl,15000)?noom.waterMl:0)+(waterByDate.get(date)||0):null,
        targetWeight:goals.weight??null,waterGoal:Number.isFinite(goals.water)?Math.round(goals.water*1000):null,
        stepsGoal:goals.steps??null,proteinGoal:goals.protein??null,fibreGoal:goals.fibre??null,
        steps:stepsPresent?(observedSteps||0)+(additional?.measured||0)+(additional?.estimated||0):null,
        stepsAdditionalMeasured:additional?.measured||0,
        stepsAdditionalEstimated:additional?.estimated||0,
        activityLoad:activity?.load??null,
        activityMinutes:activity?.knownDurations?activity.minutes:null,activityCount:activity?.count??0,
        calories:nutritionTotal('calories',100000),
        protein:nutritionTotal('protein',10000),
        fibre:nutritionTotal('fibre',10000),
        carbs:nutritionTotal('carbs',10000),
        fats:nutritionTotal('fats',10000),
        incompleteNutrients,
        budgetLow,budgetHigh,
        budget:Number.isFinite(budgetLow)&&Number.isFinite(budgetHigh)?(budgetLow+budgetHigh)/2:null,
        budgetSource:isArchiveDay?'noom':'calculated',
        budgetProvisional:!isArchiveDay&&!!estimate?.provisional,
        budgetReason:isArchiveDay?null:estimate?.reason||null,
        budgetGuardLimited:!isArchiveDay&&!!estimate?.guardLimited,
        budgetActivityBasis:isArchiveDay?'Original recorded Noom budget':estimate?.activityBasis||null,
        budgetMaintenance:isArchiveDay?null:estimate?.maintenance??null,
        partial:date===today
      };
    }
    if(all||kinds.has('weightEntries'))weighed=DATA.filter(d=>Number.isFinite(d.weight)).map(d=>({t:dayUTC(d.date),weight:d.weight}));
    daysVisible=Math.max(MIN_DAYS,Math.min(daysVisible,DATA.length));
    // Today's unplotted readouts can update without rebuilding the SVG.
    if(redrawNeeded){
      if(all)draw();else repaintChangedSeries(kinds);
    }else if(dates.has(activeDate()))updateMetrics(DATA.find(d=>d.date===activeDate()));
  }
  window.addEventListener('piechart-db-state',e=>{
    const state=e.detail;
    const uid=state?.uid||'';
    const wasLive=livePersonalMode,accountChanged=!!uid&&displayedUid!==uid;
    livePersonalMode=!!uid;
    liveDbState=state;
    if(accountChanged){
      selectedDay=null;datePickMode=false;datePreviewDay=null;updateDateControls();
      displayedUid=uid;daysVisible=100;lastGraphRevision=-1;lastNoomRange='';historySourceCache=null;
      pendingGraphChanges.dates.clear();pendingGraphChanges.kinds.clear();pendingGraphChanges.all=true;
      if(lastHomeMetrics?.uid!==uid){
        eraseHomeMetrics();DATA=emptyHistory();weighed=[];draw();
      }
    }
    if(uid){
      if(state.mode==='not-authorized'){
        eraseHomeMetrics();DATA=emptyHistory();weighed=[];
        pendingGraphChanges.dates.clear();pendingGraphChanges.kinds.clear();

  function appendTimelineDates(group,days,g,labelY){
    // Calendar-aligned month markers, then years as the history grows.
    // This moves during the swipe preview; individual days are never grouped.
    const last=current.at(-1);
    if(!last)return;
    const lastDay=Date.parse(last.date+'T00:00:00Z')/MS_DAY;
    const firstDay=lastDay-days+1;
    const earliest=new Date(firstDay*MS_DAY),latest=new Date(lastDay*MS_DAY);
    const showYears=days>450;
    const font=clamp(g.width*.012,10,14);
    const minGap=showYears?43:Math.max(38,font*3.0);
    let lastX=-Infinity;
    const cursor=new Date(Date.UTC(earliest.getUTCFullYear(),showYears?0:earliest.getUTCMonth(),1));
    while(cursor<=latest){
      const tick=cursor.getTime()/MS_DAY;
      const xx=g.ml+(tick-firstDay+.5)/Math.max(1,days)*g.pw;
      const year=cursor.getUTCFullYear(),month=cursor.getUTCMonth();
      const marker=showYears?String(year):
        (month===0?`Jan ${year}`:cursor.toLocaleDateString('en-NZ',{month:'short',timeZone:'UTC'}));
      // Skip labels which cannot fit, but don't shift calendar dates to a
      // non-calendar midpoint or create overlapping month ticks.
      const halfLabel=marker.length*(font*.27);
      if(xx>=g.ml+halfLabel+2 && xx<=g.ml+g.pw-Math.max(44,font*4) && xx-lastX>=minGap){
        el('line',{x1:xx,y1:g.mt+g.ph+1,x2:xx,y2:g.mt+g.ph+5,
            stroke:'#aeb8c7','stroke-width':1},group);
        const node=el('text',{x:xx,y:labelY,'text-anchor':'middle',fill:'#283d5b',
            'font-size':font,'font-weight':800},group);
        node.textContent=marker;
        lastX=xx;
      }
      if(showYears)cursor.setUTCFullYear(year+1);
      else cursor.setUTCMonth(month+1);
    }
    // The full latest date sits at the far RIGHT of the entire axis, in
    // the legend's bottom strip rather than truncating the plot timeline.
  }
