<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>Joules Burn's Pie Chart — v0.1.010</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>:root {
  color-scheme: light;
  --ink: #192c50;
  --muted: #62758d;
  --paper: #fffaf2;
  --weight: #266bd3;
  --calories: #f58220;
  --protein: #4c9d2a;
  --carbs: #2a98eb;
  --fats: #f15b83;
  --steps: #9653eb;
  --water: #30c9d6;
  --fibre: #9a73b4;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif; background: var(--paper); color:var(--ink); }
button, select { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button:focus-visible, select:focus-visible { outline: 3px solid #609fe8; outline-offset:3px; }
.screen {
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:clamp(4px,.9vh,11px);
  width:100%; height:100%; height:100dvh;
  padding:calc(env(safe-area-inset-top) + clamp(6px,1.5vh,19px)) calc(env(safe-area-inset-right) + clamp(8px,2vw,33px)) calc(env(safe-area-inset-bottom) + clamp(8px,1.7vh,20px)) calc(env(safe-area-inset-left) + clamp(8px,2vw,33px));
  background:linear-gradient(160deg,#fffdf9 0%,#fffaf2 56%,#fffefa 100%);
}
.topbar { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(42px,1fr); align-items:center; gap:8px; min-height:clamp(34px,7.6vh,65px); }
.brand {display:flex; gap:clamp(4px,.7vw,12px); align-items:center; min-width:0; white-space:nowrap;}
.brand-mark {font-size:clamp(20px,3.5vw,42px); line-height:1; filter:drop-shadow(0 1px 1px #e7cec9);}
.brand-name {font-size:clamp(16px,1.92vw,32px); font-weight:900; color:#4c607f; letter-spacing:-.045em; overflow:hidden; text-overflow:ellipsis;}
.date-navigation {display:flex; align-items:center; gap:clamp(4px,.55vw,9px); justify-content:center; white-space:nowrap;}
.date-pill, .settings-button { border:1px solid #d9dbe2; background:#fff; color:#203557; box-shadow:0 2px 2px #25395a19,0 2px 7px #25395a10; }
.metric:active{transform:translateY(1px)}
.date-pill {height:clamp(29px,4.1vw,52px);display:flex;align-items:center;gap:clamp(4px,.7vw,11px);padding:0 clamp(8px,1.3vw,21px);border-radius:999px;}
.date-pill > svg:not(.chevron) {width:clamp(14px,1.5vw,26px);height:clamp(14px,1.5vw,26px);}
.date-pill > svg.chevron {width:clamp(11px,1.1vw,19px);height:clamp(11px,1.1vw,19px);}
.date-pill select {appearance:none;border:none;background:transparent;color:var(--ink);font-weight:900;font-size:clamp(11px,1.37vw,22px);outline:none;cursor:pointer;max-width:clamp(94px,11.2vw,187px);}
.top-actions{display:flex;gap:clamp(8px,1.5vw,25px);justify-self:end;align-items:center;}
.settings-button {border:0;box-shadow:none;background:transparent;display:grid;place-items:center;width:clamp(30px,3.5vw,54px);height:clamp(30px,3.5vw,54px);padding:clamp(2px,.5vw,7px);}
.settings-button svg{stroke-width:1.9;}
.chart-shell{position:relative; min-height:0; overflow:hidden; touch-action:manipulation;}
#chart{display:block; height:100%; width:100%; overflow:visible; font-family:inherit;}
.chart-tooltip{position:absolute;z-index:2;min-width:150px;pointer-events:none;border:1px solid #d6dbe6;border-radius:12px;padding:9px 12px;background:#fffffff5;box-shadow:0 4px 22px #1c2c5033;color:#293752;font:700 clamp(11px,.92vw,14px)/1.6 Arial,sans-serif;}
.chart-tooltip strong{display:block;margin-bottom:3px;font-size:1.1em;}
.tooltip-row{display:flex;justify-content:space-between;gap:13px;align-items:center;}
.tooltip-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}

.main-area{display:grid;grid-template-columns:minmax(0,1fr) clamp(144px,14vw,220px);gap:clamp(8px,1vw,16px);min-height:0;align-items:stretch;}
.chart-shell{position:relative; min-height:0; overflow:hidden; touch-action:manipulation;}
.metric-row{display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:clamp(6px,.8vw,12px);min-width:0;align-content:start;}
.metric{display:grid;grid-template-rows:auto auto auto;gap:0;justify-items:center;align-items:center;min-width:0;max-width:100%;padding:clamp(5px,1.2vh,17px) clamp(3px,.8vw,14px);border:1px solid var(--border);border-radius:clamp(10px,2vw,28px);background:var(--bg);color:var(--ink);box-shadow:0 2px 2px #31405d12,0 4px 9px #31405d0a;transition:opacity .15s,transform .15s;}
.metric[aria-pressed='false']{opacity:.38;filter:grayscale(.5)}
.metric-head{display:flex;justify-content:center;gap:clamp(2px,.45vw,9px);align-items:center;font-size:clamp(10px,1.13vw,20px);font-weight:900;white-space:nowrap;letter-spacing:-.035em;}
.metric-icon{display:inline-flex;font-family:Arial,sans-serif;font-size:clamp(12px,1.8vw,31px);line-height:1;align-items:center;justify-content:center;min-width:1em;}
.metric-main{font-size:clamp(13px,1.9vw,31px);font-weight:900;letter-spacing:-.055em;line-height:1.15;white-space:nowrap;}
.metric-sub{font-size:clamp(9px,1.07vw,19px);color:var(--sub);font-weight:800;letter-spacing:-.035em;white-space:nowrap;}
.metric-weight{--bg:#e3f1ff;--border:#c9e4fc;--sub:#4285b3}
.metric-calories{--bg:#fff1e0;--border:#ffdfbf;--sub:#a97951}
.metric-protein{--bg:#eaf6dd;--border:#d9edc5;--sub:#58943d}
.metric-carbs{--bg:#ebf1ff;--border:#dce5fb;--sub:#5584b5}
.metric-fats{--bg:#ffedf2;--border:#f7d9e2;--sub:#ab6480}
.metric-steps{--bg:#f0e6fe;--border:#e4d4f9;--sub:#8263a9}
.metric-fibre{--bg:#f4eafa;--border:#e8d8f1;--sub:#8e66aa}
.metric-water{--bg:#e5faff;--border:#c9f0f5;--sub:#4496b0}
@media (max-width:820px) and (orientation:landscape){
  .screen{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right));}
  .brand-name{font-size:clamp(15px,2.25vw,22px);}
  .brand-mark{font-size:19px;}
  .topbar{min-height:30px;}
  .metric-head{font-size:clamp(9px,1.35vw,12px)}
  .metric-sub{font-size:clamp(8px,1.2vw,11px)}
  .metric-main{font-size:clamp(11px,1.8vw,16px)}
}

@media (max-width:980px) and (orientation:landscape){
  .main-area{grid-template-columns:minmax(0,1fr) clamp(128px,16vw,180px);gap:8px;}
  .metric{padding:clamp(4px,.9vh,10px) clamp(3px,.6vw,8px);}  
}

/* v0.1.007: one full-height graph plus a compact right-hand metric stack. */
.date-pill select{max-width:none;width:clamp(114px,13vw,170px);text-overflow:ellipsis;}
.metric-row{position:relative;display:block;overflow:hidden;}
.metric-row .metric{position:absolute;left:0;width:100%;height:clamp(25px,8vh,44px);transition:opacity .15s;display:grid;grid-template-rows:auto auto auto;}
.metric-row .metric[aria-pressed="false"]{height:clamp(18px,5vh,25px);grid-template-rows:1fr;}
.metric-row .metric{padding:1px 3px;}
.metric-row .metric-head{font-size:clamp(9px,1.20vh,11px);line-height:1.05;}
.metric-row .metric-icon{font-size:clamp(10px,1.7vh,15px);}
.metric-row .metric-main{font-size:clamp(11px,1.65vh,15px);line-height:1.04;}
.metric-row .metric-sub{font-size:clamp(8px,1.00vh,9px);line-height:1.03;}
.metric-row .metric[aria-pressed="false"] .metric-main,.metric-row .metric[aria-pressed="false"] .metric-sub{display:none;}
.metric{min-height:0;overflow:hidden;}
@media (max-height:500px) and (orientation:landscape){
  .screen{padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom));gap:3px;}
  .topbar{min-height:28px;}
  .metric-row{gap:0;}
  .metric{padding:2px 3px;border-radius:9px;}
  .metric-head{font-size:clamp(9px,1.15vw,12px);line-height:1.05;}
  .metric-icon{font-size:clamp(11px,1.4vw,16px);}
  .metric-main{font-size:clamp(11px,1.4vw,15px);line-height:1.04;}
  .metric-sub{font-size:clamp(8px,.92vw,10px);line-height:1;}
}

/* v0.1.010: touch-first metric ordering and entry sheets. */
.metric {touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.metric.drag-ready {outline:2px solid #8597b3;outline-offset:-1px;}
.metric.dragging {z-index:30;opacity:1 !important;filter:none !important;box-shadow:0 6px 22px #17294a55;transition:none;cursor:grabbing;}
.entry-backdrop[hidden] {display:none}
.entry-backdrop {position:fixed;inset:0;z-index:100;background:#182b4d77;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
.entry-sheet {position:relative;max-height:97dvh;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:min(620px,94vw);border-radius:22px;background:#fffdfa;border:1px solid #dbe3ee;padding:18px 22px 20px;box-shadow:0 14px 50px #10204450;}
.entry-titlebar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px;}
.entry-titlebar h2 {margin:0;font-size:clamp(16px,2.6vw,25px);color:#344a69;}
.close-entry {border:1px solid #dae2ee;border-radius:100px;background:white;color:#405775;font-size:25px;line-height:1;width:33px;height:33px;}
.entry-sheet p {margin:6px 0 12px;color:#61748c;font-size:13px;}
.entry-form {display:grid;gap:9px;max-height:calc(97dvh - 80px);overflow-y:auto;padding-bottom:4px;}
.entry-form label {font-size:13px;font-weight:800;color:#3f5370;}
.entry-form input, .entry-form select{padding:9px 12px;border:1px solid #bdcde0;border-radius:12px;background:#fff;color:#182c4f;font:inherit;width:100%;}
.entry-form input[type='number']{font-variant-numeric:tabular-nums;}
.entry-number {display:flex;align-items:center;gap:10px;}
.entry-number input{flex:1;font-size:24px;font-weight:800;text-align:center;}
.entry-number button {border:1px solid #c1cddd;background:#eef4ff;border-radius:11px;color:#344b77;font-size:20px;min-width:39px;align-self:stretch;}
.entry-affirm {border:0;border-radius:14px;padding:11px 18px;background:#875be0;color:white;font-weight:900;justify-self:end;}
.entry-results {display:grid;gap:5px;max-height:25vh;overflow:auto;}
.entry-results button {text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #d7e3ef;border-radius:10px;background:#f7f9fc;color:#23375c;padding:7px 10px;}
.entry-results button[aria-selected='true']{outline:2px solid #8a6bdd;background:#f1ebff;}
.entry-results small {font-size:11px;color:#687b96;}
.entry-preview {display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;padding:10px;border-radius:12px;background:#eff8f1;border:1px solid #d9eadc;}
.entry-note {font-size:11px!important;color:#687b96!important;}
@media(max-height:420px){.entry-sheet{padding:9px 14px}.entry-titlebar{margin-bottom:4px}.entry-form{gap:5px}.entry-sheet p{margin:2px 0 5px}.entry-results{max-height:16vh}}

/* v0.1.010: reference-anchored labels, no date selector. */
.range-readout{justify-self:center;border:1px solid #e3e5e9;background:#fffaf4;color:#526684;border-radius:999px;padding:6px 16px;white-space:nowrap;font-size:clamp(11px,1.26vw,17px);font-weight:900;}
.main-area{gap:0;grid-template-columns:minmax(0,1fr) clamp(137px,15vw,221px);}
.chart-shell{touch-action:none;user-select:none;-webkit-user-select:none;}
.metric-row{overflow:visible;}
.metric-row .metric{position:absolute;display:grid;grid-template-columns:minmax(0,1fr) 24px;grid-template-rows:auto auto auto;align-content:start;align-items:start;justify-items:start;
  left:0;right:0;width:100%;padding:3px 5px 2px 12px;box-shadow:none!important;border:0;border-top:3px solid var(--line);border-radius:0 9px 8px 0;
  background:linear-gradient(to bottom,var(--wash) 0%,rgba(255,255,255,0) 100%);touch-action:none;user-select:none;cursor:default;
  transition:opacity .14s;overflow:hidden;}
.metric-row .metric-head{grid-column:1;grid-row:1;justify-self:start;display:flex;align-items:center;gap:4px;font-size:clamp(10px,1.15vw,13px);line-height:1.05;white-space:nowrap;}
.metric-row .metric-main{grid-column:1;grid-row:2;justify-self:start;font-size:clamp(12px,1.55vw,18px);font-weight:900;line-height:1.06;}
.metric-row .metric-sub{grid-column:1;grid-row:3;justify-self:start;font-size:clamp(9px,1vw,12px);line-height:1.08;}
.metric-row .metric-icon{font-size:clamp(10px,1.4vw,16px);}
.metric-row .metric[aria-pressed='false']{background:#fffaf8a8;box-shadow:none!important;border-top:1px dotted #d9dbe3;height:24px!important;opacity:.48;}
.metric-row .metric[aria-pressed='false'] .metric-head{color:#68758b;}
.metric-row .metric[aria-pressed='false'] .metric-main,.metric-row .metric[aria-pressed='false'] .metric-sub{display:none;}
.metric-steps{--line:#9476d4;--wash:#9476d448}
.metric-water{--line:#27bfd4;--wash:#27bfd448}
.metric-weight{--line:#3377e1;--wash:#3377e148}
.metric-calories{--line:#ed9d11;--wash:#ed9d1148}
.metric-protein{--line:#56a52b;--wash:#56a52b48}
.metric-fibre{--line:#9b72b4;--wash:#9b72b448}
.metric-carbs{--line:#1c9bf3;--wash:#1c9bf348}
.metric-fats{--line:#ef5c84;--wash:#ef5c8448}
.visibility-btn{position:absolute;right:2px;top:2px;height:23px;width:24px;border:0;border-radius:6px;background:#ffffffad;color:#5a6a80;font-size:14px;padding:0;display:grid;place-items:center;touch-action:manipulation;cursor:pointer;}
.visibility-btn[aria-pressed='false']{color:#9fa6b2;background:transparent;}
.metric.drag-ready{outline:1.5px dashed #79849b;}
.metric.dragging{z-index:50;opacity:1!important;filter:none!important;box-shadow:0 4px 14px #1b2e4b3b!important;transform:none;}
@media(max-height:500px) and (orientation:landscape){
  .main-area{grid-template-columns:minmax(0,1fr) clamp(126px,15.5vw,170px);}
  .metric-row .metric{padding:2px 2px 1px 5px;}
  .metric-row .metric-head{font-size:clamp(9px,1.30vw,11px);}
  .metric-row .metric-main{font-size:clamp(11px,1.6vw,14px);}
  .metric-row .metric-sub{font-size:clamp(8px,1.1vw,10px);}
  .visibility-btn{height:21px;width:21px;font-size:12px;}
}
/* Entry controls designed for touch and inertia, not numerical spinbuttons. */
.water-recents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.water-recents button{border:1px solid #a9dfe8;color:#1c6883;background:#e7faff;border-radius:12px;font-size:16px;font-weight:900;padding:11px 7px;min-height:48px;touch-action:manipulation;}
.water-recents button.new-amount{background:#f4efff;border-color:#d9c5ff;color:#6d48a9;}
.water-recents button:active{transform:scale(.98)}
.recent-form[hidden]{display:none;}
.weight-wheel-wrap{display:flex;gap:18px;align-items:center;justify-content:center;position:relative;user-select:none;-webkit-user-select:none;}
.weight-wheel-unit{display:flex;flex-direction:column;align-items:center;gap:4px;color:#607390;font-size:11px;font-weight:900;}
.weight-wheel{position:relative;width:115px;height:158px;overflow:hidden;border-radius:12px;background:linear-gradient(to bottom,#eef4fb 0%,#fff 27%,#fff 73%,#eef4fb 100%);border:1px solid #d6e3f1;touch-action:none;cursor:grab;}
.weight-wheel:active{cursor:grabbing;}
.weight-wheel .wheel-row{height:32px;position:absolute;left:0;right:0;top:calc(50% - 16px);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;pointer-events:none;will-change:transform;}
.weight-wheel .wheel-center{position:absolute;top:calc(50% - 16px);height:32px;left:0;right:0;border-top:1px solid #91b9e3;border-bottom:1px solid #91b9e3;background:#dceeff77;pointer-events:none;}
.weight-reading{text-align:center;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;color:#30486f;}
.weight-wheel-hint{text-align:center;color:#77849a;font-size:11px;margin:0!important;}

/* Hidden metrics are accessible without pushing live graph labels off their values. */
.metric-row .metric[hidden],.hidden-metrics-toggle[hidden],.hidden-metrics-popup[hidden]{display:none!important}
.hidden-metrics-toggle{position:absolute;bottom:1px;right:2px;z-index:12;border:1px dashed #b5bed0;background:#fffdf9df;color:#61738f;border-radius:9px;padding:3px 7px;font-size:10px;font-weight:900;cursor:pointer;}
.hidden-metrics-popup{position:absolute;right:0;bottom:27px;z-index:60;min-width:140px;border:1px solid #d5dce9;border-radius:11px;background:#fffefa;box-shadow:0 5px 22px #33496944;padding:7px;display:grid;gap:5px;}
.hidden-metrics-popup button{border:1px solid #dce4ef;background:#f8fbff;padding:7px 8px;border-radius:8px;color:#344868;font-weight:800;text-align:left;font-size:12px;}

.metric-row.compact-series .metric-sub{display:none;}
</style>
  
  
</head>
<body>
  <main class="screen" aria-label="Joules Burn's Pie Chart home screen">
    <header class="topbar">
      <div class="brand" aria-label="Joules Burn's Pie Chart"><span class="brand-mark" aria-hidden="true">🍎</span><span class="brand-name">Joules Burn's Pie Chart</span></div>
      <div class="range-readout" id="range-readout" aria-live="polite">Last 30 days</div>
      <div class="top-actions">
        <button class="settings-button" type="button" title="Settings — future development" aria-label="Settings (not implemented)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.7 2.9 10.2 1h3.6l.5 1.9a9.3 9.3 0 0 1 2 .9l1.8-1 2.5 2.6-.9 1.8a9.3 9.3 0 0 1 .8 2l2 .5v3.6l-2 .5a9.3 9.3 0 0 1-.8 2l.9 1.8-2.5 2.5-1.8-1a9.3 9.3 0 0 1-2 .9l-.5 2h-3.6l-.5-2a9.3 9.3 0 0 1-2-.9l-1.8 1-2.5-2.5 1-1.8a9.3 9.3 0 0 1-.9-2l-2-.5V9.7l2-.5a9.3 9.3 0 0 1 .9-2l-1-1.8 2.5-2.6 1.8 1a9.3 9.3 0 0 1 2-.9Z"/><circle cx="12" cy="11.5" r="3.6"/></svg>
        </button>
      </div>
    </header>

    <div class="main-area">
      <section class="chart-shell" aria-label="Interactive health trends graph. Swipe right to see more history, left to zoom towards today; tap to inspect a day.">
        <svg id="chart" role="img" aria-label="Multi-series daily weight, calories, nutrient intake, steps, and water chart"></svg>
        <div class="chart-tooltip" id="tooltip" hidden></div>
      </section>

      <section class="metric-row" aria-label="Current values and chart series visibility">
      <div class="metric metric-steps" role="button" tabindex="0" type="button" data-key="steps" aria-pressed="true" title="Double-tap to record · hold to drag · eye to toggle">
        <span class="metric-head"><span class="metric-icon" aria-hidden="true">👟</span><span>Steps</span></span>
        <span class="metric-main" id="steps-value">—</span>
        <span class="metric-sub" id="steps-goal">—</span>
      <button class="visibility-btn" type="button" aria-label="Hide steps" title="Hide or show steps" aria-pressed="true">◉</button></div>
      <div class="metric metric-water" role="button" tabindex="0" type="button" data-key="water" aria-pressed="true" title="Double-tap to record · hold to drag · eye to toggle">
        <span class="metric-head"><span class="metric-icon" aria-hidden="true">💧</span><span>Water</span></span>
        <span class="metric-main" id="water-value">—</span>
        <span class="metric-sub" id="water-goal">—</span>
      <button class="visibility-btn" type="button" aria-label="Hide water" title="Hide or show water" aria-pressed="true">◉</button></div>
      <div class="metric metric-weight" role="button" tabindex="0" type="button" data-key="weight" aria-pressed="true" title="Double-tap to record · hold to drag · eye to toggle">
        <span class="metric-head"><span class="metric-icon" aria-hidden="true">⚖</span><span>Weight</span></span>
        <span class="metric-main" id="weight-value">—</span>
        <span class="metric-sub" id="weight-goal">Target —</span>
      <button class="visibility-btn" type="button" aria-label="Hide weight" title="Hide or show weight" aria-pressed="true">◉</button></div>
      <div class="metric metric-calories" role="button" tabindex="0" type="button" data-key="calories" aria-pressed="true" title="Double-tap to record · hold to drag · eye to toggle">
        <span class="metric-head"><span class="metric-icon" aria-hidden="true">🔥</span><span>Calories</span></span>
        <span class="metric-main" id="calories-value">—</span>

            choice.innerHTML=`<label for="food-g">Quantity (g or mL)</label><input id="food-g" type="number" inputmode="decimal" min="1" step="1" value="${item.g}" required><div class="entry-preview"><span>Calories (estimate)</span><b id="food-est">—</b><span>Protein · Carbs · Fats · Fibre</span><b id="food-macros">—</b></div>`;
            const inp=document.getElementById('food-g');
            function upd(){const f=Number(inp.value)/item.g;document.getElementById('food-est').textContent=Math.round((4*item.protein+4*item.carbs+9*item.fats+2*item.fibre)*f)+' kcal';document.getElementById('food-macros').textContent=[item.protein,item.carbs,item.fats,item.fibre].map(v=>(v*f).toFixed(1)+'g').join(' / ');}
            inp.addEventListener('input',upd);upd();document.getElementById('food-submit').disabled=false;
          });results.append(b);
        });
      };
      search.addEventListener('input',renderResults);renderResults();
      document.getElementById('food-form').addEventListener('submit',e=>{
        e.preventDefault();if(!selectedFood)return;
        const qty=Number(document.getElementById('food-g').value);if(qty<=0||!Number.isFinite(qty))return;
        const f=qty/selectedFood.g;const macros={protein:today.protein+selectedFood.protein*f,carbs:today.carbs+selectedFood.carbs*f,fats:today.fats+selectedFood.fats*f,fibre:today.fibre+selectedFood.fibre*f};
        for(const [k,v] of Object.entries(macros))today[k]=Math.round(v*10)/10;
        today.calories=Math.round(4*today.protein+4*today.carbs+9*today.fats+2*today.fibre);
        today.water+=Math.round(selectedFood.water*f);
        dismissEntry();draw();
      });
    }
  }
  // On touchscreen Chrome, the first user interaction may start fullscreen.
  // Browsers cannot auto-enter fullscreen on page load without user activation.
  let triedFullscreen=false;
  document.addEventListener('pointerup',e=>{
    if(triedFullscreen||!e.isTrusted||navigator.maxTouchPoints<1||!document.documentElement.requestFullscreen)return;
    triedFullscreen=true;
    if(document.fullscreenElement)return;
    document.documentElement.requestFullscreen().then(()=>{
      if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});
    }).catch(()=>{});
  },{capture:true});

  new ResizeObserver(draw).observe(host);
  draw();
})();
</script></body>
</html>
