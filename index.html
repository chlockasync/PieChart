<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>MyHealthTrack — landscape daily bands v0.1.007</title>
  <style>:root {
  color-scheme: light;
  --ink: #192c50;
  --muted: #62758d;
  --paper: #fffaf2;
  --weight: #266bd3;
  --calories: #f58220;
  --protein: #4c9d2a;
  --carbs: #2a98eb;
  --fats: #f15b83;
  --steps: #9653eb;
  --water: #30c9d6;
  --fibre: #9a73b4;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body { font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif; background: var(--paper); color:var(--ink); }
button, select { font:inherit; }
button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible, select:focus-visible { outline: 3px solid #609fe8; outline-offset:3px; }
.screen {
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:clamp(4px,.9vh,11px);
  width:100%; height:100%; height:100dvh;
  padding:calc(env(safe-area-inset-top) + clamp(6px,1.5vh,19px)) calc(env(safe-area-inset-right) + clamp(8px,2vw,33px)) calc(env(safe-area-inset-bottom) + clamp(8px,1.7vh,20px)) calc(env(safe-area-inset-left) + clamp(8px,2vw,33px));
  background:linear-gradient(160deg,#fffdf9 0%,#fffaf2 56%,#fffefa 100%);
}
.topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; min-height:clamp(34px,7.6vh,65px); }
.brand {display:flex; gap:clamp(4px,.7vw,12px); align-items:center; min-width:0; white-space:nowrap;}
.brand-mark {font-size:clamp(20px,3.5vw,42px); line-height:1; filter:drop-shadow(0 1px 1px #e7cec9);}
.brand-name {font-size:clamp(18px,2.25vw,37px); font-weight:900; color:#4c607f; letter-spacing:-.045em; overflow:hidden; text-overflow:ellipsis;}
.date-navigation {display:flex; align-items:center; gap:clamp(4px,.55vw,9px); justify-content:center; white-space:nowrap;}
.round-button, .date-pill, .today-button, .settings-button { border:1px solid #d9dbe2; background:#fff; color:#203557; box-shadow:0 2px 2px #25395a19,0 2px 7px #25395a10; }
.round-button {display:grid;place-items:center;width:clamp(29px,4.1vw,52px);height:clamp(29px,4.1vw,52px);border-radius:999px;padding:clamp(6px,.6vw,10px);}
.round-button svg, .date-pill svg, .settings-button svg {display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.round-button:active,.today-button:active,.metric:active{transform:translateY(1px)}
.round-button:disabled {opacity:.3;cursor:default;}
.date-pill {height:clamp(29px,4.1vw,52px);display:flex;align-items:center;gap:clamp(4px,.7vw,11px);padding:0 clamp(8px,1.3vw,21px);border-radius:999px;}
.date-pill > svg:not(.chevron) {width:clamp(14px,1.5vw,26px);height:clamp(14px,1.5vw,26px);}
.date-pill > svg.chevron {width:clamp(11px,1.1vw,19px);height:clamp(11px,1.1vw,19px);}
.date-pill select {appearance:none;border:none;background:transparent;color:var(--ink);font-weight:900;font-size:clamp(11px,1.37vw,22px);outline:none;cursor:pointer;max-width:clamp(94px,11.2vw,187px);}
.top-actions{display:flex;gap:clamp(8px,1.5vw,25px);justify-self:end;align-items:center;}
.today-button{border-color:#a5ccff;background:linear-gradient(#f8fbff,#deebff);border-radius:999px;padding:clamp(6px,.7vw,13px) clamp(10px,2.25vw,33px);color:#37577c;font-size:clamp(11px,1.3vw,22px);font-weight:900;}
.settings-button {border:0;box-shadow:none;background:transparent;display:grid;place-items:center;width:clamp(30px,3.5vw,54px);height:clamp(30px,3.5vw,54px);padding:clamp(2px,.5vw,7px);}
.settings-button svg{stroke-width:1.9;}
.chart-shell{position:relative; min-height:0; overflow:hidden; touch-action:pan-y;}
#chart{display:block; height:100%; width:100%; overflow:visible; font-family:inherit;}
.chart-tooltip{position:absolute;z-index:2;min-width:150px;pointer-events:none;border:1px solid #d6dbe6;border-radius:12px;padding:9px 12px;background:#fffffff5;box-shadow:0 4px 22px #1c2c5033;color:#293752;font:700 clamp(11px,.92vw,14px)/1.6 Arial,sans-serif;}
.chart-tooltip strong{display:block;margin-bottom:3px;font-size:1.1em;}
.tooltip-row{display:flex;justify-content:space-between;gap:13px;align-items:center;}
.tooltip-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}

.main-area{display:grid;grid-template-columns:minmax(0,1fr) clamp(144px,14vw,220px);gap:clamp(8px,1vw,16px);min-height:0;align-items:stretch;}
.chart-shell{position:relative; min-height:0; overflow:hidden; touch-action:pan-y;}
.metric-row{display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:clamp(6px,.8vw,12px);min-width:0;align-content:start;}
.metric{display:grid;grid-template-rows:auto auto auto;gap:0;justify-items:center;align-items:center;min-width:0;max-width:100%;padding:clamp(5px,1.2vh,17px) clamp(3px,.8vw,14px);border:1px solid var(--border);border-radius:clamp(10px,2vw,28px);background:var(--bg);color:var(--ink);box-shadow:0 2px 2px #31405d12,0 4px 9px #31405d0a;transition:opacity .15s,transform .15s;}
.metric[aria-pressed='false']{opacity:.38;filter:grayscale(.5)}
.metric-head{display:flex;justify-content:center;gap:clamp(2px,.45vw,9px);align-items:center;font-size:clamp(10px,1.13vw,20px);font-weight:900;white-space:nowrap;letter-spacing:-.035em;}
.metric-icon{display:inline-flex;font-family:Arial,sans-serif;font-size:clamp(12px,1.8vw,31px);line-height:1;align-items:center;justify-content:center;min-width:1em;}
.metric-main{font-size:clamp(13px,1.9vw,31px);font-weight:900;letter-spacing:-.055em;line-height:1.15;white-space:nowrap;}
.metric-sub{font-size:clamp(9px,1.07vw,19px);color:var(--sub);font-weight:800;letter-spacing:-.035em;white-space:nowrap;}
.metric-weight{--bg:#e3f1ff;--border:#c9e4fc;--sub:#4285b3}
.metric-calories{--bg:#fff1e0;--border:#ffdfbf;--sub:#a97951}
.metric-protein{--bg:#eaf6dd;--border:#d9edc5;--sub:#58943d}
.metric-carbs{--bg:#ebf1ff;--border:#dce5fb;--sub:#5584b5}
.metric-fats{--bg:#ffedf2;--border:#f7d9e2;--sub:#ab6480}
.metric-steps{--bg:#f0e6fe;--border:#e4d4f9;--sub:#8263a9}
.metric-fibre{--bg:#f4eafa;--border:#e8d8f1;--sub:#8e66aa}
.metric-water{--bg:#e5faff;--border:#c9f0f5;--sub:#4496b0}
@media (max-width:820px) and (orientation:landscape){
  .screen{padding-left:max(7px,env(safe-area-inset-left));padding-right:max(7px,env(safe-area-inset-right));}
  .brand-name{font-size:clamp(15px,2.25vw,22px);}
  .brand-mark{font-size:19px;}
  .topbar{min-height:30px;}
  .metric-head{font-size:clamp(9px,1.35vw,12px)}
  .metric-sub{font-size:clamp(8px,1.2vw,11px)}
  .metric-main{font-size:clamp(11px,1.8vw,16px)}
}

@media (max-width:980px) and (orientation:landscape){
  .main-area{grid-template-columns:minmax(0,1fr) clamp(128px,16vw,180px);gap:8px;}
  .metric{padding:clamp(4px,.9vh,10px) clamp(3px,.6vw,8px);}  
}

/* v0.1.007: one full-height graph plus a compact right-hand metric stack. */
.date-pill select{max-width:none;width:clamp(114px,13vw,170px);text-overflow:ellipsis;}
.metric-row{grid-template-rows:repeat(8,minmax(0,1fr));grid-auto-rows:unset;overflow:hidden;}
.metric{min-height:0;overflow:hidden;}
@media (max-height:500px) and (orientation:landscape){
  .screen{padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom));gap:3px;}
  .topbar{min-height:28px;}
  .metric-row{gap:3px;}
  .metric{padding:2px 3px;border-radius:9px;}
  .metric-head{font-size:clamp(9px,1.18vw,12px);line-height:1.05;}
  .metric-icon{font-size:clamp(11px,1.4vw,16px);}
  .metric-main{font-size:clamp(12px,1.45vw,16px);line-height:1.04;}
  .metric-sub{font-size:clamp(8px,.92vw,10px);line-height:1;}
}
</style>

<script>window.DEMO_DATA = (() => {
  // Deterministic fictional data. No API calls, no personal or clinical data.
  let seed = 2718281828;
  const rnd = () => ((seed ^= seed << 13, seed ^= seed >>> 17, seed ^= seed << 5) >>> 0) / 4294967296;
  const normal = () => Math.sqrt(-2 * Math.log(Math.max(0.000001, rnd()))) * Math.cos(2 * Math.PI * rnd());
  const bound = (v, a, b) => Math.max(a, Math.min(b, v));
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone:'Pacific/Auckland',year:'numeric',month:'2-digit',day:'2-digit' }).formatToParts(new Date());
  const obj = Object.fromEntries(parts.map(p => [p.type,p.value]));
  const today = Date.UTC(Number(obj.year), Number(obj.month)-1,Number(obj.day));
  const count = 1160; // ~3.2 years; shorter time selections all have sufficient history.
  const records = [];
  let trueWeight = 84.9;
  let rollingSteps = 8800;
  for (let i=0;i<count;i++) {
    const date = new Date(today - (count - i - 1) * 86400000);
    const iso = date.toISOString().slice(0,10);
    const weekday = date.getUTCDay();
    const weekend = weekday===0 || weekday===6;
    const stepsFull = Math.round(bound(8650 + 1550*Math.sin(i/41) + 920*Math.sin(i/9.5) + (weekend ? -1150 : 400) + 1250*normal(),2000,16500));
    rollingSteps = rollingSteps*0.96 + stepsFull*0.04;
    // The maintenance *base* changes gradually; modest day-specific walking credit remains.
    const budgetMid = 2150 - 0.012*i + 40*Math.sin(i/148) + .010*(rollingSteps-8700) + .010*(stepsFull-rollingSteps);
    const budgetLowFull = Math.round(budgetMid-105);
    const budgetHighFull = Math.round(budgetMid+105);
    // A persistent slow dietary trend, with plausible but restrained daily variation.
    const intakeFull = Math.round(bound(2160 - .023*i + 85*Math.sin(i/62) + 40*Math.sin(i/13) + 66*normal(),1560,2730));
    // Nutrient grams explain the calorie total (4/4/9 and ~2 kcal/g fibre).
    const proteinFull = Math.round(bound(intakeFull*(.239 + .018*Math.sin(i/33) + .012*normal())/4,80,188));
    const fibreFull = Math.round(bound(27 + 4*Math.sin(i/30) + 3.4*normal(),15,42));
    const fatsFull = Math.round(bound(intakeFull*(.307 + .015*Math.sin(i/25) + .012*normal())/9,43,104));
    const carbsFull = Math.max(115,Math.round((intakeFull-4*proteinFull-9*fatsFull-2*fibreFull)/4));
    // Keep actual calorie energy consistent to within normal integer rounding.
    const caloriesFull = 4*proteinFull+4*carbsFull+9*fatsFull+2*fibreFull;
    const waterFull = Math.round(bound(2200 + 320*Math.sin(i/31) + 200*normal() + .04*(stepsFull-8700),900,3500));
    // Small sustained intake/expenditure imbalance affects the slow bodyweight trend.
    trueWeight += bound((caloriesFull - budgetMid)/7700,-.048,.048);
    // Noise includes water/contents fluctuation, not mistaken for fat gain.
    const weightActual = Math.round((trueWeight + .24*normal())*100)/100;
    const measured = rnd() < (weekend ? .46 : .77);
    const isToday = i===count-1;
    const frac = isToday ? .66 : 1;
    const protein = Math.round(proteinFull*frac);
    const fats = Math.round(fatsFull*frac);
    const fibre = Math.round(fibreFull*frac);
    const carbs = Math.round(carbsFull*frac);
    const calories = 4*protein + 9*fats + 2*fibre + 4*carbs;
    const steps = Math.round(stepsFull*(isToday ? .73 : 1));
    const water = Math.round(waterFull*frac);
    records.push({date:iso,weight:measured?weightActual:null,targetWeight:78,calories,budgetLow:budgetLowFull,budgetHigh:budgetHighFull,budget:Math.round(budgetMid),protein,carbs,fats,fibre,steps,stepsGoal:10000,water,waterGoal:2500,partial:isToday});
  }
  // No fabricated missing weights. All nutrient-to-calorie checks are consistent by construction.
  return records;
})();</script><script>/* MyHealthTrack v0.1.005 — visual prototype, deliberately no external services. */

    return grouped.concat(pending); // today's individual partial record is never averaged into completed days
  }
  function metricScales(rows){
    const visible=keys.filter(shown);
    const n=visible.length;
    const output={};
    if(!n) return output;
    // Arrange the selected series from top to bottom, allowing a small amount
    // of data-driven overlap; with just one selected its centre is exactly 50%.
    const span=n===1?0:n===2?.54:n===3?.68:n===4?.76:Math.min(.84,.77+.02*(n-4));
    const spacing=n>1?span/(n-1):0;
    visible.forEach((k,index)=>{
      const centre=n===1?.5:(.5+span/2-index*spacing);
      const amplitude=n===1?.31:Math.min(.27,spacing*.47,centre-.035,.965-centre);
      let values=rows.map(d=>valueFor(k,d)).filter(Number.isFinite);
      if(k==='steps'||k==='water')values=values.concat(rows.map(d=>goalFor(k,d)).filter(Number.isFinite));
      if(k==='calories')values=values.concat(rows.flatMap(d=>[d.budgetLow,d.budgetHigh]).filter(Number.isFinite));
      if(k==='weight'){
        // Include measured rolling high/low values (without inventing missing weighs).
        values=values.concat(extremaForWeight(rows).flatMap(d=>[d.lo,d.hi]).filter(Number.isFinite));
      }
      if(!values.length){output[k]={centre,offset:0,scale:0,amplitude};return;}
      const lo=quantile(values,.03),hi=quantile(values,.97);
      const mid=(lo+hi)/2;
      const minHalf={weight:.20,water:.20,calories:90,steps:1100,protein:8,fibre:3,carbs:12,fats:8}[k]||1;
      const half=Math.max((hi-lo)/2,minHalf);
      output[k]={centre,offset:mid,scale:amplitude/(half*1.22),amplitude};
    });
    return output;
  }
  function pos(k,v){const s=scales[k];return s&&Number.isFinite(v)?s.centre+(v-s.offset)*s.scale:null;}
  function textValue(k,n){
    if(!Number.isFinite(n))return 'not recorded';
    if(k==='weight')return n.toFixed(2)+' kg';
    if(k==='water')return one(n)+' L';
    if(k==='steps')return fmt(n);
    return fmt(n)+' '+units[k];
  }
  function numericTick(k,n){
    if(k==='weight')return n.toFixed(2);
    if(k==='water')return n.toFixed(1);
    return fmt(n);
  }
  function line(g,samples,x,y,colour,width,opacity,dash=''){
    let path='',active=false;
    samples.forEach((v,i)=>{
      if(v===null||!Number.isFinite(v)){active=false;return;}
      path+=(active?' L ':' M ')+x(i).toFixed(2)+' '+y(v).toFixed(2);
      active=true;
    });
    if(!path)return;
    const args={d:path,fill:'none',stroke:colour,'stroke-width':width,'stroke-opacity':opacity,'stroke-linejoin':'round','stroke-linecap':'round'};
    if(dash)args['stroke-dasharray']=dash;
    el('path',args,g);
  }
  function closedRibbon(top,bottom,x,y){
    let paths=[],start=-1;
    for(let i=0;i<=top.length;i++){
      const good=i<top.length&&Number.isFinite(top[i])&&Number.isFinite(bottom[i]);
      if(good&&start<0)start=i;
      if(!good&&start>=0){
        if(i-start>1){
          let d='M '+x(start)+' '+y(top[start]);
          for(let n=start+1;n<i;n++)d+=' L '+x(n)+' '+y(top[n]);
          for(let n=i-1;n>=start;n--)d+=' L '+x(n)+' '+y(bottom[n]);
          paths.push(d+' Z');
        }
        start=-1;
      }
    }
    return paths.join(' ');
  }
  function extremaForWeight(rows){
    // A local rolling envelope of actual weigh-ins, NOT interpolated weights.
    // 5-day neighbourhood (±2 days); no band if no nearby measurement.
    const indexByDate=new Map(DATA.map((d,i)=>[d.date,i]));
    return rows.map(d=>{
      if(d.summary)return {lo:d.weightLo,hi:d.weightHi};
      const i=indexByDate.get(d.date),measurements=[];
      for(let j=Math.max(0,i-2);j<=Math.min(DATA.length-1,i+2);j++){
        if(Number.isFinite(DATA[j].weight))measurements.push(DATA[j].weight);
      }
      return measurements.length?{lo:Math.min(...measurements),hi:Math.max(...measurements)}:{lo:null,hi:null};
    });
  }
  function gradientDefs(){
    const defs=el('defs');
    for(const k of keys){
      const grad=el('linearGradient',{id:'fade-'+k,x1:'0%',y1:'0%',x2:'0%',y2:'100%'},defs);
      el('stop',{offset:'0%','stop-color':colors[k],'stop-opacity':k==='weight'?.20:.20},grad);
      el('stop',{offset:'100%','stop-color':colors[k],'stop-opacity':0},grad);
    }
  }
  function dayMarks(group,k,rows,x,y,pw,ph,emphasis=1){
    if(!shown(k))return;
    const fadeHeight=Math.max(12,ph*.18);
    const c=colors[k];
    rows.forEach((d,i)=>{
      const v=pos(k,valueFor(k,d));
      if(v===null)return;
      const slot=geometry.slotWidths[i],barW=slot;
      const px=geometry.edges[i],py=y(v);
      const inProgress=Boolean(d.partial);
      const h=Math.max(0,Math.min(fadeHeight,y(0.018)-py));
      if(h>0){
        el('rect',{x:px,y:py,width:barW,height:h,fill:'url(#fade-'+k+')','pointer-events':'none',opacity:emphasis*(inProgress?.48:1)},group);
      }
      const sw=Math.min(3.0,Math.max(.3,slot*.22));
      const mark=el('line',{x1:px+sw/2,y1:py,x2:px+barW-sw/2,y2:py,stroke:c,'stroke-width':sw,'stroke-opacity':emphasis*(inProgress?.85:1),'stroke-linecap':'butt','pointer-events':'none'},group);
      if(inProgress&&slot>=4)mark.setAttribute('stroke-dasharray','3 2');
    });
  }
  function draw(){
    if(!DATA.length)return;
    current=rangeData();hovered=-1;tooltip.hidden=true;
    const r=host.getBoundingClientRect(),width=Math.max(260,Math.round(r.width)),height=Math.max(140,Math.round(r.height));
    const ml=clamp(width*.075,52,96),mr=clamp(width*.02,10,22),mt=clamp(height*.05,22,34),mb=clamp(height*.085,22,34);
    const pw=width-ml-mr,ph=height-mt-mb;
    const totalDays=current.reduce((a,d)=>a+(d.daysCount||1),0);
    const offsets=[];let running=0;for(const d of current){offsets.push(running);running+=d.daysCount||1;}
    const edges=offsets.map(n=>ml+n/totalDays*pw);
    const slotWidths=current.map(d=>(d.daysCount||1)/totalDays*pw);
    const x=i=>edges[i]+slotWidths[i]/2;
    const y=f=>mt+(1-f)*ph;
    geometry={ml,mr,mt,mb,pw,ph,x,y,edges,slotWidths,width,height};
    scales=metricScales(current);
    if(!shown(focusedAxis))focusedAxis=keys.find(shown)||null;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();gradientDefs();
    const cp=el('clipPath',{id:'plot-clip'},svg.querySelector('defs'));
    el('rect',{x:ml,y:mt,width:pw,height:ph},cp);
    const grid=el('g',{'aria-hidden':'true'});
    // Today's whole column is a faint, unruled in-progress region.
    if(current.at(-1)?.partial){
      const w=Math.max(2,slotWidths.at(-1));
      el('rect',{x:ml+pw-w,y:mt,width:w,height:ph,fill:'#c3cede','fill-opacity':.26,'pointer-events':'none'},grid);
    }

    for(let i=0;i<=5;i++)el('line',{x1:ml,y1:y(i/5),x2:ml+pw,y2:y(i/5),stroke:'#e2e5e7','stroke-width':1},grid);
    const tickCount=current.length<=7?current.length:width<680?5:width<1100?7:11;
    const indices=new Set();
    for(let i=0;i<tickCount;i++)indices.add(Math.round((current.length-1)*i/(tickCount-1)));
    for(const idx of indices){
      const px=x(idx);
      const t=el('text',{x:px,y:mt+ph+clamp(height*.048,16,25),'text-anchor':idx===0?'start':idx===current.length-1?'end':'middle',fill:'#283d5b','font-size':clamp(width*.012,10,16),'font-weight':800},grid);
      t.textContent=current[idx].partial?'Today':current.length>180?new Date(current[idx].date+'T12:00:00').toLocaleDateString('en-NZ',{month:'short',year:'2-digit'}):niceDate(current[idx].date);
    }
    el('line',{x1:ml,y1:mt,x2:ml,y2:mt+ph,stroke:'#aeb8c7','stroke-width':1.5},grid);
    el('line',{x1:ml,y1:mt+ph,x2:ml+pw,y2:mt+ph,stroke:'#aeb8c7','stroke-width':1.2},grid);
    const axis=scales[focusedAxis];
    if(axis){
      for(const p of [axis.centre-axis.amplitude*.76,axis.centre,axis.centre+axis.amplitude*.76]){
        const val=axis.offset+(p-axis.centre)/axis.scale;
        const t=el('text',{x:ml-6,y:y(p)+4,'text-anchor':'end',fill:colors[focusedAxis],'font-size':clamp(width*.011,9,13),'font-weight':800},grid);
        t.textContent=numericTick(focusedAxis,val);
      }
      const title=el('text',{x:ml+6,y:mt+14,fill:colors[focusedAxis],'font-size':clamp(width*.012,10,14),'font-weight':900},grid);
      title.textContent='Left scale: '+labels[focusedAxis]+' ('+units[focusedAxis]+')';
      const subtitle=el('text',{x:ml+6,y:mt+28,fill:'#6b7f97','font-size':clamp(width*.0095,8,11),'font-weight':700},grid);
      subtitle.textContent='scale applies to the selected colour only';
    }
    // Budget range, defined by its daily low/high, not a single target line.
    const background=el('g',{'aria-label':'Budget and weight ranges','clip-path':'url(#plot-clip)'});
    if(shown('calories')){
      const top=current.map(d=>pos('calories',d.budgetHigh));
      const bottom=current.map(d=>pos('calories',d.budgetLow));
      const shape=closedRibbon(top,bottom,x,y);
      if(shape)el('path',{d:shape,fill:colors.calories,'fill-opacity':.14,stroke:'none'},background);
      line(background,top,x,y,colors.calories,1.2,.50,'5 5');
      line(background,bottom,x,y,colors.calories,1.2,.50,'5 5');
    }
    if(shown('weight')){
      const extrema=extremaForWeight(current);
      const top=extrema.map(d=>pos('weight',d.hi));
      const bottom=extrema.map(d=>pos('weight',d.lo));
      const shape=closedRibbon(top,bottom,x,y);
      if(shape)el('path',{d:shape,fill:colors.weight,'fill-opacity':.20,stroke:'none'},background);
      line(background,top,x,y,colors.weight,1.7,.64);
      line(background,bottom,x,y,colors.weight,1.7,.64);
    }
    // Step and water goals belong only to their own native-unit scales.
    const goalsLayer=el('g',{'aria-label':'Daily steps and water goals','clip-path':'url(#plot-clip)'});
    for(const k of ['steps','water']){
      if(!shown(k))continue;
      const vals=current.map(d=>pos(k,goalFor(k,d)));
      line(goalsLayer,vals,x,y,colors[k],clamp(width*.0019,1.4,2.2),.62,'7 6');
    }
    // Daily readings are width-of-a-day horizontal dashes, never joined lines.
    const marks=el('g',{'aria-label':'Daily horizontal measurement marks','clip-path':'url(#plot-clip)'});
    const order=['water','fibre','fats','carbs','calories','protein','weight','steps'];
    for(const k of order)dayMarks(marks,k,current,x,y,pw,ph,optionalKeys.has(k)?.76:1);
    el('rect',{x:ml,y:mt,width:pw,height:ph,fill:'transparent','pointer-events':'all'},svg).classList.add('interaction-area');
    updateMetrics(current.at(-1));
  }
  function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function showTooltip(clientX,clientY){
    if(!geometry||!current.length)return;
    const rect=host.getBoundingClientRect(),g=geometry;
    const lx=clientX-rect.left;const idx=clamp(g.edges.findIndex((v,i)=>lx>=v&&lx<v+g.slotWidths[i]),0,current.length-1);
    if(idx===hovered)return;hovered=idx;
    const d=current[idx];
    const rows=keys.filter(shown).map(k=>`<div class="tooltip-row"><span><i class="tooltip-dot" style="background:${colors[k]}"></i>${labels[k]}</span><span>${textValue(k,valueFor(k,d))}</span></div>`);
    if(shown('calories'))rows.push(`<div class="tooltip-row"><span>Calorie budget</span><span>${fmt(d.budgetLow)}–${fmt(d.budgetHigh)} kcal</span></div>`);
    const dateTitle=d.summary?`${niceDate(d.from)}–${niceDate(d.date)} · Average (${d.daysCount} days)`:`${safe(longDate(d.date))}${d.partial?' · In progress':''}`;
    tooltip.innerHTML=`<strong>${dateTitle}</strong>${rows.join('')}${d.summary?`<div style="font-size:11px;padding-top:4px;color:#62758d">Weight: ${d.weightMeasurements} actual weigh-ins; intake/activity: daily means.</div>`:''}`;
    tooltip.hidden=false;
    const tw=tooltip.offsetWidth,th=tooltip.offsetHeight;
    tooltip.style.left=clamp(g.x(idx)+12,4,rect.width-tw-4)+'px';
    tooltip.style.top=clamp(clientY-rect.top-th/2,4,rect.height-th-4)+'px';
  }
  function updateMetrics(d){
    if(!d)return;
    const put=(id,text)=>{const n=document.getElementById(id);if(n)n.textContent=text;};
    put('weight-value',d.weight==null?'—':d.weight.toFixed(2)+' kg');
    put('weight-goal','Target '+one(d.targetWeight)+' kg');
    put('calories-value',fmt(d.calories));
    put('calories-goal',fmt(d.budgetLow)+'–'+fmt(d.budgetHigh));
    for(const k of ['protein','carbs','fats','fibre']){
      put(k+'-value',fmt(d[k])+' g');put(k+'-goal','Optional');
    }
    put('steps-value',fmt(d.steps));
    put('steps-goal','/ '+fmt(d.stepsGoal)+' ('+Math.round(100*d.steps/d.stepsGoal)+'%)');
    put('water-value',one(d.water/1000)+' L');
    put('water-goal','/ '+one(d.waterGoal/1000)+' L ('+Math.round(100*d.water/d.waterGoal)+'%)');
  }
  periodSelect.addEventListener('change',draw);
  document.querySelectorAll('.metric').forEach(button=>{
    button.setAttribute('aria-pressed',String(active[button.dataset.key]));
    button.addEventListener('click',()=>{
      const k=button.dataset.key;active[k]=!active[k];
      button.setAttribute('aria-pressed',String(active[k]));if(active[k])focusedAxis=k;draw();
    });
  });
  function pickAxisAt(clientX,clientY){
    if(!geometry||!current.length)return;
    const r=host.getBoundingClientRect(),g=geometry;
    const lx=clientX-r.left,ly=clientY-r.top;
    const idx=clamp(g.edges.findIndex((v,i)=>lx>=v&&lx<v+g.slotWidths[i]),0,current.length-1);
    let selected=null,dist=22;
    for(const k of keys.filter(shown)){
      const p=pos(k,valueFor(k,current[idx]));
      if(p===null)continue;
      const dx=(lx-g.x(idx))*.25,dy=ly-g.y(p);
      const distance=Math.hypot(dx,dy);
      if(distance<dist){dist=distance;selected=k;}
    }
    if(selected && focusedAxis!==selected){focusedAxis=selected;draw();}
  }
  host.addEventListener('pointermove',e=>showTooltip(e.clientX,e.clientY));
  host.addEventListener('pointerdown',e=>{pickAxisAt(e.clientX,e.clientY);showTooltip(e.clientX,e.clientY);});
  host.addEventListener('pointerleave',()=>{tooltip.hidden=true;hovered=-1;});
  new ResizeObserver(draw).observe(host);
  draw();
})();
</script></body>
</html>
