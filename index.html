      for(const line of String(data||'').split(/\r?\n/).slice(1)){
        const c=line.split('\t');
        if(c.length<12||c[0]!=='5')continue;
        const text=c.slice(11).join(' ').trim(),x=+c[6],y=+c[7],w=+c[8],h=+c[9],conf=+c[10];
        if(text&&[x,y,w,h].every(Number.isFinite)&&w>0&&h>0)out.push({text,x,y,w,h,conf,cx:x+w/2,cy:y+h/2});
      }
      return out;
    }
    const words=parseWords(tsv);
    const heights=words.map(w=>w.h).sort((a,b)=>a-b);
    const typicalH=heights[Math.floor(heights.length/2)]||18;
    function rowsOf(items){
      const groups=[];const tol=Math.max(6,Math.min(23,typicalH*.48));
      for(const w of [...items].sort((a,b)=>a.cy-b.cy||a.x-b.x)){
        let group=groups.filter(g=>Math.abs(g.cy-w.cy)<tol).sort((a,b)=>Math.abs(a.cy-w.cy)-Math.abs(b.cy-w.cy))[0];
        if(!group){group={cy:w.cy,words:[]};groups.push(group);}
        group.words.push(w);
        group.cy=group.words.reduce((s,v)=>s+v.cy,0)/group.words.length;
      }
      return groups.sort((a,b)=>a.cy-b.cy).map(g=>({cy:g.cy,words:g.words.sort((a,b)=>a.x-b.x),text:g.words.map(w=>w.text).join(' ')}));
    }
    const rows=rowsOf(words);
    function nutrientKey(text){
      let s=String(text).trim().replace(/^[\-*•_.,;\s]+/,'').toLowerCase().replace(/\s+/g,' ');
      if(/^(?:energy|ener9y)\b/.test(s))return 'calories';
      if(/^(?:protein|prote[i1l]n|proteln|protem|totein)\b/.test(s))return 'protein';
      if(/^(?:fat\b|total\s*fat\b)/.test(s)&&!/^(?:fat[ ,:;-]*saturat|fat[ ,:;-]*trans)/.test(s))return 'fats';
      if(/^(?:carbohydrat\w*|carbs?|ehydrate)\b/.test(s))return 'carbs';
      if(/^(?:(?:dietary|total)\s*)?(?:fib(?:re|er)|f[il1]bre)\b/.test(s))return 'fibre';
      return null;
    }
    function readNumber(w,next){
      const s=w.text.trim().replace(/^[<≈~]/,'');
      const m=/^(\d{1,6}(?:[.,]\d{1,3})?)\s*(kj|kilojoules?|kcal|kilocalories?|cal|g|mg)?[.,;:]?$/i.exec(s);
      if(!m)return null;
      let unit=(m[2]||'').toLowerCase();
      if(!unit&&next&&next.x>=w.x+w.w&&next.x-(w.x+w.w)<Math.max(21,w.h*1.6)&&/^(?:g|kj|kcal|mg)$/i.test(next.text.trim()))unit=next.text.trim().toLowerCase();
      const value=Number(m[1].replace(',','.'));
      if(!Number.isFinite(value))return null;
      // 65.19, 7.29, etc. are common OCR errors for 65.1g, 7.2g on labels.
      const suspect=!unit&&/\.[0-9]9$/.test(m[1]);
      return {...w,value,unit,raw:m[1],suspect,possible:suspect?Number(m[1].slice(0,-1).replace(',','.')):null};
    }
    const found=[];
    for(const row of rows){
      const numStart=row.words.findIndex((w,i)=>readNumber(w,row.words[i+1]));
      if(numStart<0)continue;
      const prefix=row.words.slice(0,numStart).map(w=>w.text).join(' ');
      // Use nutrient labels from anywhere in the table; skip subnutrients by
      // requiring the principal label at the start of the row.
      const key=nutrientKey(prefix);
      if(!key)continue;
      const cells=[];
      for(let i=numStart;i<row.words.length;i++){
        const w=row.words[i],c=readNumber(w,row.words[i+1]);
        if(c)cells.push(c);
      }
      if(cells.length)found.push({key,row,cells,prefix});
    }
    // Allow parsing without a perfect 100g heading; find nutrients first.
    if(!found.length)return {error:'Could not read nutrient rows. Try a closer, sharper picture of the nutrition table.',values:{},fields:[],found:0};
    const firstY=Math.min(...found.map(f=>f.row.cy));
    const minLabelX=Math.min(...found.map(f=>f.row.words[0]?.x||0));
    const headers=words.filter(w=>w.cy<firstY+typicalH*.1 && w.cy>firstY-Math.max(260,typicalH*10));
    let anchors=[];
    for(let i=0;i<headers.length;i++){
      const w=headers[i],s=w.text.toLowerCase().replace(/[.,:]/g,'');
      const match=/^100\s*(g|grams?|ml|millilit(?:res?|ers?)|9|5)?$/i.exec(s);
      if(!match)continue;
      const next=headers.filter(n=>n.x>=w.x+w.w&&n.x-w.x<Math.max(65,w.h*3)&&Math.abs(n.cy-w.cy)<Math.max(25,w.h*.9)).sort((a,b)=>a.x-b.x)[0];
      const suffix=String(match[1]||(next&&/^(?:g|gr|grams?|ml)$/i.test(next.text)?next.text:'')).toLowerCase();
      const unit=suffix.startsWith('m')?'mL':(suffix==='g'||suffix==='gr'||suffix.startsWith('gram')?'g':null);
      anchors.push({x:w.cx,y:w.cy,unit,conf:w.conf});
    }
    anchors=anchors.sort((a,b)=>b.y-a.y);
    // Determine the numeric column centres from repeated nutrient rows, without
    // assuming per-100 is necessarily the rightmost column.
    const allCells=found.flatMap(f=>f.cells.filter(c=>c.x>=minLabelX+typicalH*3));
    const clusters=[];
    for(const c of [...allCells].sort((a,b)=>a.cx-b.cx)){
      let group=clusters.filter(g=>Math.abs(c.cx-g.x)<Math.max(43,typicalH*2.1)).sort((a,b)=>Math.abs(c.cx-a.x)-Math.abs(c.cx-b.x))[0];
      if(!group){group={x:c.cx,points:[]};clusters.push(group);}
      group.points.push(c);group.x=group.points.reduce((s,w)=>s+w.cx,0)/group.points.length;
    }
    const columns=clusters.filter(g=>g.points.length>=Math.min(2,found.length)).sort((a,b)=>a.x-b.x).map(g=>({x:g.x,count:g.points.length}));
    let columnX=Number.isFinite(selectedX)?selectedX:null;
    let anchor=null;
    if(columnX===null&&anchors.length){
      anchor=anchors.find(a=>a.x>minLabelX+typicalH*4)||anchors[0];
      columnX=anchor.x;
    }
    // A single identified numeric column can be used only when a per-100
    // heading is recognised. Otherwise request the user's column choice.
    const needsColumn=columnX===null;
    const baseUnit=anchor?.unit||(/(?:per\s*)?100\s*m\s*l\b|serving\s*size[^\n]{0,30}\d+\s*m\s*l\b/i.test(rawLines.join(' '))?'mL':defaultUnit);
    const values={},uncertain=[],uncertainFields=[],notes=[];
    function flag(key,msg){if(!uncertainFields.includes(key))uncertainFields.push(key);if(!uncertain.includes(msg))uncertain.push(msg);}
    if(!needsColumn){
      // A selected point anywhere inside the right column should snap to its
      // stable numeric centre (helps when user taps the heading rather than a cell).
      const near=columns.slice().sort((a,b)=>Math.abs(a.x-columnX)-Math.abs(b.x-columnX))[0];
      if(near&&Math.abs(near.x-columnX)<Math.max(125,typicalH*5.5))columnX=near.x;
      for(const f of found){
        const candidates=f.cells.filter(c=>c.x>minLabelX+typicalH*3);
        if(!candidates.length)continue;
        // Without a clear cell at the selected column, never borrow a number
        // from the neighbouring serving column.
        const tolerance=columns.length>1?Math.min(100,Math.abs(columns[1].x-columns[0].x)*.41):Math.max(85,typicalH*4);
        const nearest=candidates.slice().sort((a,b)=>Math.abs(a.cx-columnX)-Math.abs(b.cx-columnX))[0];
        if(!nearest||Math.abs(nearest.cx-columnX)>tolerance)continue;
        const matchUnit=(c,kind)=>kind==='calories'?(c.unit==='kj'||c.unit==='kcal'||c.unit==='cal'):(!c.unit||c.unit==='g');
        const cellCandidates=candidates.filter(c=>Math.abs(c.cx-columnX)<=tolerance&&matchUnit(c,f.key));
        const chosen=cellCandidates.length?cellCandidates[0]:nearest;
        if(f.key==='calories'){
          const energy=cellCandidates.find(c=>c.unit==='kj')||(!chosen.unit?chosen:null);
          const kcal=cellCandidates.find(c=>c.unit==='kcal'||c.unit==='cal');
          if(energy){if(energy.suspect)flag('calories','Energy may contain an OCR error. Check the label.');else values.energyKj=energy.value;}
          if(kcal){if(kcal.suspect)flag('calories','Energy may contain an OCR error. Check the label.');else values.calories=kcal.value;}
        }else if(chosen.unit&&chosen.unit!=='g')continue;
        else if(chosen.suspect){
          flag(f.key,`${labels[f.key]}: OCR found “${chosen.raw}” (possibly ${chosen.possible} g). Check the printed value.`);
        }else if(values[f.key]===undefined){values[f.key]=chosen.value;}
      }
    }
    if(Number.isFinite(values.energyKj)&&!Number.isFinite(values.calories))values.calories=+(window.PieChartShared.kjToKcal(values.energyKj)).toFixed(2);
    if(Number.isFinite(values.calories)&&!Number.isFinite(values.energyKj))values.energyKj=+(window.PieChartShared.kcalToKj(values.calories)).toFixed(2);
    if(Number.isFinite(values.energyKj)&&Number.isFinite(values.calories)){
      const expected=window.PieChartShared.kjToKcal(values.energyKj);
      if(Math.abs(values.calories-expected)>Math.max(1,expected*.02)){
        notes.push('Energy figures disagree; kcal was recalculated from kJ.');
        values.calories=+expected.toFixed(2);
      }
    }
    return {values,fields:Object.keys(values),baseUnit,notes,uncertain,uncertainFields,found:found.length,
      needsColumn,columns,anchor:anchor?.x||null,chosenColumn:columnX};
  }

  let foodOcrLoader=null;
  function loadNutritionOcr(){
    if(window.Tesseract?.createWorker)return Promise.resolve(window.Tesseract);
    if(foodOcrLoader)return foodOcrLoader;
    foodOcrLoader=new Promise((resolve,reject)=>{
      const node=document.createElement('script');
      node.src='https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
      node.async=true;
      node.onload=()=>window.Tesseract?.createWorker?resolve(window.Tesseract):reject(new Error('OCR library did not initialise'));
      node.onerror=()=>reject(new Error('Could not download text recognition'));
      document.head.appendChild(node);
    }).catch(error=>{foodOcrLoader=null;throw error;});
    return foodOcrLoader;
  }
  // Canvas resize keeps image processing practical on phones; no photo is uploaded or stored.
  async function prepareNutritionPhoto(file){
    if(typeof createImageBitmap!=='function')return file;
    const image=await createImageBitmap(file).catch(()=>null);
    if(!image)return file; // Tesseract can decode the file directly on browsers without ImageBitmap.
    try{
      const longest=Math.max(image.width,image.height);
      const scale=Math.min(1,2100/longest);
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      const ctx=canvas.getContext('2d',{willReadFrequently:false});
      if(!ctx)return file;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.filter='contrast(125%) grayscale(100%)';
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      return canvas;
    }finally{image.close?.();}
  }
  // First-pass OCR finds nutrient names anywhere on the photographed package.
  // Re-read that vicinity as a table: on real packets this is far better than
  // asking the OCR engine to understand unrelated logos and packaging text.
  function focusNutritionPhoto(image,tsv){
    if(!(image instanceof HTMLCanvasElement)||!tsv)return null;
    const found=[];
    for(const line of tsv.split(/\r?\n/).slice(1)){
      const c=line.split('\t');if(c.length<12||c[0]!=='5')continue;
      const t=c.slice(11).join(' ').trim().toLowerCase();
      if(!/^(?:energy|ener9y|protein|prote[i1l]n|proteln|fat|carbohydrate|carbohydrates|dietary|fibre|fiber)$/.test(t))continue;
      const x=+c[6],y=+c[7],w=+c[8],h=+c[9];
      if([x,y,w,h].every(Number.isFinite)&&w>0&&h>0)found.push({x,y,w,h});
    }
    if(found.length<2)return null;
    // Require at least two distinct lines (avoid a phrase such as 'fat free').
    if(Math.max(...found.map(x=>x.y))-Math.min(...found.map(x=>x.y))<25)return null;
    const minX=Math.min(...found.map(w=>w.x));
    const minY=Math.min(...found.map(w=>w.y));
    const maxY=Math.max(...found.map(w=>w.y+w.h));
    const left=Math.max(0,Math.floor(minX-Math.max(42,image.width*.042)));
    const top=Math.max(0,Math.floor(minY-Math.max(130,image.height*.135)));
    const right=Math.min(image.width,Math.ceil(minX+Math.max(750,image.width*.52)));
    const bottom=Math.min(image.height,Math.ceil(maxY+Math.max(230,image.height*.18)));
    if(right-left<350||bottom-top<250)return null;
    const canvas=document.createElement('canvas');canvas.width=right-left;canvas.height=bottom-top;
    const ctx=canvas.getContext('2d');if(!ctx)return null;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,left,top,canvas.width,canvas.height,0,0,canvas.width,canvas.height);
    return canvas;
  }
  // Private consumption recording. Nutrients and water contribution are
  // snapshotted at entry time, so editing the shared FDM later cannot rewrite
  // a historical diary record.
  const measureName=label=>String(label||'').trim().replace(/^1\s+/,'');
  const unitOf=item=>isRecipe(item)?'g':item.baseUnit==='mL'?'mL':'g';
  const measureOption=(m,item)=>`${measureName(m.label)} (${roundFood(Number(m.amount))} ${unitOf(item)} each)`;
  function openFoodRecord(item){
    const db=window.PieChartDB;
    if(!db||db.state.mode!=='connected'||!db.state.uid){
      showEntry('Recording unavailable','<div class="entry-form"><p>Sign in with an authorised account to record food.</p><button type="button" class="entry-cancel" id="food-record-close">Close</button></div>');
      document.getElementById('food-record-close').addEventListener('click',backEntry);return;
    }
    let calculated;
    try{calculated=nutritionOf(item)}catch(error){
      showEntry('Cannot record food',`<p>${safe(error.message)}</p><button type="button" id="food-record-close" class="entry-cancel">Close</button>`);
      document.getElementById('food-record-close').addEventListener('click',backEntry);return;
    }
    const recipe=isRecipe(item);
    const units=[...(recipe?[{key:'whole',label:'Whole '+item.type.toLowerCase()}]:[]),
      {key:'base',label:recipe?'g':item.baseUnit==='mL'?'mL':'g'},
      ...(item.measures||[]).filter(m=>Number(m.amount)>0).map(m=>({key:'measure:'+m.label,label:measureOption(m,item)}))];
    const initialUnit=recipe?'whole':'base';
    showEntry('Record '+(item.type||'Food Item'),`<form class="entry-form" id="food-record-form">
      <strong>${safe(item.name)}</strong>
      <label for="food-record-quantity">Quantity</label>
      <input id="food-record-quantity" type="number" inputmode="decimal" min="0.01" step="any" value="${recipe?1:100}" required>
      <label for="food-record-unit">Unit</label>
      <select id="food-record-unit">${units.map(u=>`<option value="${safe(u.key)}" ${u.key===initialUnit?'selected':''}>${safe(u.label)}</option>`).join('')}</select>
      <p class="entry-note" id="food-record-preview"></p>
      <p class="food-alert" id="food-record-alert" role="alert"></p>
      <div class="entry-actions"><button type="button" id="food-record-cancel" class="entry-cancel">Cancel</button><button type="submit" class="entry-affirm">Record</button></div>
    </form>`);
    const form=document.getElementById('food-record-form');
    const quantityInput=form.querySelector('#food-record-quantity'),unitInput=form.querySelector('#food-record-unit');
    const preview=form.querySelector('#food-record-preview'),alert=form.querySelector('#food-record-alert');
    form.querySelector('#food-record-cancel').addEventListener('click',backEntry);
    function amount(){
      const qty=Number(quantityInput.value),u=unitInput.value;
      if(!Number.isFinite(qty)||qty<=0)return null;
      return window.PieChartShared.servingAmount(item,qty,u,calculated.weight);
    }
    function snapshot(){
      const a=amount();if(!Number.isFinite(a)||a<=0||a>100000)return null;
      const precise={};
      for(const k of [...nutrientKeys,'energyKj']){
        const per100=k==='energyKj'?(Number.isFinite(calculated.values.energyKj)?calculated.values.energyKj:window.PieChartShared.kcalToKj(calculated.values.calories)):calculated.values[k];
        precise[k]=per100*a/100;
      }
      const waterPrecise=(calculated.waterMlPer100||0)*a/100;
      const totals=Object.fromEntries(Object.entries(precise).map(([k,v])=>[k,roundFood(v)]));
      return {waterMl:roundFood(waterPrecise),nutrition:totals,amount:a,
        snapshotBasis:{quantity:Number(quantityInput.value),nutrition:precise,waterMl:waterPrecise}};
    }
    function update(){
      const entry=snapshot();
      preview.textContent=entry?`${roundFood(entry.amount)} ${unitOf(item)} total · ${entry.nutrition.calories} kcal · ${entry.waterMl} mL water`:'Enter a valid quantity.';
    }
    quantityInput.addEventListener('input',update);
    unitInput.addEventListener('change',()=>{
      // A newly selected slice/cup/whole recipe starts at ONE, not the 100
      // default for grams/millilitres (which could record 100 slices by mistake).
      quantityInput.value=unitInput.value==='base'?'100':'1';update();
    });
    update();
    const uid=db.state.uid;
    form.addEventListener('submit',e=>{
      e.preventDefault();alert.textContent='';
      if(db.state.uid!==uid||db.state.mode!=='connected'){alert.textContent='The signed-in account changed. Reopen recording.';return;}
      const entry=snapshot();if(!entry){alert.textContent='Enter a valid serving quantity.';return;}
      const unitKey=unitInput.value;
      try{
        db.recordFood(activeDate(),{itemId:item.id,name:item.name,type:item.type||'Food Item',
          quantity:Number(quantityInput.value),unit:unitKey==='whole'?'whole':unitOf(item),
          measure:unitKey.startsWith('measure:')?unitKey.slice(8):null,
          waterMl:entry.waterMl,nutrition:entry.nutrition,
          snapshotBasis:entry.snapshotBasis,source:'food-library'});
        // Return to the selected day's food diary, including after a saved FDM.
        dismissEntry();openFoodDiary();
      }catch(error){alert.textContent=error.message;}
    });
  }
  function diaryUnit(entry){
    if(entry.unit==='whole')return entry.type==='Dish'?'dish':'meal';
    if(entry.measure)return measureName(entry.measure);
    return entry.unit||'g';
  }
  function diaryUnitLabel(entry){
    const unit=diaryUnit(entry),count=Number(entry.quantity);
    if(!entry.measure&&entry.unit!=='whole'||count===1)return unit;
    if(/[^s]s$/.test(unit))return unit;
    if(/(s|sh|ch|x|z)$/i.test(unit))return unit+'es';

  // A daily summary always reflects the selected date's own calculated budget/goal.
  // No CSV precomputed budgets or fabricated targets enter this readout.
  function dailyRemaining(kind,date=activeDate()){
    const data=DATA.find(row=>row.date===date);
    const today=date===localDay();
    const suffix=today?"today’s":"that day’s";
    if(kind==='calories'){
      if(!Number.isFinite(data?.budgetHigh)||data.budgetHigh<=0)
        return {number:'',label:'Maximum calorie budget unavailable',unavailable:true};
      const gap=Math.round(data.budgetHigh-(Number.isFinite(data.calories)?data.calories:0));
      return gap>=0?{number:fmt(gap),label:'Calories remaining of maximum budget'}:
        {number:fmt(-gap),label:'Calories over maximum budget'};
    }
    if(kind==='water'){
      const goal=data?.waterGoal;
      if(!Number.isFinite(goal)||goal<=0)
        return {number:'',label:'Water goal not set',unavailable:true};
      const gap=(goal-(Number.isFinite(data.water)?data.water:0))/1000;
      const litres=n=>(Math.round(n*100)/100).toLocaleString('en-NZ',{maximumFractionDigits:2});
      return gap>=0?{number:litres(gap),label:'litres left to meet '+suffix+' goal'}:
        {number:litres(-gap),label:'litres above '+suffix+' goal'};
    }
    if(kind==='steps'){
      const goal=data?.stepsGoal;
      if(!Number.isFinite(goal)||goal<=0)
        return {number:'',label:'Step goal not set',unavailable:true};
      const gap=goal-(Number.isFinite(data.steps)?data.steps:0);
      return gap>=0?{number:fmt(Math.ceil(gap)),label:'steps left to meet '+suffix+' step goal'}:
        {number:fmt(Math.ceil(-gap)),label:'steps above '+suffix+' step goal'};
    }
    return {number:'',label:'',unavailable:true};
  }
  function paintDailyRemaining(node,kind,date){
    if(!node)return;
    const result=dailyRemaining(kind,date);
    node.className='daily-remaining '+kind+(result.unavailable?' unavailable':'');
    node.replaceChildren();
    if(result.number){const number=document.createElement('strong');number.textContent=result.number;node.append(number);}
    const label=document.createElement('span');label.textContent=result.label;node.append(label);
  }
  // One recorded-entry component across Food, Water, and Activities. Domain-specific
  // text and behaviour are passed in, but placement, appearance, and delete

  function recordedDiaryRow({name,detail='',quantity='',onEdit=null,onDelete,deleteMessage='',deleteLabel=''}){
    const line=document.createElement('div');line.className='food-diary-line';

    if(detail){const subtitle=document.createElement('small');subtitle.textContent=detail;title.append(subtitle);}
    const amount=document.createElement('span');amount.className='food-diary-qty';amount.textContent=quantity;
    content.append(title,amount);
    line.append(content);
    if(onDelete){
      const del=document.createElement('button');del.type='button';del.className='food-diary-delete';
      del.textContent='×';del.title=deleteLabel||'Delete recorded entry';

  // One shared local-library ranking for Foods and Activities: only personal
  // favourites appear before a search; all matching saved items appear during
  // a search, with favourites first and then relevance/alphabetical order.
  function rankLocalLibrary(items,{query='',accept=()=>true,
      matchScore=(item,q)=>item.name.toLowerCase().includes(q)?1:0,
      limit=Infinity}={}){
    const q=String(query).trim().toLowerCase();
    return items.filter(item=>accept(item)&&(q?matchScore(item,q)>0:!!item.favorite))
      .sort((a,b)=>Number(!!b.favorite)-Number(!!a.favorite)||
        (q?matchScore(b,q)-matchScore(a,q):0)||a.name.localeCompare(b.name))
      .slice(0,limit);

  // Session-bound Android scanner handoff; preserve unsaved Food Item details
  // locally, without sending label images or form contents to the companion.
  const FOOD_SCAN_HANDOFF_KEY='piechartFoodScanHandoffV1';
  const FOOD_SCAN_RETURN_PREFIX='#piechart-scan-return=';
  const FOOD_SCAN_FALLBACK_PREFIX='#piechart-scan-missing=';
  const FOOD_SCAN_MAX_AGE=30*60*1000;
  let liveFoodScanRequest=null;
  function pendingFoodScan(){
    try {
      const data=JSON.parse(localStorage.getItem(FOOD_SCAN_HANDOFF_KEY)||'null');
      if(!data||!data.id||!data.draft||!Number.isFinite(data.created)||
        Date.now()-data.created>FOOD_SCAN_MAX_AGE||Date.now()<data.created-60000){
        if(data)localStorage.removeItem(FOOD_SCAN_HANDOFF_KEY);
        return null;
      }
      return data;
    }catch{return null;}
  }
  function snapshotFoodScanForm(form){

  function restoreFoodScanForm(form,saved){

    const water=form.querySelector('#food-counts-as-water');

    const recalculation=form.querySelector('#food-water-percent');
    recalculation?.dispatchEvent(new Event('input'));
    entryContent.scrollTop=Number.isFinite(saved.scroll)?saved.scroll:0;

  function launchFoodScanHandoff({item,isLocal,diaryDate,review,status}){
    const id=crypto.randomUUID?.();
    if(!id){status.textContent='Secure scan session unavailable; use photograph instead.';return;}
    // Absolute same-app return address; no page content or form data in the launch URL.
    const returnUrl=new URL('./index.html',location.href);
    if(returnUrl.protocol!=='https:'){status.textContent='Companion launch requires HTTPS.';return;}
    returnUrl.search='';returnUrl.hash='';
    const draft={item:JSON.parse(JSON.stringify(item)),isLocal:!!isLocal,
      diaryDate:diaryDate||null,selectedDay:selectedDay||null,
      form:snapshotFoodScanForm(review)};
    const data={id,created:Date.now(),draft};
    try {localStorage.setItem(FOOD_SCAN_HANDOFF_KEY,JSON.stringify(data));}
    catch {status.textContent='Cannot preserve this Food Item draft; scanner not opened.';return;}
    liveFoodScanRequest=id;
    status.classList.remove('is-error');
    status.textContent='Opening nutrition scanner…';
    const absent=new URL(returnUrl.href);
    absent.hash=FOOD_SCAN_FALLBACK_PREFIX.slice(1)+encodeURIComponent(id);
    // Chrome Android intent URI, invoked directly by the user's button tap.
    // Browser fallback uses this same PWA, never an unknown website.
    const intent='intent://scan?request='+encodeURIComponent(id)+
      '&returnUrl='+encodeURIComponent(returnUrl.href)+
      '#Intent;scheme=piechart-companion;package=nz.piechart.companion;'+
      'S.browser_fallback_url='+encodeURIComponent(absent.href)+';end';
    window.location.href=intent;
  }
  function applyFoodScanResult(data,previous){
    const form=document.getElementById('food-review');
    if(!form||form.hidden)return false;
    const expected=['energy','protein','fat','carbohydrate','fibre'];
    const mapped={energy:'energy-kj',protein:'n-protein',fat:'n-fats',carbohydrate:'n-carbs',fibre:'n-fibre'};
    if(data.basis!==null&&data.basis!=='g'&&data.basis!=='mL')return false;
    if(!data.fields||expected.some(k=>!Object.hasOwn(data.fields,k)))return false;
    for(const key of expected){
      const row=data.fields[key];
      if(!row||typeof row!=='object')return false;
      if(row.status!==undefined&&!['confirmed','provisional','not_found'].includes(row.status))return false;
      if(row.printed===null)continue;
      if(row.status==='not_found')return false;
      if(data.basis===null)return false;
      if(typeof row.printed!=='string'||!/^\d+(?:\.\d{1,3})?$/.test(row.printed)||
          row.printed.length>12||!['g','kJ','kcal'].includes(row.unit)||
          (key!=='energy'&&row.unit!=='g')||(key==='energy'&&!['kJ','kcal'].includes(row.unit)))return false;
    }
    // Change only the selected label cells. Preserve the original draft for Undo.
    if(data.basis!==null){
      form.querySelector('#food-base-unit').value=data.basis;
      form.querySelector('#food-base-unit').dispatchEvent(new Event('change',{bubbles:true}));
    }
    for(const key of expected){
      const row=data.fields[key],input=form.querySelector('#food-'+mapped[key]);
      if(!input)continue;
      if(key==='energy'){
        const kj=form.querySelector('#food-energy-kj');
        const kcal=form.querySelector('#food-n-calories');
        if(row.printed===null){kj.value='';kcal.value='';}
        else if(row.unit==='kcal'){
          kcal.value=row.printed;
          kcal.dispatchEvent(new Event('input',{bubbles:true}));
        }else{
          kj.value=row.printed;
          kj.dispatchEvent(new Event('input',{bubbles:true}));
        }
      }else{
        input.value=row.printed===null?'':row.printed;
        input.dispatchEvent(new Event('input',{bubbles:true}));
      }
      const highlight=form.querySelector('#food-row-'+
        (key==='energy'?'calories':key==='fat'?'fats':key==='carbohydrate'?'carbs':key));
      highlight?.classList.add('food-np-changed');
      highlight?.classList.toggle('food-np-provisional',row.printed!==null&&row.status==='provisional');
      if(highlight)highlight.title=row.status==='provisional'?'Provisional scanner reading — check against the label before saving':'';
    }
    // Manual corrections clear the provisional indicator on the edited nutrient;
    // repeated scan callbacks do not install duplicate field listeners.
    if(!form.dataset.scanProvisionalListener){
      form.dataset.scanProvisionalListener='true';
      form.addEventListener('input',event=>{
        if(!event.isTrusted)return;
        const row=event.target.closest?.('.food-nutrient-row.food-np-provisional');
        if(row){row.classList.remove('food-np-provisional');row.removeAttribute('title');}
      });
    }
    form.querySelector('#food-water-percent')?.dispatchEvent(new Event('input'));
    const status=form.querySelector('#food-np-status');
    status.classList.remove('is-error');
    const isTest=data.status==='test';
    form.dataset.testNutrition=isTest?'true':'false';
    const revert=form.querySelector('#food-scan-restore-values');
    revert.hidden=false;
    revert.onclick=()=>{
      for(const id of ['food-base-unit','food-energy-kj','food-n-calories','food-n-protein','food-n-fats','food-n-carbs','food-n-fibre']){
        const field=form.querySelector('#'+id),saved=previous?.fields?.[id];
        if(field&&saved)field.value=saved.value;
      }
      form.querySelectorAll('.food-np-provisional,.food-np-changed').forEach(row=>{
        row.classList.remove('food-np-provisional','food-np-changed');row.removeAttribute('title');
      });
      form.querySelector('#food-water-percent')?.dispatchEvent(new Event('input'));
      form.dataset.testNutrition='false';revert.hidden=true;
      status.textContent='Original nutrient values restored.';
    };
    const found=expected.filter(k=>data.fields[k].printed!==null);
    const provisional=found.filter(k=>data.fields[k].status==='provisional');
    const labels={energy:'Energy',protein:'Protein',fat:'Fat',carbohydrate:'Carbohydrates',fibre:'Fibre'};
    status.textContent=isTest?
      'Five TEST values returned. Restore previous values before saving.':
      `Scan complete: ${found.length} reading${found.length===1?'':'s'} returned (${provisional.length} to check). `+
      (provisional.length?'Check '+provisional.map(k=>labels[k]).join(', ')+' against the label. ':'')+
      'Missing values are left blank. Review before saving.';
    return true;
  }
  function foodScanEditorIsCurrent(pending){
    const review=document.getElementById('food-review');
    return !!(review&&!review.hidden&&liveFoodScanRequest===pending.id);
  }
  function receiveFoodScanReturn(){
    const hash=location.hash;
    const isResult=hash.startsWith(FOOD_SCAN_RETURN_PREFIX);
    const isMissing=hash.startsWith(FOOD_SCAN_FALLBACK_PREFIX);
    if(!isResult&&!isMissing)return false;
    const pending=pendingFoodScan();
    // Do not destroy the callback URL until its session has been validated:
    // fresh Android PWA instances can resume before browser storage is ready.
    if(!pending)return false;
    // The main script runs before the Firebase module. Restoring Today's Food
    // before PieChartDB exists leaves the root diary open and loses the editor.
    if(pending.draft?.diaryDate&&!window.PieChartDB)return false;
    let payload=null;
    if(isMissing){
      try {if(decodeURIComponent(hash.slice(FOOD_SCAN_FALLBACK_PREFIX.length))!==pending.id)return false;}
      catch{return false;}
    }else{
      try {
        const encoded=hash.slice(FOOD_SCAN_RETURN_PREFIX.length);
        if(encoded.length>3000)return false;
        payload=JSON.parse(decodeURIComponent(encoded));
      }catch{return false;}
      if(payload?.request!==pending.id||!['test','complete','cancel'].includes(payload.status))return false;
    }
    try {
      if(!foodScanEditorIsCurrent(pending))restoreFoodScanEditor(pending.draft);
      const review=document.getElementById('food-review');
      if(!review||review.hidden)return false; // Keep valid result to retry later.
      liveFoodScanRequest=pending.id;
      if(isMissing){
        const status=document.getElementById('food-np-status');
        if(status){status.classList.add('is-error');
          status.textContent='Companion did not open. Your Food Item draft is restored; use the photograph option or retry.';}
      }else if(payload.status==='test'||payload.status==='complete'){
        if(!applyFoodScanResult(payload,pending.draft.form))return false;
      }
      else {
        const status=document.getElementById('food-np-status');
        if(status){status.classList.remove('is-error');
          status.textContent='Scan cancelled. Your previous Food Item values were preserved.';}
      }
    }catch(error){
      console.error('PieChart scan return could not restore its Food Item:',error);
      return false;
    }
    // Clear only after the editor and the result have actually been handled.
    history.replaceState(history.state,'',location.pathname+location.search);
    try {localStorage.removeItem(FOOD_SCAN_HANDOFF_KEY);}catch{}
    liveFoodScanRequest=null;
    return true;
  }
  function recoverInterruptedFoodScan(){
    const pending=pendingFoodScan();
    if(!pending||document.hidden)return;
    if(pending.draft?.diaryDate&&!window.PieChartDB)return;
    // Process a delayed return first; otherwise keep the request pending so a
    // late valid callback can still be applied without overwriting another item.
    if(location.hash.startsWith(FOOD_SCAN_RETURN_PREFIX)||location.hash.startsWith(FOOD_SCAN_FALLBACK_PREFIX)){
      receiveFoodScanReturn();return;
    }
    if(foodScanEditorIsCurrent(pending))return;
    try {
      restoreFoodScanEditor(pending.draft);
      liveFoodScanRequest=pending.id;
      const status=document.getElementById('food-np-status');
      if(status){status.classList.add('is-error');
        status.textContent='Your Food Item draft is restored, but no scanner results were received. ' +
          'You can retry the scan or continue editing; no readings were applied.';}
    }catch(error){console.error('PieChart could not recover its Food Item draft:',error);}
  }

    // One source order and ranking for food lookup and recipe ingredient lookup.
    function findFoodMatches(query,accept=()=>true){
      const q=String(query||'').trim().toLowerCase();
      const numeric=/^\d{7,14}$/.test(q);
      const local=rankLocalLibrary(approvedFoods,{query:q,accept,
        matchScore:foodMatchScore,limit:35});
      const sourceIds=new Set(approvedFoods.filter(x=>x.referenceId&&x.source).map(x=>x.source+'|'+x.referenceId));
      const external=records=>q.length>=2&&!/^\d+$/.test(q)?records
        .filter(item=>foodMatchScore(item,q)>0&&!sourceIds.has(item.source+'|'+item.referenceId))
        .sort((a,b)=>foodMatchScore(b,q)-foodMatchScore(a,q)||a.name.localeCompare(b.name)).slice(0,24):[];

    // Shared five-card nutrient presentation for all FDM editors. Food Items
    // have editable per-100 figures; recipes show calculated whole-recipe totals.
    // Keeping a single renderer prevents the views from diverging again.
    function fdmNutrientCards(values={}, {editable=false, origins={}}={}){
      const order=[['calories','Energy'],['protein','Protein'],['fats','Fat'],['carbs','Carbs'],['fibre','Fibre']];
      const numericValue=(value)=>Number.isFinite(value)?roundFood(value):'';
      const inputRow=(id,value,unit,label,{required=false,initial=false,whole=false}={})=>
        `<div class="food-unit-input${whole?' food-whole-energy':''}"><input ${required?'required ':''}id="${id}" aria-label="${label}" type="number" min="0" step="any" inputmode="decimal" value="${numericValue(value)}" ${initial?`data-initial="${numericValue(value)}"`:''}>${whole?`<span class="food-whole-energy-readout" id="food-whole-calories" aria-hidden="true">${Number.isFinite(value)?Math.round(value).toLocaleString('en-NZ'):''}</span>`:''}<span class="unit">${unit}</span></div>`;
      const textRow=(value,unit,secondary=false,whole=false)=>
        `<div class="food-card-readonly${secondary?' secondary':''}"><span>${Number.isFinite(value)?(whole?Math.round(value).toLocaleString('en-NZ'):nutrientText(value)):'—'}</span><span class="unit">${unit}</span></div>`;
      const cards=order.map(([key,name])=>{
        const isEnergy=key==='calories';
        const kj=Number.isFinite(values.energyKj)?values.energyKj:
          Number.isFinite(values.calories)?window.PieChartShared.kcalToKj(values.calories):null;
        const main=editable?(isEnergy?
          `<div class="food-energy-fields">${inputRow('food-energy-kj',kj,'kJ','Energy in kilojoules')}${inputRow('food-n-calories',values.calories,'Cal','Energy in kilocalories',{required:true,initial:true,whole:true})}</div>`:
          inputRow('food-n-'+key,values[key],'g',name+' per 100',{required:true,initial:true})):
          (isEnergy?`<div class="food-energy-fields">${textRow(kj,'kJ')}${textRow(values.calories,'Cal',true,true)}</div>`:textRow(values[key],'g'));
        const footer=editable&&key==='fibre'?
          '<button type="button" id="food-estimate-fibre" class="food-fibre-estimate-button" aria-label="Provide fibre estimate" title="Provide fibre estimate">Estimate</button>':'';
        return `<div class="food-nutrient-row ${isEnergy?'food-nutrient-energy ':''}${editable&&['estimated','missing'].includes(origins[key])?'is-estimated ':''}" ${editable?`id="food-row-${key}"`:''} data-nutrient="${key}">
          ${editable?`<label class="food-card-label" for="${isEnergy?'food-energy-kj':'food-n-'+key}">${name}</label>`:`<span class="food-card-label">${name}</span>`}
          <div class="food-card-values${footer?' has-estimate':''}">${main}${footer?`<div class="food-card-footer">${footer}</div>`:''}</div></div>`;
      }).join('');

    }

      function storeRecipeDraft(name,{asNew=false}={}){
        const recipeId=asNew?newFoodId():draftId;
        // A newly saved variation links to the exact FDM being edited. No
        // duplicate recipe editor is needed: this draft already has its values.
        const parent=asNew?existing:(originalParent&&compose.querySelector('#recipe-stay-linked')?.checked?originalParent:null);
        const linked=!!parent;
        const saved={...(existing||{}),id:recipeId,name,type,approved:true,brand:'',barcode:'',baseUnit:'g',source:'User recipe',
          favorite:!!compose.querySelector('#recipe-favourite').checked,
          measures:existing?.measures||[],
          savedAt:new Date().toISOString(),linked,parentId:linked?parent.id:null};
        delete saved.recents;
        if(linked){
          const base=recipeIngredients(parent);
          const baseMap=new Map(base.map(x=>[x.key,x]));
          const currentMap=new Map(draft.map(x=>[x.key,x]));
          const overrides={};
          for(const row of base){
            const current=currentMap.get(row.key);
            if(!current){overrides[row.key]=null;continue;}
            if(['itemId','quantity','unit','measureLabel'].some(k=>String(current[k]??'')!==String(row[k]??'')))overrides[row.key]={...current};
          }
          saved.overrides=overrides;
          saved.additions=copyRecipeRows(draft.filter(x=>!baseMap.has(x.key)));
          saved.ingredientOrder=draft.map(row=>row.key);
          delete saved.components;
        }else{
          saved.components=copyRecipeRows(draft);
          delete saved.overrides;delete saved.additions;delete saved.ingredientOrder;
        }
        const previous=approvedFoods.slice();
        if(editing&&!asNew)approvedFoods=approvedFoods.map(x=>x.id===draftId?saved:x);
        else approvedFoods.push(saved);
        try{
          const calculated=nutritionOf(saved);
          Object.assign(saved,{values:calculated.values,totalWeight:calculated.weight,estimatedWeight:calculated.estimatedWeight,waterMlPer100:roundFood(calculated.waterMlPer100)});
          refreshRecipes();
          if(approvedFoods.some(x=>isRecipe(x)&&x.recipeError))throw new Error('This change would break a saved recipe.');
          if(!persistApprovedFoodItems(previous))throw new Error('Could not save this recipe on this device.');
        }catch(error){approvedFoods=previous;refreshRecipes();alert.textContent=error.message;return error.message;}
        if(!editing||asNew){

      let recipeSaveChoice=null;

        const duplicateName=approvedFoods.some(x=>x.id!==draftId&&x.type===type&&x.name.toLowerCase()===name.toLowerCase());
        if(duplicateName){alert.textContent='A '+label+' with that name already exists.';nameField.focus();return;}
        try{nutritionOf({id:draftId,type,components:draft});}catch(error){alert.textContent=error.message;return;}
        if(editing&&recipeChanged()&&!recipeSaveChoice){
          offerFdmSaveActions(type,{
            originalName:existing.name,
            onRecord:recordRecipeDraft,
            onUpdate:()=>{recipeSaveChoice='update';compose.requestSubmit();},

          return;
        }
        recipeSaveChoice=null;storeRecipeDraft(name);
      };
      renderLines();
      recipeSearch.render();
    }

      <button type="button" class="entry-affirm" id="settings-activity-library">Activity library</button>
      <button type="button" class="entry-affirm" id="settings-targets">Details & Targets</button>
      <button type="button" class="entry-affirm" id="settings-account">Account</button>
    </div>`);
    document.getElementById('settings-food-library').addEventListener('click',openFoodLibrary);
    document.getElementById('settings-activity-library').addEventListener('click',()=>openActivityLibrary(false));
    document.getElementById('settings-targets').addEventListener('click',openTargetsPage);
    document.getElementById('settings-account').addEventListener('click',openAccountPage);
  }
  function openAccountPage(){
    showEntry('Account',`<div class="entry-form account-page">
      <p id="pie-db-summary" class="entry-note" aria-live="polite">Checking database…</p>
      <p id="pie-db-identity" class="entry-note" style="overflow-wrap:anywhere"></p>
      <div id="pie-db-controls" class="account-actions"></div>
      <p id="pie-db-message" class="food-copy-status" role="status" aria-live="polite"></p>
      <button type="button" class="food-secondary-action food-copy-action" id="settings-copy-foods">Copy food library</button>
      <p class="food-copy-status" id="settings-copy-status" role="status" aria-live="polite"></p>
      <details class="food-licences"><summary>Reference data sources</summary>
        <p>NZ food data © Plant & Food Research / Bioeconomy Science Institute and NZ Ministry of Health (<a href="https://www.foodcomposition.co.nz/terms/" target="_blank" rel="noopener">terms</a>). Australian food data: <a href="https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd" target="_blank" rel="noopener">FSANZ AFCD Release 3</a>, CC BY-SA 3.0 AU. USDA Foundation Foods: public-domain data. Barcode lookup: <a href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Open Food Facts</a>. Barcode nutrition may be incorrect; check details before adding it to the library.</p>
      </details>
      <button type="button" class="entry-cancel" id="account-back">Back to Settings</button>
    </div>`);
    const dbStatus=document.getElementById('pie-db-summary');
    const dbIdentity=document.getElementById('pie-db-identity');
    const dbControls=document.getElementById('pie-db-controls');
    const dbMessage=document.getElementById('pie-db-message');
    const makeButton=(label,handler)=>{
      const btn=document.createElement('button');btn.type='button';btn.className='food-secondary-action';
      btn.textContent=label;btn.addEventListener('click',handler);dbControls.append(btn);return btn;
    };
    const updateDatabaseUI=state=>{
      if(!dbStatus.isConnected)return;
      dbControls.replaceChildren();dbIdentity.textContent='';
      if(!state){dbStatus.textContent='Starting database connection…';return;}
      const descriptions={local:'Firebase is not configured. Local prototype mode.',connecting:'Connecting to Firebase…',
        'signed-out':'Not signed in. Food changes remain device-local.',
        'checking-membership':'Checking account access…',
        'not-authorized':'This Google account does not have access yet.',
        connected:'Connected to shared food library ('+state.foods.length+' records)'+
          (state.foodsFromCache?' · cached/offline view':' · server connected')+
          (state.pending?' · changes awaiting sync':'')+'.',
        error:'Database connection error.'};
      dbStatus.textContent=descriptions[state.mode]||state.mode;
      dbMessage.textContent=state.error||'';
      if(state.uid)dbIdentity.textContent=(state.displayName||state.email||'Google account')+' · User ID: '+state.uid;
      if(state.mode==='signed-out')makeButton('Sign in with Google',async()=>{
        dbMessage.textContent='';
        try{await window.PieChartDB.signIn()}catch(e){dbMessage.textContent=e.message;}
      });
      if(state.uid)makeButton('Sign out',async()=>{
        try{await window.PieChartDB.signOut()}catch(e){dbMessage.textContent=e.message;}
      });
      if(state.mode==='local')dbIdentity.textContent='Add Firebase web-app settings to firebase-config.js; see FIREBASE_SETUP.md.';
    };
    if(window.PieChartDB){
      const unsubscribe=window.PieChartDB.subscribe(updateDatabaseUI);
      entryCleanup=unsubscribe; // Stop listening once this screen is closed.
    }else{
      updateDatabaseUI(null);
      const onState=e=>updateDatabaseUI(e.detail);
      window.addEventListener('piechart-db-state',onState);
      entryCleanup=()=>window.removeEventListener('piechart-db-state',onState);
    }
    document.getElementById('account-back').addEventListener('click',backEntry);
    document.getElementById('settings-copy-foods').addEventListener('click',async()=>{
      const status=document.getElementById('settings-copy-status');
      const items=approvedFoods.slice().sort((a,b)=>a.name.localeCompare(b.name));
      const payload=JSON.stringify({format:'PieChart approved foods',version:1,items},null,2);
      try{
        if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(payload);
        status.textContent='Copied '+items.length+' '+(items.length===1?'item':'items')+'. Paste into our chat.';
      }catch(error){
        const textarea=document.createElement('textarea');textarea.readOnly=true;textarea.value=payload;
        textarea.setAttribute('aria-label','Food library to copy');textarea.style.cssText='width:100%;height:110px;font-size:11px;';
        status.replaceChildren(document.createTextNode('Select and copy the text below.'));
        status.after(textarea);textarea.focus();textarea.select();
        try{if(document.execCommand?.('copy')){textarea.remove();status.textContent='Copied '+items.length+' items. Paste into our chat.';}}catch{}
      }
    });
  }
  document.querySelector('.settings-button:not(.date-button)').addEventListener('click',openSettingsPage);
  new ResizeObserver(draw).observe(host);
  portraitView.addEventListener('change',()=>requestAnimationFrame(draw));
  draw();
  // Android may reopen the existing PWA, a different browser tab, or a new
  // PWA instance. Reconcile a pending draft on every foreground transition.
  function handleFoodScanForeground(){
    if(document.hidden)return;
    if(!receiveFoodScanReturn())recoverInterruptedFoodScan();
  }
  window.addEventListener('hashchange',handleFoodScanForeground);
  window.addEventListener('pageshow',handleFoodScanForeground);
  window.addEventListener('focus',handleFoodScanForeground);
  document.addEventListener('visibilitychange',handleFoodScanForeground);
  window.addEventListener('piechart-db-state',handleFoodScanForeground);
  handleFoodScanForeground();
})();
</script>
<script type="module" src="piechart-db.js?v=0.1.102"></script>
</body>
