/* Joules Burn's Pie Chart — single visual system, v0.1.020.
   The home screen is one eight-series chart with an integrated right legend.
   No historical overrides or per-version CSS patches. */
:root {
  color-scheme:light;
  --paper:#fffdfa;
  --ink:#132449;
  --muted:#5e708b;
  --rule:#d6dbe0;
  --blue:#3179e8;
  --purple:#9771d9;
  --aqua:#25c4d5;
  --orange:#eb9920;
  --lilac:#9c75bd;
  --green:#64b632;
  --pink:#ed5983;
  --sky:#269cf1;
}
* {box-sizing:border-box}
html,body {width:100%;height:100%;margin:0;overflow:hidden}
body {font-family:'Trebuchet MS',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select {font:inherit}
button {cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible {outline:2px solid #5697e9;outline-offset:2px}
.screen {
  width:100%;height:100dvh;display:grid;grid-template-rows:49px minmax(0,1fr);gap:0;
  padding:env(safe-area-inset-top) max(3px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(3px,env(safe-area-inset-left));
  background:var(--paper);
}
.topbar {height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;gap:9px;min-width:0}
.brand {display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.brand-mark {font-size:27px;line-height:1;filter:drop-shadow(0 1px 1px #bdcebd55)}
.brand-name {font-size:clamp(15px,3.65vw,23px);font-weight:900;letter-spacing:-.05em;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.top-actions {display:flex;align-items:center;margin-left:auto}
.settings-button {display:grid;place-items:center;width:35px;height:35px;padding:5px;border:0;background:none;color:#111}
.settings-button svg{width:100%;height:100%;fill:currentColor;stroke:currentColor;stroke-width:1.7}
.main-area {
  --legend-width:clamp(100px,25.4vw,220px);
  display:grid;grid-template-columns:minmax(0,1fr) var(--legend-width);
  min-height:0;min-width:0;gap:0;
}
.chart-shell {position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#chart {display:block;width:100%;height:100%;font-family:inherit;overflow:hidden}
.chart-tooltip {position:absolute;z-index:4;pointer-events:none;padding:8px 10px;min-width:155px;border:1px solid #d3dce9;border-radius:10px;
  background:#fffffff5;box-shadow:0 4px 16px #22385d33;color:#253957;font-size:12px}
.chart-tooltip[hidden] {display:none}
.chart-tooltip strong {display:block;margin-bottom:5px}
.tooltip-row {display:flex;justify-content:space-between;gap:12px;margin:2px 0;white-space:nowrap}
.tooltip-dot {width:7px;height:7px;display:inline-block;border-radius:50%;margin-right:4px}
.metric-row {position:relative;min-height:0;min-width:0;background:var(--paper);isolation:isolate}
.metric-divider {position:absolute;left:0;right:0;height:1px;background:var(--rule);pointer-events:none;z-index:2}
.metric {
  --line:#3179e8;
  position:absolute;left:0;right:0;width:100%;margin:0;padding:0 10px 0 6px;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;
  background:transparent;color:var(--ink);border:0;border-radius:0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.metric[hidden] {display:none}
.metric::after {content:'';position:absolute;top:8%;bottom:8%;right:0;width:4px;background:var(--line);opacity:1}
.metric.drag-ready {outline:1px dashed #8292aa;outline-offset:-2px}
.metric.dragging {z-index:15;background:var(--paper);opacity:.9}
.metric-topline {display:flex;align-items:baseline;gap:4px;max-width:100%;white-space:nowrap;min-width:0}
.metric-head {display:inline-flex;align-items:baseline;gap:3px;color:var(--ink);font-size:var(--name-size,15px);font-weight:900;line-height:1.08;letter-spacing:-.045em;white-space:nowrap}
.metric-icon {font-size:var(--icon-size,16px);line-height:1;align-self:center;min-width:0}
.metric-percent {display:block;max-width:100%;color:var(--line);font-weight:900;font-size:var(--pct-size,37px);line-height:.91;letter-spacing:-.055em;white-space:nowrap;font-variant-numeric:tabular-nums}
.metric-reading {color:var(--ink);font-size:var(--value-size,13px);font-weight:900;line-height:1.06;white-space:nowrap;letter-spacing:-.035em}
.metric-target {color:#526582;font-size:var(--target-size,10px);font-weight:700;line-height:1.06;white-space:nowrap;letter-spacing:-.022em}
.metric-target:empty {display:none}
.metric-calories .metric-target {font-size:calc(var(--target-size,10px) * .87)}
.metric-weight {--line:var(--blue)}
.metric-steps {--line:var(--purple)}
.metric-water {--line:var(--aqua)}
.metric-calories {--line:var(--orange)}
.metric-fibre {--line:var(--lilac)}
.metric-protein {--line:var(--green)}
.metric-fats {--line:var(--pink)}
.metric-carbs {--line:var(--sky)}
.visibility-btn {
  position:absolute;right:5px;top:50%;transform:translateY(-50%);z-index:2;
  border:0;border-radius:50%;background:#ffffffb5;color:#8a97a8;
  width:15px;height:15px;display:grid;place-items:center;font-size:10px;opacity:.34;padding:0;
}
.visibility-btn[aria-pressed='false'] {opacity:.6}
.hidden-metrics-toggle {
  position:absolute;right:4px;bottom:3px;z-index:20;padding:4px 7px;border:1px dashed #b9c3d4;
  background:#ffffffed;border-radius:8px;color:#64748c;font-size:10px;font-weight:900;
}
.hidden-metrics-toggle[hidden],.hidden-metrics-popup[hidden] {display:none}
.hidden-metrics-popup {position:absolute;right:0;bottom:29px;z-index:21;min-width:135px;background:#fff;
  border:1px solid #ccd6e4;border-radius:10px;box-shadow:0 7px 20px #192b4b33;padding:7px;display:grid;gap:5px}
.hidden-metrics-popup button {background:#f4f8fd;color:#243a5c;border:1px solid #d4e0ee;border-radius:7px;text-align:left;padding:7px 8px;font-size:12px}
/* Touch recording screens */
.entry-backdrop[hidden] {display:none}
.entry-backdrop {position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:max(9px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));background:#14294a82}
.entry-sheet {width:min(620px,96vw);max-height:97dvh;overflow-y:auto;overscroll-behavior:contain;
  background:#fffdfa;border:1px solid #d5e0ec;border-radius:17px;box-shadow:0 10px 30px #14233f35;padding:15px 18px}
.entry-titlebar {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.entry-titlebar h2 {margin:0;font-size:clamp(17px,2.2vw,24px);color:#263d62}
.close-entry {border-radius:50%;border:1px solid #d3dce8;color:#354c6c;background:#fff;font-size:22px;width:33px;height:33px;line-height:1}
.entry-sheet p {font-size:12px;line-height:1.35;color:#60718b;margin:5px 0 11px}
.entry-form {display:grid;gap:8px;max-height:calc(97dvh - 75px);overflow:auto;padding:2px}
.entry-form label {font-weight:800;color:#3f5370;font-size:13px}
.entry-form input,.entry-form select {width:100%;border:1px solid #beccde;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}
.entry-affirm {justify-self:end;border:0;border-radius:10px;background:#8960d8;color:white;font-weight:900;padding:10px 18px}
.entry-affirm:disabled {opacity:.4;cursor:default}
.entry-results {display:grid;gap:5px;max-height:23vh;overflow:auto}
.entry-results button {border:1px solid #dbe3ed;background:#f7fafd;color:#263c5d;border-radius:9px;padding:7px 9px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.entry-results button[aria-selected='true'] {background:#efe8ff;border-color:#9e88d5}
.entry-results small {color:#5c7189;font-size:10px}
.entry-preview {display:grid;grid-template-columns:1fr auto;gap:5px 10px;background:#edf7f2;border:1px solid #d8eadd;border-radius:9px;padding:8px;font-size:12px}
.entry-note {font-size:11px!important;color:#75849a!important}
.water-recents {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.water-recents button {min-height:46px;padding:9px 4px;border-radius:10px;border:1px solid #a9e0e8;background:#e5fafd;color:#146882;font-weight:900;touch-action:manipulation}
.water-recents .new-amount {background:#f2edfb;border-color:#d6c8ed;color:#6b46a0}
.recent-form[hidden] {display:none}
.weight-wheel-wrap {display:block}
.weight-reading {width:max-content;margin:auto;padding:7px 20px;border:1px solid #b3cbba;border-radius:9px;background:#e7f4e8;color:#2d4c57;font:bold clamp(24px,4vw,38px)/1.1 ui-monospace,Consolas,monospace;letter-spacing:.03em}
.weight-ruler-frame {position:relative;width:min(94%,640px);margin:auto;border:1px solid #c8d7e6;border-radius:12px;
  background:linear-gradient(#e8f2fc,#fff 25%,#fff 70%,#eaf2fc);box-shadow:inset 0 1px 5px #8aacc02b;touch-action:none;user-select:none}
.weight-ruler {display:block;width:100%;height:102px;touch-action:none;cursor:grab}
.weight-ruler:active {cursor:grabbing}
.weight-wheel-hint {text-align:center;font-size:11px!important}
@media (max-height:540px) and (orientation:landscape) {
  .screen {grid-template-rows:34px minmax(0,1fr)}
  .topbar {height:34px}
  .brand-mark {font-size:20px}
  .brand-name {font-size:clamp(13px,2vw,18px)}
  .settings-button {width:29px;height:29px}
  .main-area {--legend-width:clamp(120px,17vw,185px)}
  .entry-sheet {padding:9px 12px}
  .entry-form {gap:5px}
  .entry-sheet p {margin:2px 0 4px}
  .entry-results {max-height:16vh}
}
</style>

  function smoothBound(points){
    // Monotone cubic Hermite: runs through every measured rolling extreme
    // without spline overshoots (which could miss an actual high or low).
    if(!points.length)return '';
    if(points.length===1)return `M ${points[0][0]} ${points[0][1]}`;
    const d=[];
    for(let i=0;i<points.length-1;i++)d.push((points[i+1][1]-points[i][1])/(points[i+1][0]-points[i][0]));
    const m=points.map((_,i)=>i===0?d[0]:i===points.length-1?d.at(-1):d[i-1]*d[i]<=0?0:(2*d[i-1]*d[i])/(d[i-1]+d[i]));
    let path=`M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;
    for(let i=0;i<d.length;i++){

  function compressTurningPoints(points,key){
    const clean=points.filter(p=>Number.isFinite(p[key]));

    // Rolling highs/lows remain literal 7-day extrema. Draw a single knot near
    // the centre of each unchanged run so flat maxima don't create staircases.
    const knots=[];

  function weightEnvelope(rows,edges,widths,y){
    if(rows.length<2)return null;
    const centres=rows.map((_,i)=>edges[i]+widths[i]/2);
    const raw=[],leftDays=10,rightDays=10;
    const start=Date.parse(rows[0].date+'T00:00:00Z');
    const slot=widths[0];
    for(let i=-leftDays;i<rows.length+rightDays;i++){
      const day=new Date(start+i*MS_DAY).toISOString().slice(0,10);
      const ext=windowWeight(day);
      if(Number.isFinite(ext.lo)&&Number.isFinite(ext.hi))raw.push({x:centres[0]+i*slot,date:day,...ext});
    }
    if(raw.length<2)return null;
    // Smooth the DRAWN high and low boundaries; do not smooth or fabricate measured dots.
    // The seven-day measured extrema remain the source. Measurements just outside the
    // viewport contribute, so the ribbon enters the visible left edge already open.
    const radius=5;
    const values=raw.map((p,i)=>{
      let lo=0,hi=0,weight=0;
      for(let j=Math.max(0,i-radius);j<=Math.min(raw.length-1,i+radius);j++){
        const w=radius+1-Math.abs(j-i);

      }
      return{x:p.x,date:p.date,lo:lo/weight,hi:hi/weight};
    });

    // touch the boundary, rather than be hidden by the visual smoothing.
    const measured=new Map(DATA.filter(d=>Number.isFinite(d.weight)).map(d=>[d.date,d.weight]));
    for(const item of values){
      const m=measured.get(item.date);

    }

    const lower=values.map(p=>[p.x,y(pos('weight',p.lo))]);

  function dayMarks(group,k,rows,x,y,pw,ph,emphasis=1){

  function bandAtmosphere(layer,k,rows,y){

  function smoothReference(arr,radius=5){
    return arr.map((v,i)=>{

  function draw(){

  function cellsOfCsvLine(line){
    const result=[];let value='',quoted=false;
    for(let i=0;i<line.length;i++){

        if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted;

    const header=cellsOfCsvLine(lines.shift());
    if(!CSV_COLUMNS.every(k=>header.includes(k)))throw new Error('CSV must contain: '+CSV_COLUMNS.join(', '));
    const parsed=lines.map((line,n)=>{
      const cells=cellsOfCsvLine(line),record={};
      header.forEach((key,i)=>{
        if(key==='date')record.date=cells[i];
        else if(key==='partial')record.partial=/^(true|1|yes)$/i.test(cells[i]||'');
        else record[key]=cells[i]===''||cells[i]==null?null:Number(cells[i].replace(/,/g,''));

        if(!Number.isFinite(record[k]))throw new Error('Invalid '+k+' on CSV row '+(n+2));
      }
      if(record.weight!==null&&!Number.isFinite(record.weight))throw new Error('Invalid weight on CSV row '+(n+2));

    parsed.sort((a,b)=>a.date.localeCompare(b.date));

  const SETTINGS_KEY='pieChartDemoCsvOverride';
  document.querySelector('.settings-button').addEventListener('click',()=>{
    showEntry('Load editable dummy data',`<div class="entry-form">
      <p>Edit <strong>dummy-data.csv</strong> in a spreadsheet or text editor. Changes to the CSV on GitHub Pages are read when the app loads. You can also import it here for immediate testing.</p>
      <label for="csv-file">Choose dummy-data.csv</label><input type="file" id="csv-file" accept=".csv,text/csv">
      <p id="csv-result" aria-live="polite"></p>
      <button type="button" class="entry-affirm" id="csv-reset">Use bundled data</button>
    </div>`);
    document.getElementById('csv-file').addEventListener('change',async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{
        const csv=await file.text(),count=adoptDummyData(csv);
        let persisted=false;
        try{localStorage.setItem(SETTINGS_KEY,csv);persisted=true;}catch{}
        document.getElementById('csv-result').textContent='Loaded '+count+' dated records'+
          (persisted?' and saved on this device.':' for this session. Upload the CSV with the app for automatic loading.');
      }catch(error){document.getElementById('csv-result').textContent='Import failed: '+error.message;}
    });
    document.getElementById('csv-reset').addEventListener('click',async()=>{
      try{localStorage.removeItem(SETTINGS_KEY)}catch{}
      try{const res=await fetch('./dummy-data.csv',{cache:'no-store'});if(!res.ok)throw new Error();adoptDummyData(await res.text());}
      catch{DATA=window.DEMO_DATA||[];weighed=DATA.filter(d=>Number.isFinite(d.weight)).map(d=>({t:Date.parse(d.date+'T00:00:00Z'),weight:d.weight}));draw()}
      dismissEntry();
    });
  });
  async function loadPackagedCsv(){
    try{
      const override=localStorage.getItem(SETTINGS_KEY);
      if(override){adoptDummyData(override);return;}
    }catch{}
    if(!/^https?:$/.test(location.protocol))return; // standalone HTML fallback stays usable
    try{
      const response=await fetch('./dummy-data.csv',{cache:'no-store'});
      if(response.ok)adoptDummyData(await response.text());
    }catch(error){console.warn('Using included demo data:',error.message)}
  }

  new ResizeObserver(draw).observe(host);
  portraitView.addEventListener('change',()=>requestAnimationFrame(draw));
  draw();
  loadPackagedCsv();
})();
</script></body>
</html>
