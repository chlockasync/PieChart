<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>Jules Berne's Pie Chart — v0.1.027</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
/* Jules Berne's Pie Chart — single visual system, v0.1.027.
   The home screen is one eight-series chart with an integrated right legend.
   No historical overrides or per-version CSS patches. */
:root {
  color-scheme:light;
  --paper:#fffdfa;
  --ink:#132449;
  --muted:#5e708b;
  --rule:#d6dbe0;
  --blue:#3179e8;
  --purple:#9771d9;
  --aqua:#25c4d5;
  --orange:#eb9920;
  --lilac:#9c75bd;
  --green:#64b632;
  --pink:#ed5983;
  --sky:#269cf1;
}
* {box-sizing:border-box}
html,body {width:100%;height:100%;margin:0;overflow:hidden}
body {font-family:'Trebuchet MS',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select {font:inherit}
button {cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible {outline:2px solid #5697e9;outline-offset:2px}
.screen {
  width:100%;height:100dvh;display:grid;grid-template-rows:49px minmax(0,1fr);gap:0;
  padding:env(safe-area-inset-top) max(3px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(3px,env(safe-area-inset-left));
  background:var(--paper);
}
.topbar {height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;gap:9px;min-width:0}
.brand {display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.brand-mark {width:31px;height:31px;display:grid;place-items:center;flex:none}
.brand-mark img {display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 1px #1d387012)}
.brand-name {font-size:clamp(15px,3.65vw,23px);font-weight:900;letter-spacing:-.05em;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.top-actions {display:flex;align-items:center;margin-left:auto}
.settings-button {display:grid;place-items:center;width:35px;height:35px;padding:5px;border:0;background:none;color:#526582}
.settings-button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main-area {
  --legend-width:clamp(112px,calc(25.4vw + 12px),232px);
  display:grid;grid-template-columns:minmax(0,1fr) var(--legend-width);
  min-height:0;min-width:0;gap:0;
}
.chart-shell {position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#chart {display:block;width:100%;height:100%;font-family:inherit;overflow:hidden}
.chart-tooltip {position:absolute;z-index:4;pointer-events:none;padding:8px 10px;min-width:155px;border:1px solid #d3dce9;border-radius:10px;
  background:#fffffff5;box-shadow:0 4px 16px #22385d33;color:#253957;font-size:12px}
.chart-tooltip[hidden] {display:none}
.chart-tooltip strong {display:block;margin-bottom:5px}
.tooltip-row {display:flex;justify-content:space-between;gap:12px;margin:2px 0;white-space:nowrap}
.tooltip-dot {width:7px;height:7px;display:inline-block;border-radius:50%;margin-right:4px}
.metric-row {position:relative;min-height:0;min-width:0;background:var(--paper);isolation:isolate}
.metric-divider {position:absolute;left:0;right:0;height:1px;background:var(--rule);pointer-events:none;z-index:2}
.metric {
  --line:#3179e8;
  position:absolute;left:0;right:0;width:100%;margin:0;padding:0 28px 0 6px;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;
  background:transparent;color:var(--ink);border:0;border-radius:0;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.metric[hidden] {display:none}
/* The right-hand colour strip is a true progress bar: 30% colour wash,
   with a full-colour segment rising from its foot. No target = no fill. */
.metric-ratio {
  position:absolute;right:0;top:5%;height:90%;width:12px;
  background:color-mix(in srgb,var(--line) 30%,white 70%);
  overflow:hidden;pointer-events:none;
}
.metric-ratio-fill {
  display:block;position:absolute;bottom:0;left:0;right:0;
  height:calc(var(--ratio,0) * 100%);background:var(--line);
}
/* Carry the timeline baseline through the legend to the edge of the frame. */
.axis-legend-line {position:absolute;left:0;right:0;top:var(--axis-y,calc(100% - 25px));height:1px;background:#aab1be;pointer-events:none;}
.main-area {position:relative}
.axis-yesterday {position:absolute;z-index:4;transform:translateX(-50%);pointer-events:none;color:#283d5b;
  font-size:clamp(10px,1.15vw,13px);font-weight:900;line-height:1.1;white-space:nowrap}
.metric.drag-ready {outline:1px dashed #8292aa;outline-offset:-2px}
.metric.dragging {z-index:15;background:var(--paper);opacity:.9}
.metric-topline {display:flex;align-items:baseline;gap:4px;max-width:100%;white-space:nowrap;min-width:0}
.metric-head {display:inline-flex;align-items:baseline;gap:3px;color:var(--ink);font-size:var(--name-size,15px);font-weight:900;line-height:1.08;letter-spacing:-.045em;white-space:nowrap}
.metric-icon {font-size:var(--icon-size,16px);line-height:1;align-self:center;min-width:0}
.metric-percent {display:block;max-width:100%;color:var(--line);font-weight:900;font-size:var(--pct-size,37px);line-height:.91;letter-spacing:-.055em;white-space:nowrap;font-variant-numeric:tabular-nums}
.metric-reading {color:var(--ink);font-size:var(--value-size,13px);font-weight:900;line-height:1.06;white-space:nowrap;letter-spacing:-.035em}
.metric-target {color:#526582;font-size:var(--target-size,10px);font-weight:700;line-height:1.06;white-space:nowrap;letter-spacing:-.022em}
.metric-target:empty {display:none}
.metric-calories .metric-target {font-size:calc(var(--target-size,10px) * .87)}
.metric-weight {--line:var(--blue)}
.metric-steps {--line:var(--purple)}
.metric-water {--line:var(--aqua)}
.metric-calories {--line:var(--orange)}
.metric-fibre {--line:var(--lilac)}
.metric-protein {--line:var(--green)}
.metric-fats {--line:var(--pink)}
.metric-carbs {--line:var(--sky)}
.visibility-btn {
  position:absolute;right:15px;top:50%;transform:translateY(-50%);z-index:2;
  border:0;border-radius:50%;background:#ffffffb5;color:#8a97a8;
  width:15px;height:15px;display:grid;place-items:center;font-size:10px;opacity:.34;padding:0;
}
.visibility-btn[aria-pressed='false'] {opacity:.6}
.hidden-metrics-toggle {
  position:absolute;right:4px;bottom:3px;z-index:20;padding:4px 7px;border:1px dashed #b9c3d4;
  background:#ffffffed;border-radius:8px;color:#64748c;font-size:10px;font-weight:900;
}
.hidden-metrics-toggle[hidden],.hidden-metrics-popup[hidden] {display:none}
.hidden-metrics-popup {position:absolute;right:0;bottom:29px;z-index:21;min-width:135px;background:#fff;
  border:1px solid #ccd6e4;border-radius:10px;box-shadow:0 7px 20px #192b4b33;padding:7px;display:grid;gap:5px}
.hidden-metrics-popup button {background:#f4f8fd;color:#243a5c;border:1px solid #d4e0ee;border-radius:7px;text-align:left;padding:7px 8px;font-size:12px}
/* Recording screens — cohesive touch controls in PieChart's soft paper palette. */
.entry-backdrop[hidden] {display:none}
.entry-backdrop {position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  background:rgba(19,36,73,.44);backdrop-filter:blur(3px)}
.entry-sheet {width:min(570px,96vw);max-height:95dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);
  border:1px solid #d6dfeb;border-radius:20px;box-shadow:0 16px 48px #14223f45;padding:18px}
.entry-titlebar {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.entry-titlebar h2 {margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:900;letter-spacing:-.035em;color:var(--ink)}
.close-entry {width:35px;height:35px;border:1px solid #d4deeb;border-radius:50%;background:#fff;color:var(--ink);font-size:22px;line-height:1}
.entry-sheet p {font-size:12px;line-height:1.35;color:var(--muted);margin:5px 0 11px}
.entry-form {display:grid;gap:12px;max-height:calc(95dvh - 85px);overflow:auto;padding:2px}
.entry-form label {font-weight:900;font-size:13px;color:#435875}
.entry-form input,.entry-form select {width:100%;border:1px solid #bfcede;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}
.entry-affirm,.entry-cancel {min-height:47px;border-radius:13px;padding:11px 19px;font-weight:900;font-size:15px;touch-action:manipulation}
.entry-affirm {background:#8262cf;color:#fff;border:1px solid #8262cf;box-shadow:0 2px 5px #7861b525}
.entry-affirm:disabled {opacity:.4;cursor:default}
.entry-cancel {background:#eef3fa;color:#314d72;border:1px solid #d6e0ec}
.entry-actions {display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.entry-results {display:grid;gap:6px;max-height:25vh;overflow:auto}
.entry-results button {border:1px solid #dbe4ef;background:#f6faff;color:#263c5d;border-radius:10px;padding:9px 11px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.entry-results button[aria-selected='true'] {background:#efe8ff;border-color:#9e88d5}
.entry-results small {color:#5c7189;font-size:10px}
.entry-preview {display:grid;grid-template-columns:1fr auto;gap:5px 10px;background:#edf7f2;border:1px solid #d8eadd;border-radius:10px;padding:9px;font-size:12px}
.entry-note {font-size:11px!important;color:#75849a!important}
.water-recents {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:58px;gap:10px;align-items:stretch}
.water-recents button {width:100%;height:100%;min-height:0;margin:0;padding:4px;border-radius:13px;border:1px solid #a9e0e8;
  background:#e2f8fc;color:#156a84;font-weight:900;font-size:clamp(13px,2.5vw,17px);box-shadow:0 2px 4px #2e92a313;touch-action:manipulation}
.water-recents button:active {transform:scale(.98);background:#c8f2f7}
.water-recents .new-amount {background:#f1eafb;border-color:#d2c2ed;color:#684a9b}
.recent-form[hidden] {display:none}
/* Weight sheet: spacious rounded original sheet; no extra heading or number display. */
.weight-entry .entry-sheet {
  width:min(625px,96vw);padding:clamp(17px,3vw,25px);
  border-radius:26px;border:1px solid #d8e1ea;
  background:#fffdfa;box-shadow:0 16px 45px #14223f3e;
}
.weight-entry .entry-titlebar {display:none}
.weight-entry-form {display:flex;flex-direction:column;justify-content:space-between;
  min-height:clamp(258px,37vh,390px);gap:clamp(26px,4vh,70px)}
.weight-ruler-frame {width:100%;padding:8px;border:1px solid #c9d9e8;border-radius:18px;
  background:linear-gradient(180deg,#e9f3fd 0%,#fff 26%,#fff 73%,#eaf3fc 100%);
  box-shadow:inset 0 1px 8px #8aacc023;touch-action:none;user-select:none}
.weight-ruler {display:block;width:100%;height:clamp(112px,16vh,146px);touch-action:none;cursor:grab}
.weight-ruler:active {cursor:grabbing}
.weight-entry .entry-actions {margin-top:auto}
@media(max-height:540px) and (orientation:landscape) {
  .entry-sheet {padding:12px}
  .entry-titlebar {margin-bottom:9px}
  .entry-form {gap:7px}
  .water-recents {grid-auto-rows:51px;gap:8px}
  .weight-entry .entry-sheet {padding:clamp(11px,2vw,17px)}
  .weight-entry-form {min-height:clamp(228px,63vh,300px);gap:15px}
  .weight-ruler {height:clamp(100px,27vh,122px)}
  .entry-affirm,.entry-cancel {min-height:40px}
}
@media (max-height:540px) and (orientation:landscape) {
  .screen {grid-template-rows:34px minmax(0,1fr)}
  .topbar {height:34px}
  .brand-mark {width:22px;height:22px}
  .brand-name {font-size:clamp(13px,2vw,18px)}
  .settings-button {width:29px;height:29px}
  .main-area {--legend-width:clamp(120px,17vw,185px)}
  .entry-results {max-height:16vh}
}

/* Food library: genuinely empty until individual review + approval. */
.food-library-panel {display:grid;gap:12px}
.food-library-note {margin:0!important;line-height:1.45!important;font-size:12px!important}
.food-search-label {font-size:13px;font-weight:900;color:#354d6b}
.food-search {width:100%;padding:11px 13px;border:1px solid #b6c9dd;border-radius:12px;background:#fff;font-size:15px;color:var(--ink)}
.food-search-status {min-height:17px;margin:0!important;color:#667b92!important;font-size:11px!important}
.food-result-groups {max-height:min(40vh,370px);overflow:auto;display:grid;gap:12px;align-content:start}
.food-group {display:grid;gap:6px}
.food-group h3 {font-size:12px;margin:1px 0 3px;font-weight:900;color:var(--ink)}
.food-result {width:100%;background:#fff;border:1px solid #d9e2ed;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;text-align:left;color:var(--ink)}
.food-result:active {background:#eaf5fd}
.food-result .food-result-title {display:block;font-size:13px;font-weight:900;line-height:1.25}
.food-result .food-result-secondary {display:block;font-size:11px;color:#667992;margin-top:3px}
.food-source-tag {flex:0 0 auto;border-radius:6px;background:#f0f3f8;padding:5px 6px;font-size:10px;font-weight:900;color:#627b96;text-align:center;max-width:105px}
.food-source-tag.external {background:#fff0d8;color:#8e5816}
.food-source-tag.local {background:#e7f4e6;color:#366642}
.food-empty {border:1px dashed #c8d6e7;background:#f8fbff;border-radius:12px;padding:13px;color:#60758c;font-size:12px;line-height:1.5}
.food-library-commands {display:grid;grid-template-columns:1fr;gap:8px}
.food-library-commands button {font-size:13px}
.food-review[hidden],.food-browse[hidden] {display:none}
.food-review {display:grid;gap:12px}
.food-review-heading {font-size:12px;color:#5d7591;margin:0!important}
.food-field-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food-field-grid .wide {grid-column:1/-1}
.food-field {display:flex;flex-direction:column;gap:4px;min-width:0}
.food-field label {font-size:12px;color:#344d6b;font-weight:900}
.food-field input,.food-field select {width:100%;padding:10px 11px;border:1px solid #c5d4e5;border-radius:9px;background:#fff;color:var(--ink);font-size:14px}
.food-field .field-origin {color:#71859e;font-weight:700;font-size:10px}
.food-field .field-origin.estimated {color:#9a5d1b}
.food-measures {display:grid;gap:7px}
.food-measure-row {display:grid;grid-template-columns:minmax(0,1fr) 105px 28px;gap:7px}
.food-measure-row input {min-width:0;width:100%;border:1px solid #c5d4e5;border-radius:8px;padding:8px 10px;background:#fff}
.food-measure-row button {border:1px solid #d2dce8;background:#f4f7fc;border-radius:8px;color:var(--ink);font-weight:900}
.food-secondary-action {background:transparent;border:1px dashed #bccbdd;border-radius:10px;color:#405d80;padding:9px 12px;font-size:12px;font-weight:900}
.food-review-actions {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food-alert {font-size:12px;font-weight:800;color:#a14926;min-height:16px;margin:0!important}
.food-source-credit {font-size:11px;color:#697e95}
.food-source-credit a {color:#386b98}
@media(max-height:540px) and (orientation:landscape) {
  .food-result-groups {max-height:22vh}
  .food-review {gap:8px}
}

</style>

    // Calendar-aligned month markers, then years as the history grows.
    // This moves during the swipe preview; individual days are never grouped.
    const last=[...DATA].reverse().find(d=>!d.partial)||DATA.at(-1);

          if(val===''||!Number.isFinite(Number(val))||Number(val)<0){alert.textContent='Enter a non-negative value or explicit estimate for '+nutrientNames[k]+'.';control.focus();return;}

          origins[k]=Number.isFinite(item.values?.[k])&&values[k]===item.values[k]?(item.origins?.[k]||'user'):
            item.origins?.[k]==='missing'?'estimated':item.source==='Open Food Facts'?'user-edited':'user-entered';
        }
        const measures=[];
        for(const row of document.querySelectorAll('#food-measures .food-measure-row')){
          const label=row.querySelector('.measure-name').value.trim();const amountText=row.querySelector('.measure-grams').value.trim();
          if(!label&&!amountText)continue;
          const amount=Number(amountText);
          if(!label||!amountText||!Number.isFinite(amount)||amount<=0){alert.textContent='Each familiar measure needs a name and a positive g/mL amount.';return;}
          measures.push({label,amount});
        }
        const duplicate=approvedFoods.find(x=>x.id!==item.id&&((barcode&&x.barcode===barcode)||(x.name.toLowerCase()===name.toLowerCase()&&x.brand.toLowerCase()===brand.toLowerCase())));
        if(duplicate){alert.textContent='This item is already in your library. Choose it from the approved results to edit.';return;}
        const source=document.getElementById('food-source').value.trim();
        if(!source){alert.textContent='Please identify the nutrition source, even if it is an estimate.';return;}
        const saved={...item,id:isLocal?item.id:(crypto.randomUUID?.()||'f-'+Date.now()+'-'+Math.random().toString(36).slice(2)),
          approved:true,name,brand,barcode,baseUnit:document.getElementById('food-base-unit').value,
          values,origins,source,measures,recents:item.recents||[],savedAt:new Date().toISOString()};
        const previous=approvedFoods.slice();
        if(isLocal)approvedFoods=approvedFoods.map(x=>x.id===item.id?saved:x);
        else approvedFoods.push(saved);
        if(!persistApprovedFoodItems()){approvedFoods=previous;alert.textContent='Could not store this item in this browser. No approval saved.';return;}
        review.hidden=true;browse.hidden=false;entryHeading.textContent='Food library';
        // Search is no longer a request to add a new food. It is now a local approved item.
        input.value=name;externalItems=[];externalQuery='';
        status.textContent=(isLocal?'Changes saved.':'Approved and added to this browser’s food library.');
        render();
      };
    }
    document.getElementById('food-create').addEventListener('click',()=>openFoodReview({name:input.value.trim(),brand:'',barcode:'',baseUnit:'g',values:{},origins:{},source:'Manual estimate / product label',measures:[],recents:[]},false));
    input.addEventListener('input',scheduleExternal);
    render();
  }
  let selectedFood=null;
  function showEntry(kind,html){entryHeading.textContent=kind;entryContent.innerHTML=html;entryBackdrop.classList.toggle('weight-entry',kind==='Record weight');entryBackdrop.hidden=false;}
  function dismissEntry(){clearTimeout(foodSearchTimer);foodFetchGeneration++;entryBackdrop.hidden=true;selectedFood=null;}
  closeEntry.addEventListener('click',dismissEntry);
  entryBackdrop.addEventListener('pointerdown',e=>{if(e.target===entryBackdrop)dismissEntry();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!entryBackdrop.hidden)dismissEntry();});
  function openEntry(type){
    const today=DATA.at(-1),lastMeasured=[...DATA].reverse().find(r=>r!==today&&Number.isFinite(r.weight));
    if(type==='water'){
      const recentsKey='pieChartWaterRecentMl';
      let recent=[];
      try{const saved=JSON.parse(localStorage.getItem(recentsKey));recent=Array.isArray(saved)?saved.filter(n=>Number.isFinite(n)&&n>0).slice(0,5):[250,500,330,750,200];}catch{recent=[250,500,330,750,200]}
      recent=[...new Set([...recent,250,500,330,750,200])].slice(0,5);
      showEntry('Record water',`<div class="entry-form"><div class="water-recents" id="water-recents"></div><form class="entry-form recent-form" id="water-new-form" hidden><label for="water-new-amount">New amount (mL)</label><input id="water-new-amount" type="number" inputmode="decimal" min="1" max="10000" step="1" value="250" required><button class="entry-affirm">Record amount</button></form></div>`);
      const add=v=>{
        v=Math.round(Number(v));if(!Number.isFinite(v)||v<=0||v>10000)return;
        today.water+=v;recent=[v,...recent.filter(n=>n!==v)].slice(0,5);
        try{localStorage.setItem(recentsKey,JSON.stringify(recent))}catch{}
        dismissEntry();draw();
      };
      const row=document.getElementById('water-recents');
      for(const v of recent){const b=document.createElement('button');b.type='button';b.textContent=v>=1000?(v/1000).toFixed(v%1000?2:1)+' L':v+' mL';b.addEventListener('click',()=>add(v));row.append(b)}
      const newBtn=document.createElement('button');newBtn.type='button';newBtn.className='new-amount';newBtn.textContent='+ New amount';row.append(newBtn);
      newBtn.addEventListener('click',()=>{document.getElementById('water-new-form').hidden=false;document.getElementById('water-new-amount').focus()});
      document.getElementById('water-new-form').addEventListener('submit',e=>{e.preventDefault();add(document.getElementById('water-new-amount').value)});
    }else if(type==='weight'){
      const prev=lastMeasured?Number(lastMeasured.weight):80;
      const startWeight=Math.round((today.weight??prev)*100)/100;
      showEntry('Record weight',`<form class="weight-entry-form" id="weight-form">
        <div class="weight-ruler-frame"><canvas class="weight-ruler" id="weight-ruler" tabindex="0" role="slider" aria-label="Weight in kilograms. Swipe left or right; gentle movements adjust in 0.01 kg increments." aria-valuemin="20" aria-valuemax="400" aria-valuenow="${startWeight}"></canvas></div>
        <div class="entry-actions"><button class="entry-cancel" id="weight-cancel" type="button">Cancel</button><button class="entry-affirm" type="submit">Record</button></div>
      </form>`);
      const wheel=document.getElementById('weight-ruler');
      document.getElementById('weight-cancel').addEventListener('click',dismissEntry);
      const MAX=40000,MIN=2000,PIXELS_PER_CENT=14;
      let position=startWeight*100,gestureW=null,velocity=0,animation=0;
      const safePos=p=>clamp(p,MIN,MAX);
      const show=()=>{
        const value=(Math.round(position)/100).toFixed(2);
        wheel.setAttribute('aria-valuenow',value);
        paintRuler();
      };
      function paintRuler(){
        const box=wheel.getBoundingClientRect();if(!box.width)return;
        const ratio=window.devicePixelRatio||1;
        wheel.width=Math.round(box.width*ratio);wheel.height=Math.round(box.height*ratio);
        const ctx=wheel.getContext('2d');ctx.scale(ratio,ratio);
        const w=box.width,h=box.height,mid=w/2;
        const minTick=Math.floor(position-(mid+20)/PIXELS_PER_CENT);
        const maxTick=Math.ceil(position+(mid+20)/PIXELS_PER_CENT);
        ctx.textAlign='center';ctx.textBaseline='alphabetic';
        const tickTop=h*.45,tickBottom=h*.76,numberY=h*.94;
        // The mechanical scale's tick marks move freely behind the fixed pointer.
        for(let tick=minTick;tick<=maxTick;tick++){
          if(tick<MIN||tick>MAX)continue;
          const x=mid+(tick-position)*PIXELS_PER_CENT;
          const major=tick%10===0,half=tick%5===0;
          ctx.strokeStyle=major?'#5b769a':'#aebfd4';ctx.lineWidth=major?1.5:1;
          ctx.beginPath();ctx.moveTo(x,tickTop);ctx.lineTo(x,major?tickBottom:half?h*.66:h*.57);ctx.stroke();
        }
        // Nearby tenth-of-a-kg labels travel with the ruler. They disappear
        // behind the fixed centre readout rather than passing across its digits.
        const centreClearance=36;
        ctx.save();ctx.beginPath();
        ctx.rect(0,h*.77,Math.max(0,mid-centreClearance),h*.23);
        ctx.rect(mid+centreClearance,h*.77,Math.max(0,w-mid-centreClearance),h*.23);
        ctx.clip();
        ctx.fillStyle='#314867';ctx.font='500 14px Arial, sans-serif';
        for(let tick=minTick;tick<=maxTick;tick++){
          if(tick<MIN||tick>MAX||tick%10!==0)continue;
          const x=mid+(tick-position)*PIXELS_PER_CENT;
          ctx.fillText((tick/100).toFixed(1),x,numberY);
        }
        ctx.restore();
        // The centre measurement always remains below the orange pointer,
        // using the same type treatment as the moving ruler numbers.
        ctx.fillStyle='#263f64';ctx.font='600 14px Arial, sans-serif';
        ctx.fillText((Math.round(position)/100).toFixed(2),mid,numberY);
        // Centre line and pointer sit above the moving ruler ticks.
        ctx.strokeStyle='#d08062';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(mid,h*.27);ctx.lineTo(mid,tickBottom);ctx.stroke();
        ctx.fillStyle='#d08062';ctx.beginPath();
        ctx.moveTo(mid-9,h*.15);ctx.lineTo(mid+9,h*.15);ctx.lineTo(mid,h*.28);ctx.closePath();ctx.fill();
      }
      function stop(){if(animation)cancelAnimationFrame(animation);animation=0}
      function factor(speed){
        // Fine gestures remain geared down. Fast flicks keep exponential travel.
        if(speed<=.55)return .5;
        return Math.min(36,.5*Math.exp((speed-.55)*5.5));
      }
      wheel.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;
        stop();velocity=0;gestureW={id:e.pointerId,x:e.clientX,t:performance.now(),lastX:e.clientX,lastT:performance.now(),history:[],maxSpeed:0};
        try{wheel.setPointerCapture(e.pointerId)}catch{}
      });
      wheel.addEventListener('pointermove',e=>{
        if(!gestureW||gestureW.id!==e.pointerId)return;
        const now=performance.now(),dx=e.clientX-gestureW.lastX,dt=Math.max(1,now-gestureW.lastT);
        const pxSpeed=Math.abs(dx)/Math.max(dt,16);
        gestureW.maxSpeed=Math.max(gestureW.maxSpeed,pxSpeed);
        position=safePos(position-dx/PIXELS_PER_CENT*factor(pxSpeed));
        const instant=(-dx/PIXELS_PER_CENT*factor(pxSpeed))/dt;
        gestureW.history.push({t:now,instant});
        gestureW.history=gestureW.history.filter(item=>now-item.t<110);
        velocity=.6*instant+.4*velocity;
        gestureW.lastX=e.clientX;gestureW.lastT=now;
        e.preventDefault();show();
      });
      wheel.addEventListener('pointerup',e=>{
        if(!gestureW||gestureW.id!==e.pointerId)return;
        const now=performance.now(),recent=now-gestureW.lastT;
        if(recent>90||gestureW.maxSpeed<.8)velocity=0;
        gestureW=null;
        let v=clamp(velocity,-.85,.85),last=now;
        const glide=timestamp=>{
          const dt=Math.min(timestamp-last,40);last=timestamp;
          position=safePos(position+v*dt);v*=Math.exp(-dt/170);
          show();
          if(Math.abs(v)>.003&&position>MIN&&position<MAX)animation=requestAnimationFrame(glide);
          else{position=Math.round(position);show();animation=0}
        };
        if(Math.abs(v)>.006)animation=requestAnimationFrame(glide);
        else{position=Math.round(position);show()}
      });
      wheel.addEventListener('pointercancel',()=>{gestureW=null;stop();position=Math.round(position);show()});
      wheel.addEventListener('keydown',e=>{
        if(['ArrowLeft','ArrowRight','PageUp','PageDown'].includes(e.key)){
          e.preventDefault();stop();position=safePos(Math.round(position)+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:e.key==='PageUp'?100:-100));show();
        }
      });
      wheel.addEventListener('wheel',e=>{e.preventDefault();stop();position=safePos(Math.round(position)+(e.deltaY>0?-1:1));show()},{passive:false});
      requestAnimationFrame(show);
      document.getElementById('weight-form').addEventListener('submit',e=>{
        e.preventDefault();stop();const v=Math.round(position)/100;
        if(!Number.isFinite(v)||v<20||v>400)return;
        today.weight=v;
        weighed=DATA.filter(d=>Number.isFinite(d.weight)).map(d=>({t:Date.parse(d.date+'T00:00:00Z'),weight:d.weight}));
        dismissEntry();draw();
      });
    }else{
      // Food diary recording is a later stage; do not use fabricated demo foods.
      openFoodLibrary();
    }
  }
  // On touchscreen Chrome, the first user interaction may start fullscreen.
  // Browsers cannot auto-enter fullscreen on page load without user activation.
  let triedFullscreen=false;
  document.addEventListener('pointerup',e=>{
    if(triedFullscreen||!e.isTrusted||navigator.maxTouchPoints<1||!document.documentElement.requestFullscreen)return;
    triedFullscreen=true;
    if(document.fullscreenElement)return;
    document.documentElement.requestFullscreen().then(()=>{
      // Orientation is user-controlled: the same graph supports both portrait and landscape.
    }).catch(()=>{});
  },{capture:true});


  // Editable sample data. The packaged CSV is read automatically on GitHub Pages.
  // Local CSV import overrides it only on this device (demo mode).
  const CSV_COLUMNS=['date','weight','targetWeight','calories','budgetLow','budgetHigh','budget',
    'protein','proteinGoal','carbs','fats','fibre','fibreGoal','steps','stepsGoal','water','waterGoal','partial'];
  function cellsOfCsvLine(line){
    const result=[];let value='',quoted=false;
    for(let i=0;i<line.length;i++){
      const char=line[i];
      if(char==='"'){
        if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted;
      }else if(char===','&&!quoted){result.push(value.trim());value=''}else value+=char;
    }
    result.push(value.trim());return result;
  }
  function parseDummyCsv(text){
    const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim());
    if(!lines.length)throw new Error('CSV is empty');
    const header=cellsOfCsvLine(lines.shift());
    if(!CSV_COLUMNS.every(k=>header.includes(k)))throw new Error('CSV must contain: '+CSV_COLUMNS.join(', '));
    const parsed=lines.map((line,n)=>{
      const cells=cellsOfCsvLine(line),record={};
      header.forEach((key,i)=>{
        if(key==='date')record.date=cells[i];
        else if(key==='partial')record.partial=/^(true|1|yes)$/i.test(cells[i]||'');
        else record[key]=cells[i]===''||cells[i]==null?null:Number(cells[i].replace(/,/g,''));
      });
      if(!/^\d{4}-\d{2}-\d{2}$/.test(record.date)||!Number.isFinite(Date.parse(record.date+'T00:00:00Z')))
        throw new Error('Invalid date on CSV row '+(n+2));
      for(const k of CSV_COLUMNS.filter(k=>!['date','partial','weight'].includes(k))){
        if(!Number.isFinite(record[k]))throw new Error('Invalid '+k+' on CSV row '+(n+2));
      }
      if(record.weight!==null&&!Number.isFinite(record.weight))throw new Error('Invalid weight on CSV row '+(n+2));
      return record;
    });
    if(parsed.length<2)throw new Error('CSV needs at least two dated records');
    parsed.sort((a,b)=>a.date.localeCompare(b.date));
    if(parsed.some((row,i)=>i>0&&row.date===parsed[i-1].date))throw new Error('Duplicate dates in CSV');
    return parsed;
  }
  function adoptDummyData(csv){
    const next=parseDummyCsv(csv);
    DATA=next;
    weighed=DATA.filter(d=>Number.isFinite(d.weight)).map(d=>({t:Date.parse(d.date+'T00:00:00Z'),weight:d.weight}));
    daysVisible=Math.min(100,DATA.length);
    draw();
    return next.length;
  }
  const SETTINGS_KEY='pieChartDemoCsvOverride';
  document.querySelector('.settings-button').addEventListener('click',()=>{
    showEntry('Settings',`<div class="entry-form">
      <button type="button" class="entry-affirm" id="settings-food-library">Food library · ${approvedFoods.length} approved items</button>
      <p class="entry-note">Personal food items are device-local during development, not yet synced or backed up.</p>
      <hr style="width:100%;border:0;border-top:1px solid #dae2ef">
      <p><strong>Demo graph data</strong></p>
      <p>Edit <strong>dummy-data.csv</strong> in a spreadsheet or text editor. Changes to the CSV on GitHub Pages are read when the app loads. You can also import it here for immediate testing.</p>
      <label for="csv-file">Choose dummy-data.csv</label><input type="file" id="csv-file" accept=".csv,text/csv">
      <p id="csv-result" aria-live="polite"></p>
      <button type="button" class="entry-cancel" id="csv-reset">Use bundled data</button>
    </div>`);
    document.getElementById('settings-food-library').addEventListener('click',openFoodLibrary);
    document.getElementById('csv-file').addEventListener('change',async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{
        const csv=await file.text(),count=adoptDummyData(csv);
        let persisted=false;
        try{localStorage.setItem(SETTINGS_KEY,csv);persisted=true;}catch{}
        document.getElementById('csv-result').textContent='Loaded '+count+' dated records'+
          (persisted?' and saved on this device.':' for this session. Upload the CSV with the app for automatic loading.');
      }catch(error){document.getElementById('csv-result').textContent='Import failed: '+error.message;}
    });
    document.getElementById('csv-reset').addEventListener('click',async()=>{
      try{localStorage.removeItem(SETTINGS_KEY)}catch{}
      try{const res=await fetch('./dummy-data.csv',{cache:'no-store'});if(!res.ok)throw new Error();adoptDummyData(await res.text());}
      catch{DATA=window.DEMO_DATA||[];weighed=DATA.filter(d=>Number.isFinite(d.weight)).map(d=>({t:Date.parse(d.date+'T00:00:00Z'),weight:d.weight}));draw()}
      dismissEntry();
    });
  });
  async function loadPackagedCsv(){
    try{
      const override=localStorage.getItem(SETTINGS_KEY);
      if(override){adoptDummyData(override);return;}
    }catch{}
    if(!/^https?:$/.test(location.protocol))return; // standalone HTML fallback stays usable
    try{
      const response=await fetch('./dummy-data.csv',{cache:'no-store'});
      if(response.ok)adoptDummyData(await response.text());
    }catch(error){console.warn('Using included demo data:',error.message)}
  }

  new ResizeObserver(draw).observe(host);
  portraitView.addEventListener('change',()=>requestAnimationFrame(draw));
  draw();
  loadPackagedCsv();
})();
</script></body>
